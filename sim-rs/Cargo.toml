[package]
name = "adbuy-sim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false  # system wasm-opt version mismatch; Rust release profile is already opt-level=z

[profile.release]
opt-level = "z"
lto = true
strip = true

