<!doctype html><html><head><meta charset="utf-8"><title>WB Record Fixture</title>
<style>body{font:16px system-ui;margin:0;background:#0c0f0c;color:#eafff0;display:grid;place-items:center;height:100vh}
.card{background:#11331f;border:1px solid #3fe081;border-radius:16px;padding:40px;width:420px;text-align:center}
h1{color:#3fe081;margin:0 0 8px}button{margin-top:18px;padding:12px 20px;font-size:16px;background:#3fe081;border:0;border-radius:10px;cursor:pointer}
.ok{margin-top:18px;color:#3fe081;font-weight:600;min-height:22px}input{margin-top:14px;padding:10px;width:90%;border-radius:8px;border:1px solid #2a5;background:#0c1c12;color:#eafff0}</style>
</head><body>
<div class="card">
  <h1 id="title">Workbooks Demo</h1>
  <p>Type a name, then run the demo.</p>
  <input id="name" placeholder="your name">
  <button id="go">Run demo</button>
  <div class="ok" id="status"></div>
</div>
<script>
document.getElementById('go').onclick=()=>{
  const n=document.getElementById('name').value||'friend';
  document.getElementById('status').textContent='Demo ran successfully for '+n+' ✓';
};
</script>
</body></html>
