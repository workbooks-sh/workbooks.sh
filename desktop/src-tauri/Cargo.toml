[package]
name = "workbooks-desktop"
version = "0.1.0"
edition = "2021"
description = "Workbooks Desktop — a lean Tauri shell over the deploy-kit runtime daemon"

[lib]
name = "workbooks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# The OQL kernel embedded — weave/tangle/validate workbooks LOCALLY, no Elixir,
# no Docker. oql.wasm is a WASIp2 component; wasmtime + wasmtime-wasi host it.
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"
