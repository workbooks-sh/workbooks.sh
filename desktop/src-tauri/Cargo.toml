[package]
name = "workbooks-desktop"
version = "0.1.0"
edition = "2021"
description = "Workbooks Desktop — a lean Tauri shell over the deploy-kit runtime daemon"

[lib]
name = "workbooks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Native shell capabilities (Phase B): file-tree walk + live watch, secrets in
# the OS keychain, PTY terminals, ed25519 identity, loopback WorkOS sign-in.
walkdir = "2"
notify = "6"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rayon = "1"
regex = "1"
base64 = "0.22"
portable-pty = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
bs58 = "0.5"
sha2 = "0.10"
open = "5"
tiny_http = "0.12"
# The OQL kernel embedded — weave/tangle/validate workbooks LOCALLY, no Elixir,
# no Docker. oql.wasm is a WASIp2 component; wasmtime + wasmtime-wasi host it.
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"
