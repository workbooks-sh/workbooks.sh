# Canonical named theme palettes — the single source of truth.
#
# Each [[theme]] maps the workbook token vocabulary (see tokens.css) to a named
# palette, with separate [theme.light] and [theme.dark] values. TOML is chosen
# per the WRI precedent (runtime/docs/WRI.org): human-authored config, declarative,
# Rust-native (Cargo lives in TOML), parseable everywhere without an org parser.
#
# Consumers:
#   - desktop (desktop/src-tauri/src/themes.rs) seeds builtins from here instead
#     of hardcoding the maps in Rust.
#   - any workbook can read this to bake an in-artifact theme picker.
# One source → homogeneous theming across desktop + standalone workbooks. Dynamic
# in-app switching keeps working via the wb-theme postMessage path
# (apply-host-theme.js): a host writes a theme's tokens to :root and every open
# workbook re-tones live.

[[theme]]
id = "theme_default"
name = "Workbooks Default"
description = "The original Workbooks Desktop palette."
[theme.light]
color-page = "#fafafa"
color-surface = "#ffffff"
color-surface-soft = "#f4f4f5"
color-border = "rgba(15, 15, 15, 0.08)"
color-border-strong = "rgba(15, 15, 15, 0.16)"
color-fg = "#0f0f0f"
color-fg-muted = "rgba(15, 15, 15, 0.56)"
color-fg-subtle = "rgba(15, 15, 15, 0.36)"
color-accent = "#0f0f0f"
color-primary-bg = "#0f0f0f"
color-primary-fg = "#fafafa"
color-ring = "rgba(15, 15, 15, 0.32)"
color-grid-line = "rgba(15, 15, 15, 0.045)"
[theme.dark]
color-page = "#1a1a1f"
color-surface = "#25252b"
color-surface-soft = "#2e2e35"
color-border = "rgba(255, 255, 255, 0.12)"
color-border-strong = "rgba(255, 255, 255, 0.24)"
color-fg = "#f4f4f5"
color-fg-muted = "rgba(244, 244, 245, 0.62)"
color-fg-subtle = "rgba(244, 244, 245, 0.38)"
color-accent = "#f4f4f5"
color-primary-bg = "#3a3a45"
color-primary-fg = "#f4f4f5"
color-ring = "rgba(255, 255, 255, 0.22)"
color-grid-line = "rgba(255, 255, 255, 0.05)"

