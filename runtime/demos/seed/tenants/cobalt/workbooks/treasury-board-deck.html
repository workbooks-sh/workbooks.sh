<!doctype html>
<!-- workbook: treasury-board-deck — Signal board presentation. Single-file artifact, deterministic, offline. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="darkreader-lock" />
  <meta name="color-scheme" content="dark light" />
  <title>Signal — Q2 2026 Treasury Review</title>
  <script id="workbook-spec" type="application/json">
    {
      "id": "treasury-board-deck",
      "kind": "presentation",
      "title": "Q2 2026 Treasury Review — Board Deck",
      "owner": "signal",
      "workspace": "board-and-reporting",
      "source": "data/q2-board.csv",
      "frozen_at": "2026-06-30T16:00:00Z"
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    /* ===== Signal design system override — institutional / data-dense ===== */
    .dot, .dot.sm {
      border-radius:0 !important; background:transparent !important; box-shadow:none !important;
      width:16px !important; height:16px !important; position:relative; display:inline-block;
      background-image:
        linear-gradient(var(--green) 0 0), linear-gradient(var(--green) 0 0),
        linear-gradient(var(--green) 0 0), linear-gradient(var(--green) 0 0) !important;
      background-repeat:no-repeat !important;
      background-size:3px 40%, 3px 62%, 3px 84%, 3px 100% !important;
      background-position:0 100%, 4.3px 100%, 8.6px 100%, 13px 100% !important;
    }
    .dot.sm { width:13px !important; height:13px !important;
      background-size:2px 40%, 2px 62%, 2px 84%, 2px 100% !important;
      background-position:0 100%, 3.6px 100%, 7.2px 100%, 10.8px 100% !important; }
    .brand .name { letter-spacing:-.02em !important; }
    :root {
      --green:#3da9fc; --green-deep:#1d6fd6; --ink:#e9edf4; --bg:#0a0d13;
      --muted:#8893a6; --line:#1c232f; --card:#10151f; --warn:#f5a524; --warn-bg:#241a08;
      --trapped:#ff7a45; --danger:#ff7a45; --soft:#141a24;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; }
    body {
      font:15px/1.5 'Space Grotesk',system-ui,-apple-system,sans-serif; color:var(--ink);
      background:var(--bg)
        linear-gradient(transparent 23px, color-mix(in srgb, var(--line) 34%, transparent) 24px),
        linear-gradient(90deg, transparent 23px, color-mix(in srgb, var(--line) 34%, transparent) 24px);
      background-size: auto, 24px 24px, 24px 24px;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }
    .num { font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }

    /* ---------- deck shell ---------- */
    .deck { position:fixed; inset:0; display:grid; place-items:center; }
    .stage {
      width:min(1120px, 94vw); height:min(700px, 86vh);
      position:relative;
    }
    .slide {
      position:absolute; inset:0; background:var(--card);
      border:1px solid var(--line); border-radius:2px;
      box-shadow:0 1px 0 rgba(12,15,13,.02), 0 24px 60px -28px rgba(12,15,13,.28);
      padding:46px 54px 40px; display:none; flex-direction:column;
      overflow:hidden;
    }
    .slide.active { display:flex; animation:in .26s ease; }
    @keyframes in { from { opacity:0; transform:translateY(6px) scale(.995); } to { opacity:1; transform:none; } }

    /* slide chrome */
    .s-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .dot {
      width:16px; height:16px; background:var(--green); border-radius:2px;
      ;
      flex:none;
    }
    .dot.sm { width:9px; height:9px; ; }
    .dot.lg { width:30px; height:30px; border-radius:2px; box-shadow:0 0 0 7px color-mix(in srgb, var(--green) 20%, transparent), 0 0 30px color-mix(in srgb, var(--green) 60%, transparent); }
    .brand .name { font-weight:680; letter-spacing:-.03em; font-size:16px; }
    .kicker { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--green-deep); font-weight:650; }
    .s-no { font-size:11px; color:var(--muted); letter-spacing:.04em; }
    h1.title { font-weight:660; letter-spacing:-.03em; font-size:48px; line-height:1.04; margin:auto 0 0; }
    h2.title { font-weight:660; letter-spacing:-.025em; font-size:30px; margin:10px 0 2px; }
    .sub { color:var(--muted); font-size:14px; margin:6px 0 0; }
    .body { flex:1; display:flex; flex-direction:column; min-height:0; margin-top:18px; }

    /* footer per slide */
    .s-foot { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .conf { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:inline-flex; align-items:center; gap:7px; }
    .conf .lock { width:7px; height:7px; background:var(--trapped); border-radius:2px; }
    .s-foot .wb { font-size:10.5px; color:var(--muted); }
    .s-foot .wb code { background:#161c27; padding:1px 6px; border-radius:2px; font-size:10px; }

    /* ---------- progress + controls ---------- */
    .progress { position:fixed; top:0; left:0; right:0; height:3px; background:transparent; z-index:30; }
    .progress .fill { height:100%; background:var(--green); box-shadow:0 0 10px color-mix(in srgb, var(--green) 70%, transparent); transition:width .26s ease; }
    .hud {
      position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:14px; z-index:30;
      background:color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter:blur(6px);
      border:1px solid var(--line); border-radius:2px; padding:7px 8px 7px 16px;
      box-shadow:0 8px 24px -14px rgba(12,15,13,.3);
    }
    .hud .count { font-size:12px; color:var(--muted); letter-spacing:.04em; }
    .hud .count b { color:var(--ink); }
    .hud button {
      font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card);
      color:var(--ink); width:30px; height:30px; border-radius:50%; cursor:pointer; line-height:1;
      display:grid; place-items:center; transition:.15s;
    }
    .hud button:hover { border-color:var(--green); color:var(--green-deep); }
    .hud button:disabled { opacity:.35; cursor:default; }
    .hud .hint { font-size:10.5px; color:var(--muted); border-left:1px solid var(--line); padding-left:12px; }

    /* ---------- title slide ---------- */
    .title-slide { justify-content:center; background:
      radial-gradient(620px 360px at 84% 14%, color-mix(in srgb, var(--green) 12%, transparent), transparent 70%),
      var(--card); }
    .title-slide .lede { color:var(--muted); font-size:16px; max-width:560px; margin:18px 0 0; }
    .presenter { display:flex; align-items:center; gap:14px; margin-top:34px; }
    .presenter img { width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--line); }
    .presenter .who b { font-weight:640; font-size:15px; }
    .presenter .who span { display:block; color:var(--muted); font-size:13px; }
    .meta-row { display:flex; gap:26px; margin-top:30px; }
    .meta-row .m .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .meta-row .m .v { font-weight:600; font-size:15px; margin-top:3px; }
    .chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:2px; background:#161c27; color:var(--green-deep); }
    .chip .d { width:7px; height:7px; background:var(--green); border-radius:2px; }

    /* ---------- exec summary ---------- */
    .exec { display:grid; grid-template-columns:1.15fr 1fr; gap:26px; height:100%; }
    .exec ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
    .exec li { display:flex; gap:12px; align-items:flex-start; }
    .exec li .mk { width:9px; height:9px; background:var(--green); border-radius:2px; margin-top:7px; flex:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent); }
    .exec li b { font-weight:620; }
    .exec li .d { color:var(--muted); font-size:13px; }
    .kpi-stack { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; }
    .kpi { background:var(--soft); border:1px solid var(--line); border-radius:2px; padding:14px 15px; }
    .kpi.span2 { grid-column:1/-1; }
    .kpi .label { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .kpi .val { font-size:27px; font-weight:620; letter-spacing:-.025em; margin:6px 0 2px; }
    .kpi .delta { font-size:12px; }
    .up { color:var(--green-deep); } .down { color:var(--danger); }

    /* ---------- generic two-col ---------- */
    .cols { display:grid; grid-template-columns:1.5fr 1fr; gap:30px; height:100%; }
    .cols.even { grid-template-columns:1fr 1fr; }
    .note-card { background:var(--soft); border:1px solid var(--line); border-radius:2px; padding:16px 18px; }
    .note-card h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; font-weight:650; }
    .note-card p { margin:0 0 10px; font-size:13.5px; }
    .note-card p:last-child { margin:0; }
    .note-card .big { font-size:30px; font-weight:620; letter-spacing:-.02em; }

    /* tables */
    table { border-collapse:collapse; width:100%; }
    th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:0 10px 8px 0; border-bottom:1px solid var(--line); }
    td { padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle; font-size:13.5px; }
    tr:last-child td { border-bottom:0; }
    td.r, th.r { text-align:right; }
    .badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:2px; background:#161c27; color:var(--green-deep); letter-spacing:.02em; }
    .badge.a2 { background:#2a1408; color:var(--trapped); }
    .badge.aaa { background:#11233b; color:#3da9fc; }
    .badge.warn { background:var(--warn-bg); color:var(--warn); border:1px solid #3a2a14; }
    .pill { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:2px; background:var(--warn-bg); color:var(--trapped); border:1px solid #3a2a14; }
    .pill .d { width:7px; height:7px; background:var(--trapped); border-radius:2px; flex:none; }
    .pill.ok { background:#161c27; color:var(--green-deep); border-color:#cfe9dc; }
    .pill.ok .d { background:var(--green-deep); }
    .track { height:8px; background:#161c27; overflow:hidden; width:100%; min-width:60px; }
    .fill-b { height:100%; background:var(--green); }
    .fill-b.t { background:var(--trapped); }
    .fill-b.over { background:var(--danger); }

    .cp { display:flex; align-items:center; gap:9px; }
    .cp .ico { width:24px; height:24px; border-radius:2px; flex:none; display:grid; place-items:center; font-size:9.5px; font-weight:700; color:#10151f; letter-spacing:-.02em; }

    /* svg charts */
    .chart { width:100%; }
    .axis { stroke:var(--line); stroke-width:1; }
    .gridln { stroke:var(--line); stroke-width:1; stroke-dasharray:2 4; }
    .lbl { font:11px "IBM Plex Mono",monospace; fill:var(--muted); }
    .lbl.b { fill:var(--ink); font-family:'Space Grotesk'; }
    .vlbl { font:600 11px "IBM Plex Mono",monospace; fill:var(--ink); }

    /* risks */
    .risk-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .risk { border:1px solid var(--line); border-radius:2px; padding:16px 18px; background:var(--card); }
    .risk.high { border-color:#3a2a14; background:linear-gradient(0deg,var(--warn-bg),var(--card)); }
    .risk .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .risk h3 { margin:0; font-size:14.5px; font-weight:640; }
    .risk p { margin:0; font-size:13px; color:var(--muted); }
    .risk .own { margin-top:10px; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:7px; }
    .risk .own img { width:20px; height:20px; border-radius:50%; object-fit:cover; }
    .sev { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:2px; }
    .sev.h { background:var(--warn-bg); color:var(--warn); }
    .sev.m { background:#2a1408; color:#a16207; }
    .sev.l { background:#161c27; color:var(--green-deep); }

    /* asks / decisions */
    .ask { display:flex; gap:16px; align-items:flex-start; padding:18px 0; border-bottom:1px solid var(--line); }
    .ask:last-child { border-bottom:0; }
    .ask .n { width:34px; height:34px; border-radius:2px; background:var(--ink); color:var(--green); display:grid; place-items:center; font-weight:700; font-size:15px; flex:none; }
    .ask .body2 { flex:1; }
    .ask h3 { margin:0 0 4px; font-size:16px; font-weight:640; }
    .ask p { margin:0; font-size:13.5px; color:var(--muted); }
    .ask .vote { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); margin-top:8px; }
    .ask .req { font-size:11px; font-weight:600; color:var(--green-deep); background:#161c27; padding:3px 9px; border-radius:2px; white-space:nowrap; }

    .waterfall-legend { display:flex; gap:18px; margin-top:8px; font-size:11.5px; color:var(--muted); }
    .waterfall-legend span { display:inline-flex; align-items:center; gap:6px; }
    .waterfall-legend i { width:11px; height:11px; border-radius:2px; display:inline-block; }

    @media (max-width:820px){
      .slide { padding:30px 26px; }
      .exec,.cols,.cols.even { grid-template-columns:1fr; gap:16px; overflow:auto; }
      .risk-grid { grid-template-columns:1fr; }
      h1.title { font-size:34px; }
    }
  </style>
</head>
<body>
  <div class="progress"><div class="fill" id="prog"></div></div>
  <div class="deck">
    <div class="stage" id="stage"><!-- slides injected --></div>
  </div>

  <div class="hud">
    <button id="prev" aria-label="Previous slide">&#8592;</button>
    <span class="count">Slide <b id="cur">1</b> / <span id="tot">10</span></span>
    <button id="next" aria-label="Next slide">&#8594;</button>
    <span class="hint">&#8592; &#8594; arrows · click to advance</span>
  </div>

  <script>
    // ===================== deterministic board data (frozen Q2 2026) =====================
    const fmtM = v => "$" + (Math.abs(v) >= 1000 ? (v/1000).toFixed(2)+"B" : v.toFixed(1)+"M");
    const FOOT = `<div class="s-foot">
        <span class="conf"><span class="lock"></span>Confidential — Board use only</span>
        <span class="wb">Signal · Audit &amp; Finance Committee · <span class="num">2026-06-30</span></span>
      </div>`;

    function head(kicker, no){
      return `<div class="s-head">
        <div class="brand"><span class="dot"></span><span class="name">Signal</span>
          <span class="kicker" style="margin-left:6px">${kicker}</span></div>
        <span class="s-no num">${String(no).padStart(2,'0')} / 10</span>
      </div>`;
    }

    // ---- counterparty concentration (mirrors global-cash-position) ----
    const TOTAL = 487.2;
    const cps = [
      { name:"JPMorgan",          rating:"A-1",  bal:164.3, limit:35, color:"#1a3b8a", abbr:"JPM" },
      { name:"Citibank",          rating:"A-1",  bal:121.7, limit:30, color:"#0066b3", abbr:"CITI" },
      { name:"HSBC",              rating:"A-1",  bal:78.4,  limit:25, color:"#c8102e", abbr:"HSBC" },
      { name:"BNP Paribas",       rating:"A-1",  bal:54.9,  limit:20, color:"#007749", abbr:"BNP" },
      { name:"Standard Chartered",rating:"A-2",  bal:41.8,  limit:15, color:"#0473ea", abbr:"SC" },
      { name:"Brex Treasury MMF", rating:"AAAm", bal:26.1,  limit:15, color:"#f76b1c", abbr:"BRX" },
    ];

    // ===================== chart builders (inline SVG, no deps) =====================

    // (3) cash waterfall Q1 -> Q2
    function waterfall(){
      const steps = [
        { label:"Opening\nQ1 close", val:461.0, type:"total" },
        { label:"Operating\ncash flow", val:+58.4, type:"pos" },
        { label:"Financing\n(net draw)", val:+22.0, type:"pos" },
        { label:"Capex", val:-31.7, type:"neg" },
        { label:"Buybacks", val:-22.5, type:"neg" },
        { label:"Closing\nQ2", val:487.2, type:"total" },
      ];
      const W=760, H=320, padL=46, padB=58, padT=14;
      const plotH = H-padB-padT, plotW = W-padL-20;
      const min=440, max=520, span=max-min;
      const y = v => padT + plotH - (v-min)/span*plotH;
      const bw = plotW/steps.length*0.6, gap = plotW/steps.length;
      let run = 0, bars="", conn="", labels="";
      steps.forEach((s,i)=>{
        const x = padL + gap*i + (gap-bw)/2;
        let top, bot, fill;
        if(s.type==="total"){ top=y(s.val); bot=y(min); fill="var(--ink)"; run=s.val; }
        else { const start=run; run+=s.val; top=y(Math.max(start,run)); bot=y(Math.min(start,run)); fill = s.val>=0?"var(--green)":"var(--danger)"; }
        bars += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,bot-top).toFixed(1)}" rx="2" fill="${fill}"/>`;
        const vtxt = s.type==="total" ? "$"+s.val.toFixed(1)+"M" : (s.val>=0?"+":"")+s.val.toFixed(1);
        labels += `<text class="vlbl" x="${(x+bw/2).toFixed(1)}" y="${(top-7).toFixed(1)}" text-anchor="middle" ${s.val<0&&s.type!=='total'?'fill="var(--danger)"':''}>${vtxt}</text>`;
        s.label.split("\n").forEach((ln,j)=>{
          labels += `<text class="lbl b" x="${(x+bw/2).toFixed(1)}" y="${(H-padB+18+j*13).toFixed(1)}" text-anchor="middle">${ln}</text>`;
        });
        if(i>0 && i<steps.length){ const px=padL+gap*(i-1)+(gap-bw)/2+bw, cy=y(run); }
      });
      // y gridlines
      let grid="";
      for(let v=min; v<=max; v+=20){ const yy=y(v); grid += `<line class="gridln" x1="${padL}" y1="${yy}" x2="${W-20}" y2="${yy}"/><text class="lbl" x="${padL-8}" y="${yy+3}" text-anchor="end">${v}</text>`; }
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash waterfall Q1 to Q2">${grid}${bars}${labels}</svg>`;
    }

    // (4) 13-week liquidity forecast — projected min cash line vs covenant floor
    function liquidity(){
      const wk = [487,471,463,455,468,481,476,464,452,447,458,470,483];
      const W=760,H=300,padL=46,padB=42,padT=16;
      const plotH=H-padB-padT, plotW=W-padL-20;
      const min=400,max=500,span=max-min;
      const x=i=> padL + i/(wk.length-1)*plotW;
      const y=v=> padT + plotH-(v-min)/span*plotH;
      let grid="";
      for(let v=400;v<=500;v+=25){ const yy=y(v); grid+=`<line class="gridln" x1="${padL}" y1="${yy}" x2="${W-20}" y2="${yy}"/><text class="lbl" x="${padL-8}" y="${yy+3}" text-anchor="end">${v}</text>`; }
      const floor=420, fy=y(floor);
      const floorln=`<line x1="${padL}" y1="${fy}" x2="${W-20}" y2="${fy}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="lbl" x="${W-22}" y="${fy-6}" text-anchor="end" fill="var(--danger)">Min liquidity covenant $420M</text>`;
      const pts = wk.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const area = `M ${x(0).toFixed(1)} ${y(min).toFixed(1)} L `+wk.map((v,i)=>`${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" L ")+` L ${x(wk.length-1).toFixed(1)} ${y(min).toFixed(1)} Z`;
      let dots="", xl="";
      wk.forEach((v,i)=>{ dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--green-deep)"/>`;
        if(i%2===0) xl+=`<text class="lbl" x="${x(i).toFixed(1)}" y="${H-padB+16}" text-anchor="middle">W${i+1}</text>`; });
      const minv=Math.min(...wk), mi=wk.indexOf(minv);
      const minMark=`<circle cx="${x(mi).toFixed(1)}" cy="${y(minv).toFixed(1)}" r="4.5" fill="none" stroke="var(--danger)" stroke-width="1.6"/><text class="vlbl" x="${x(mi).toFixed(1)}" y="${y(minv)+18}" text-anchor="middle" fill="var(--danger)">trough $${minv}M</text>`;
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="13-week liquidity forecast">${grid}<path d="${area}" fill="color-mix(in srgb,var(--green) 14%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--green-deep)" stroke-width="2"/>${floorln}${dots}${minMark}${xl}</svg>`;
    }

    // (6) FX program — hedge coverage by currency (paired bars exposure vs hedged)
    function fxChart(){
      const rows=[
        {c:"EUR", exp:95.2, hedged:78.0},
        {c:"GBP", exp:41.5, hedged:34.4},
        {c:"SGD", exp:28.7, hedged:18.5},
        {c:"INR", exp:14.7, hedged:9.8},
        {c:"BRL", exp:9.8,  hedged:0.0},
      ];
      const W=760,H=300,padL=46,padB=40,padT=16;
      const plotH=H-padB-padT, plotW=W-padL-20;
      const max=100; const y=v=>padT+plotH-(v/max)*plotH;
      const gap=plotW/rows.length, bw=gap*0.26;
      let grid="";
      for(let v=0;v<=100;v+=25){ const yy=y(v); grid+=`<line class="gridln" x1="${padL}" y1="${yy}" x2="${W-20}" y2="${yy}"/><text class="lbl" x="${padL-8}" y="${yy+3}" text-anchor="end">${v}</text>`; }

        const cx=padL+gap*i+gap/2;
        const x1=cx-bw-2, x2=cx+2;
        bars+=`<rect x="${x1.toFixed(1)}" y="${y(r.exp).toFixed(1)}" width="${bw.toFixed(1)}" height="${(plotH-(y(r.exp)-padT)).toFixed(1)}" rx="2" fill="color-mix(in srgb,var(--ink) 16%,transparent)"/>`;

        const cov = r.exp? Math.round(r.hedged/r.exp*100):0;
        bars+=`<text class="vlbl" x="${cx.toFixed(1)}" y="${(y(Math.max(r.exp,r.hedged))-7).toFixed(1)}" text-anchor="middle" ${r.hedged===0?'fill="var(--danger)"':''}>${cov}%</text>`;
        bars+=`<text class="lbl b" x="${cx.toFixed(1)}" y="${H-padB+18}" text-anchor="middle">${r.c}</text>`;
      });
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="FX hedge coverage">${grid}${bars}</svg>`;
    }

    function show(n){

      document.getElementById("cur").textContent = cur+1;
      document.getElementById("prog").style.width = ((cur+1)/total*100)+"%";
      document.getElementById("prev").disabled = cur===0;
      document.getElementById("next").disabled = cur===total-1;
    }
    const next=()=>show(cur+1), prev=()=>show(cur-1);

    document.getElementById("next").addEventListener("click", next);
    document.getElementById("prev").addEventListener("click", prev);
    // click-to-advance on the slide (ignore clicks on the HUD / links)
    document.querySelector(".deck").addEventListener("click", e=>{

      if(e.clientX < window.innerWidth*0.28) prev(); else next();
    });
    window.addEventListener("keydown", e=>{
      if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
