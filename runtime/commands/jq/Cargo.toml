[package]
name = "jq"
version = "0.1.0"
edition = "2021"
description = "jq as a sandboxed WASM command — a thin wrapper around the wasi-clean jaq interpreter lib (not the fd-lock binary)."

[workspace]

[[bin]]
name = "jq"
path = "src/main.rs"

[dependencies]
jaq-interpret = "1.5"
jaq-parse = "1.0"
jaq-core = "1.5"
jaq-std = "1.5"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
