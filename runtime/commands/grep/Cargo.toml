[package]
name = "grep"
version = "0.1.0"
edition = "2021"
description = "grep as a sandboxed WASM command — regex line match over stdin (the command-model fit for ripgrep)."
[workspace]
[[bin]]
name = "grep"
path = "src/main.rs"
[dependencies]
regex = "1"
[profile.release]
opt-level = "z"
lto = true
