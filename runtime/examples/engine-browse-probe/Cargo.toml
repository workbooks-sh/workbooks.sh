[package]
name = "engine-browse-probe"
version = "0.1.0"
edition = "2021"
description = "Fixture: a Workbook component that fetches a URL through the workbooks:engine browse-fetch Dock import (Route B — host owns egress)."
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
[package.metadata.component]
package = "workbooks:engine-browse-probe"
[package.metadata.component.target]
path = "wit"
world = "engine"
[profile.release]
opt-level = "z"
lto = true
