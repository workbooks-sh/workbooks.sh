[package]
name = "engine-llm-probe"
version = "0.1.0"
edition = "2021"
description = "Fixture: a Workbook component that calls the LLM through the workbooks:engine llm-complete Dock import."
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
[package.metadata.component]
package = "workbooks:engine-llm-probe"
[package.metadata.component.target]
path = "wit"
world = "engine"
[profile.release]
opt-level = "z"
lto = true
