[package]
name = "engine-dock-probe"
version = "0.1.0"
edition = "2021"
description = "wb-pkh.12 fixture: a component that calls the Dock through the dock SDK (dock::command::run), proving the SDK wrappers work through a real Instance."
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
dock = { path = "../../sdk/rust/dock" }
[package.metadata.component]
package = "workbooks:engine-dock-probe"
[package.metadata.component.target]
path = "wit/engine.wit"
world = "engine"
[profile.release]
opt-level = "z"
lto = true
