[package]
name = "wasmex"
version = "0.14.0"
authors = ["Philipp Tessenow <philipp@tessenow.org>"]
description = "Elixir extension to run WebAssembly binaries through wasmtime"
readme = "README.md"
repository = "https://github.com/tessi/wasmex"
keywords = ["elixir", "extension", "webassembly", "wasmtime"]
categories = ["wasm"]
edition = "2021"

[lib]
name = "wasmex"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
hyper = "1"  # wb-broker: name hyper::Request<HyperOutgoingBody> in the WasiHttpView::send_request SSRF override (matches wasmtime-wasi-http 39's hyper 1.8)
bytes = "1"  # wb-broker (wb-py4k): build the inbound request body in component_serve_http
http-body = "1"  # wb-broker (wb-t3sq): Body::frame for streaming the response body chunk-by-chunk
http-body-util = "0.1"  # wb-broker (wb-py4k): Full request body + BodyExt::collect the response
rand = "0.9.1"
rustler = { version = "0.37.2", features = ["big_integer", "serde"] }
tokio = { version = "1.48", features = ["full"] }
wasi-common = "39.0.1"
wasmtime = "39.0.1"
wasmtime-wasi = "39.0.1"
wasmtime-wasi-http = "39.0.1"
wat = "1.243.0"
wiggle = "39.0.1"
wit-parser = "0.240.0"
