# Fly.io deploy for the Workbook Runtime engine (wb-11ck.30).
# One machine: the BEAM engine + a persistent volume for Instance VFS files,
# with Litestream replicating that volume to R2 (set the AWS_/R2 secrets).
# Deploy:  fly deploy        (the single credentialed step — Shane's Fly account)
# Volume:  fly volumes create workbooks_data --size 10
# Secrets: fly secrets set OPENROUTER_API_KEY=...  (agents — POST /api/run) \
#            WB_AUTH_SECRET=... WB_JWKS_URL=... \
#            LITESTREAM_REPLICA_URL=s3://bucket/path AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
# Agents: once OPENROUTER_API_KEY is set, `POST /api/run {system,task}` runs a
# long-horizon agent in the deployed engine, identical to local; GET /api/run/:id
# polls status + the observable events.org. The jq/grep wasm commands are baked in.

app = "workbooks-engine"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  WB_WEB = "1"
  PORT = "4000"
  WB_REGISTRY = "/data/registry.db"

[[mounts]]
  source = "workbooks_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
