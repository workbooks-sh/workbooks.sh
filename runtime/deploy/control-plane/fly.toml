# Platform Control Plane (PCP) — the hosted-nexus dashboard's backend.
#
# The SAME runtime image as a tenant nexus, but in the CONTROL-PLANE role: always-on,
# multi-tenant, authenticated by WorkOS OIDC (the dashboard forwards the user's WorkOS
# access token; the OIDC verifier maps its org_id claim → tenant). It owns the nexus
# registry and drives the Fly Machines API to provision per-tenant nexuses.
#
# Deploy (image-based, no local build):
#   fly apps create wb-nexus-cp --org personal
#   fly volumes create cpdata --size 1 --app wb-nexus-cp --region sjc
#   fly secrets set FLY_API_TOKEN=$(fly auth token) --app wb-nexus-cp
#   fly deploy --config runtime/deploy/control-plane/fly.toml --app wb-nexus-cp
#
# Then point the dashboard at it:
#   (Pages project workbooks-cloud) WB_RUNTIME_URL = https://wb-nexus-cp.fly.dev
#
# NOTE: no WB_PUBLIC_BEARER here — that lock would preempt the OIDC rung. Multi-tenant
# + OIDC is the isolation model for the control plane.

app = "wb-nexus-cp"
primary_region = "sjc"

[build]
  image = "ghcr.io/workbooks-sh/runtime:latest"

[env]
  WB_WEB = "1"
  PORT = "4000"
  WB_CONTROL_PLANE = "1"
  WB_TENANCY_MODE = "multi"
  # WorkOS AuthKit access tokens — JWKS for client_01KS9XB6QEZTMHVHTFXZSZ65GY.
  WB_OIDC_JWKS_URL = "https://api.workos.com/sso/jwks/client_01KS9XB6QEZTMHVHTFXZSZ65GY"
  WB_OIDC_TENANT_CLAIM = "org_id"
  # Per-tenant nexuses provision into this Fly org.
  WB_FLY_ORG = "personal"
  WB_DATA = "/data"
  WB_REGISTRY = "/data/registry.db"
  # Multi-tenant boot gates (acp-cloud-enable #6/#7): a DURABLE per-deployment var
  # store on the volume (not :memory:), and the non-pooled creds backend.
  WB_VARS = "/data/vars.db"
  WB_HARNESS_CREDS = "desktop"

[[mounts]]
  source = "cpdata"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # Always-on: the control plane is not a demo, it answers the dashboard.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
