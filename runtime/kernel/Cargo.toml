[package]
name = "oql"
version = "0.1.0"
edition = "2021"
description = "OQL — the opinionated Org kernel. Narrow Org lens + tangle-plan emitter, compiled to WASM. Clean-room rewrite (OQL-KERNEL.org)."

# Standalone — not part of any parent workspace.
[workspace]

# cdylib → the wasm Component (cargo-component); rlib → the native kernel API
# linked by the `wb` CLI. Same source, two consumers.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `component` builds the WIT-typed wasm Component (cargo-component uses it via
# default features). Consumers that only want the pure rlib (the `wb` CLI, on
# native AND wasm) depend with default-features = false → no component glue.
default = ["component"]
component = ["dep:wit-bindgen-rt"]

[dependencies]
serde_json = "1"
orgize = "0.10.0-alpha.10"
wit-bindgen-rt = { version = "0.41", features = ["bitflags"], optional = true }

# cargo-component: build a WIT-typed Component from the workbooks:oql world.
# One ABI for the whole system — the kernel no longer opts out of the Component
# Model it imposes on user code.
[package.metadata.component]
package = "workbooks:oql"

[package.metadata.component.target]
path = "wit"
world = "oql"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
