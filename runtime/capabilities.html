<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waldo — Capability Ledger (live)</title>
<style>
  :root { --bg:#0c0f0d; --panel:#13181500; --line:#1f2a24; --txt:#e8efe9; --dim:#8aa093;
          --green:#3fe081; --amber:#f2c14e; --slate:#7f93a6; --violet:#b69cf0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { position:sticky; top:0; background:linear-gradient(#0c0f0d,#0c0f0df0);
           border-bottom:1px solid var(--line); padding:18px 28px; display:flex;
           align-items:baseline; gap:16px; flex-wrap:wrap; backdrop-filter:blur(6px); }
  h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  h1 b { color:var(--green); }
  .meta { color:var(--dim); font-size:12px; }
  .live { color:var(--green); }
  .live.stale { color:var(--amber); }
  .totals { margin-left:auto; display:flex; gap:18px; }
  .totals span b { color:var(--green); font-size:16px; }
  main { padding:14px 28px 60px; max-width:1100px; }
  .area { margin:22px 0 8px; color:var(--dim); font-size:12px; text-transform:uppercase;
          letter-spacing:1.5px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 10px 8px 0; vertical-align:top; border-bottom:1px solid #141a17; }
  .nm { font-weight:600; }
  .st { white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .st.done   { color:var(--green); }
  .st.wip    { color:var(--amber); }
  .st.gated  { color:var(--slate); }
  .st.planned{ color:var(--violet); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; background:currentColor; }
  .u { color:var(--green); font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); }
  .fm { color:var(--amber); font-size:12px; }
  .fm:empty { display:none; }
  td.tests, td.proof { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>workbooks · <b>capability ledger</b></h1>
  <span class="meta">updated <span id="updated">—</span></span>
  <span class="meta">· <span id="live" class="live">● live</span></span>
  <div class="totals" id="totals"></div>
</header>
<main id="root"><p class="dim">connecting…</p></main>

<script>
const ST = ['done','wip','gated','planned'];
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(d){
  document.getElementById('updated').textContent = d.updated || '—';
  const caps = (d.areas||[]).flatMap(a=>a.capabilities||[]);
  const tot = { done:0, wip:0, gated:0, planned:0, units:0 };
  caps.forEach(c=>{ tot[c.status] = (tot[c.status]||0)+1; tot.units += (c.units||0); });
  document.getElementById('totals').innerHTML =
    `<span class="dim">units <b>${tot.units}</b></span>`+
    ST.map(s=> tot[s] ? `<span class="dim">${s} <b>${tot[s]}</b></span>`:'').join('');

  const root = document.getElementById('root'); root.innerHTML='';
  (d.areas||[]).forEach(a=>{
    const h = document.createElement('div'); h.className='area'; h.textContent=a.area; root.appendChild(h);
    const t = document.createElement('table');
    (a.capabilities||[]).forEach(c=>{
      const fm = (c.failure_modes||[]).join(' · ');
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="st ${esc(c.status)}"><span class="dot"></span>${esc(c.status)}</td>`+
        `<td class="nm">${esc(c.name)}${fm?`<div class="fm">⚠ ${esc(fm)}</div>`:''}</td>`+
        `<td class="u">${c.units?('×'+c.units):'<span class=dim>—</span>'}</td>`+
        `<td class="tests">${esc(c.tests)}</td>`+
        `<td class="proof">${esc(c.proof)}</td>`;
      t.appendChild(tr);
    });
    root.appendChild(t);
  });
}

let lastOk = Date.now();
async function poll(){
  const live = document.getElementById('live');
  try {
    const r = await fetch('/api/capabilities', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    render(await r.json());
    lastOk = Date.now(); live.textContent='● live'; live.className='live';
  } catch(e){
    live.textContent='● reconnecting…'; live.className='live stale';
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
