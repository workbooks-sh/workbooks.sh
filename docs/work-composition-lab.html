<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock">
<meta name="color-scheme" content="light">
<title>work elements — composition lab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
  :root{
    --paper:#f7f6f1;--surface:#fbfaf3;--raised:#fffef9;--ink:#121316;--ink-2:#4a4b50;--ink-3:#8a8b90;
    --line:#e7e5db;--line-2:#d8d6ca;--cream:#f2ddb0;
    --sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mark{width:22px;height:22px;flex:none}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sub{font-size:12px;color:var(--ink-3);font-weight:450}
  header .spacer{flex:1}
  header .hint{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
  main{display:grid;grid-template-columns:250px 1fr 1fr;min-height:0}
  @media(max-width:1100px){main{grid-template-columns:210px 1fr}.pane-preview{display:none}}
  .tree{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
  .tree-group{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 10px 5px}
  .node{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2);user-select:none}
  .node:hover{background:var(--raised)}
  .node.active{background:var(--ink);color:var(--paper)}
  .node .n{width:17px;height:17px;border-radius:5px;background:var(--cream);color:#6b5a2a;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
  .node.active .n{background:rgba(255,255,255,.2);color:var(--paper)}
  .pane-editor{display:grid;grid-template-rows:auto 1fr;min-width:0;border-right:1px solid var(--line)}
  .pane-head{display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
  .pane-head .path{font-weight:600;color:var(--ink)}
  .CodeMirror{height:100%;font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--paper);color:var(--ink-2)}
  .CodeMirror-gutters{background:var(--paper);border-right:1px solid var(--line)}
  .CodeMirror-linenumber{color:#c3c1b6}.CodeMirror-cursor{border-left:1.5px solid var(--ink)}
  .CodeMirror-selected{background:#e9e7db!important}
  .cm-tag{color:#1f6f4f;font-weight:600}.cm-attribute{color:#3a6ea5}.cm-string{color:#9a5b2e}.cm-comment{color:#9b9a8e;font-style:italic}.cm-bracket{color:var(--ink-3)}
  .pane-preview{display:grid;grid-template-rows:1fr auto;min-width:0}
  iframe#preview{width:100%;height:100%;border:0;background:var(--paper)}
  .note{border-top:1px solid var(--line);background:var(--surface);padding:11px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.5;max-height:34%;overflow:auto}
  .note b{color:var(--ink)}
  .note code{font-family:var(--mono);font-size:11px;background:var(--paper);padding:1px 5px;border-radius:5px;color:#1f6f4f}
  .note .t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="113.444 65.6002 100 100"><path d="M163.4 65.6c12 22 33 33 50 33-17 0-38 11-50 33-12-22-33-33-50-33 17 0 38-11 50-33z" fill="#121316"/></svg>
  <h1>work elements <span class="sub">· composition lab</span></h1>
  <div class="spacer"></div>
  <div class="hint">edit the HTML — the preview is the real elements</div>
</header>
<main>
  <nav class="tree" id="tree"></nav>
  <section class="pane-editor">
    <div class="pane-head"><span class="path" id="curPath"></span></div>
    <textarea id="code"></textarea>
  </section>
  <section class="pane-preview">
    <iframe id="preview"></iframe>
    <div class="note" id="note"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script>
/* Each lesson: HTML using real work-* elements + a plain-language takeaway. */
const FILES = {
"basics/1 · default text slot": { note:
  "<span class='t'>the biggest ergonomic win</span><b>Most of the time you write NO inner element.</b> An agent's own text IS its prompt (the 'default slot'). Both agents below are identical — the preview labels where each prompt came from. Only reach for <code>&lt;work-system&gt;</code> when there's MORE than one thing inside and you need to say 'this part is the prompt'.",
  html:
`<!-- agent A: just text. The text IS the prompt. -->
<work-agent id="analyst-a" model="claude-opus-4-8">
  You are an analyst. Prefer primary sources.
</work-agent>

<!-- agent B: SAME result, but spells out the prompt because it also -->
<!-- holds a second child. <work-system> = "this part is the prompt". -->
<work-agent id="analyst-b" model="claude-opus-4-8">
  <work-system>You are an analyst. Prefer primary sources.</work-system>
  <acme-note>A custom element living alongside the prompt.</acme-note>
</work-agent>`},

"basics/2 · attribute vs element": { note:
  "<span class='t'>what becomes an attribute, what becomes an element</span><b>A scalar value or a reference → attribute. Content that renders or holds prose → child element.</b> So <code>model</code> and <code>toolkits</code> are attributes — there is no <code>work-model</code>. This is what stops the element count from exploding.",
  html:
`<!-- model + toolkits are VALUES → attributes. -->
<work-agent id="good" model="claude-opus-4-8" toolkits="crm">
  You write SQL and explain the results.
</work-agent>

<!-- the wrong instinct (an element for a scalar) — there is no work-model: -->
<!-- <work-agent><work-model>claude-opus-4-8</work-model></work-agent>   -->

<!-- a toolkit the agent above references, defined once: -->
<work-toolkit id="crm" tagline="CRM — query customers + deals"></work-toolkit>`},

"basics/3 · nesting = hierarchy": { note:
  "<span class='t'>where hierarchy actually comes from</span><b>The PARENT owns the contract, not the child's name.</b> <code>work-agent</code> declares 'I read a <code>work-system</code> child + <code>model</code>/<code>toolkits</code> attributes'. You get the hierarchy by NESTING — the child doesn't need to encode the parent. That's why <code>work-system</code> can be reused anywhere.",
  html:
`<work-agent id="parent-owns" model="claude-opus-4-8">
  <work-system>
    The agent decides this work-system is its prompt.
    Nesting is the hierarchy — not the tag name.
  </work-system>
</work-agent>

<!-- the same work-system standalone is just a prompt block — -->
<!-- it isn't "owned" by anything until an agent wraps it. -->
<work-system>Reusable on its own.</work-system>`},

"references/4 · id references (the @)": { note:
  "<span class='t'>define once, reference by id</span><b>This is your '@'.</b> Define a <code>work-toolkit</code> ONCE with an <code>id</code>; reference it from any agent with <code>toolkits=\"crm web\"</code> — no re-declaring. The preview resolves each reference live (✓ found shows the tagline; a missing one shows <b>undefined ✗</b>).",
  html:
`<!-- DEFINE toolkits once -->
<work-toolkit id="crm" tagline="CRM — customers + deals"></work-toolkit>
<work-toolkit id="web" tagline="Web search"></work-toolkit>

<!-- REFERENCE them by id (the @). No toolkit is re-declared. -->
<work-agent id="analyst" model="claude-opus-4-8" toolkits="crm web">
  You answer questions over the CRM.
</work-agent>

<!-- a reference to something undefined is shown as broken -->
<work-agent id="oops" toolkits="ghost">
  References a toolkit that doesn't exist.
</work-agent>`},

"references/5 · data binding": { note:
  "<span class='t'>same id-reference pattern, for data</span><b>The exact same mechanism powers data.</b> Name a source once with <code>work-query name=\"big-orders\"</code>; a view points at it with <code>from=\"big-orders\"</code>. One source, many views — and the host decides whether it runs on SQLite or Postgres.",
  html:
`<work-query name="big-orders" db="sales"
  sql="select customer, total from orders where total > 100"></work-query>

<!-- views reference the named source by id -->
<work-table from="big-orders"></work-table>
<work-chart from="big-orders"></work-chart>`},

"naming/6 · work- vs custom": { note:
  "<span class='t'>reserve work- for the library; anything else is yours</span><b>The custom-element registry is open.</b> <code>work-*</code> = the first-class library we own. ANY other hyphenated name (<code>acme-note</code>, <code>acme-chart</code>) = your custom element — it just slots in, references by id, and uses the same host. No permission needed; it's all HTML.",
  html:
`<work-agent id="mix" model="claude-opus-4-8">
  You can mix library + custom elements freely.
  <acme-note>acme-note is a USER element — it just slots in.</acme-note>
  <acme-chart>so does acme-chart.</acme-chart>
</work-agent>`},

"naming/7 · flat vs compound": { note:
  "<span class='t'>why agent-prompt doesn't 'scope' to agent</span><b>The registry is FLAT + global, and every name needs a hyphen.</b> So <code>agent-prompt</code> only LOOKS like ownership — it's just another global element, and you'd end up with more elements, not fewer. <b>Recommended:</b> flat names + nesting. Compound (<code>work-agent-system</code>) is occasionally clearer but usually just verbose — use it only when a part is meaningless outside its parent.",
  html:
`<!-- RECOMMENDED: flat name, hierarchy by nesting -->
<work-agent id="flat" model="claude-opus-4-8">
  <work-system>Clear, reusable, owned by the agent via nesting.</work-system>
</work-agent>

<!-- COMPOUND: a name that bakes in the parent. Valid, but verbose; -->
<!-- only worth it if the part can't exist outside its parent. -->
<work-agent-system>Bound to agent by name — rarely needed.</work-agent-system>`},
};

/* ── the real elements (this script is injected into the preview iframe) ── */
const STYLE = `
:host{display:block;font-family:'Geist',system-ui,sans-serif;margin:0 0 12px}
.card{background:#fffef9;border:1px solid #e7e5db;border-radius:13px;padding:13px 15px}
.card.agent{border-color:#cfe6d8;background:linear-gradient(#fffef9,#fbfdfb)}
.head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ico{font-size:16px}
.title{font-weight:600;font-size:14px;color:#121316}
.kind{font-size:9.5px;font-family:'Geist Mono',monospace;color:#8a8b90;text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:10.5px;padding:2px 9px;border-radius:20px;background:#f7f6f1;border:1px solid #d8d6ca;color:#4a4b50;font-weight:500}
.chip.ref{background:#eef4ff;border-color:#d6e4fb;color:#3a6ea5}
.chip.bad{background:#fbe9e6;border-color:#f0ccc4;color:#b04a36}
.plabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8a8b90;font-weight:600;margin-top:6px}
.plabel .src{color:#1f6f4f;text-transform:none;letter-spacing:0;font-weight:500}
.prompt{font-size:12.5px;color:#3a3b40;line-height:1.5;background:#f7f6f1;border-left:3px solid #cfe6d8;padding:7px 11px;border-radius:0 8px 8px 0;margin-top:3px;white-space:pre-wrap}
.kids{margin-top:8px}
::slotted(work-system){display:none}
.deftag{display:inline-flex;align-items:center;gap:7px;background:#fffef9;border:1px solid #e7e5db;border-radius:10px;padding:7px 11px;font-size:12px;color:#4a4b50}
.deftag .id{font-family:'Geist Mono',monospace;font-weight:600;color:#1f6f4f}
.custom{background:#fff;border:1px dashed #c9b6e0;border-radius:10px;padding:8px 11px;font-size:12px;color:#6a4f88}
.custom .b{font-family:'Geist Mono',monospace;font-size:9.5px;background:#efe6f7;color:#7a5cab;padding:1px 6px;border-radius:10px;margin-right:7px;text-transform:uppercase;letter-spacing:.05em}
.viz{display:flex;align-items:center;gap:9px;color:#4a4b50;font-size:12.5px}
.sql{font-family:'Geist Mono',monospace;font-size:10.5px;color:#6b5a2a;background:#f2ddb0;padding:6px 9px;border-radius:7px;margin-top:6px;white-space:pre-wrap}
`;

const REGISTER = `
const STYLE = ${JSON.stringify(STYLE)};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ownText = el => Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();

customElements.define('work-agent', class extends HTMLElement {
  connectedCallback(){
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    const sys = this.querySelector(':scope > work-system');
    const prompt = sys ? sys.textContent.trim() : ownText(this);
    const psrc = sys ? '&lt;work-system&gt; child' : 'text body (default slot)';
    // project only non-prompt ELEMENT children (custom elements); text + the
    // consumed work-system are left unslotted so they don't double-render.
    this.querySelectorAll(':scope > *').forEach(c => {
      if (c.tagName.toLowerCase() !== 'work-system') c.setAttribute('slot','kid');
    });
    const ids = (this.getAttribute('toolkits')||'').split(/\\s+/).filter(Boolean);
    const refs = ids.map(id=>{
      const def = this.getRootNode().querySelector('work-toolkit[id="'+id+'"]');
      const tl = def && def.getAttribute('tagline');
      return def ? '<span class="chip ref">@'+id+(tl?' · '+esc(tl):'')+'</span>'
                 : '<span class="chip bad">@'+id+' · undefined ✗</span>';
    }).join('');
    const model = this.getAttribute('model');
    this.shadowRoot.innerHTML = '<style>'+STYLE+'</style><div class="card agent">'+
      '<div class="head"><span class="ico">🤖</span><span class="title">'+(this.getAttribute('id')||'agent')+'</span><span class="kind">work-agent</span></div>'+
      '<div class="meta">'+(model?'<span class="chip">model: '+esc(model)+'</span>':'')+refs+'</div>'+
      '<div class="plabel">prompt <span class="src">— from '+psrc+'</span></div>'+
      '<div class="prompt">'+esc(prompt||'(empty)')+'</div>'+
      '<div class="kids"><slot name="kid"></slot></div></div>';
  }
});

customElements.define('work-system', class extends HTMLElement {
  connectedCallback(){
    // only render standalone (when not inside a work-agent, which consumes it)
    if(this.closest('work-agent')) return;
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="card"><div class="plabel">work-system (standalone)</div><div class="prompt">'+esc(this.textContent.trim())+'</div></div>';
  }
});

customElements.define('work-toolkit', class extends HTMLElement {
  connectedCallback(){
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="deftag">🧰 <span class="id">'+(this.getAttribute('id')||'?')+'</span> <span style="color:#8a8b90">'+esc(this.getAttribute('tagline')||'toolkit definition')+'</span></div>';
  }
});

customElements.define('work-query', class extends HTMLElement {
  connectedCallback(){
    if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="card"><div class="head"><span class="ico">⛁</span><span class="title">'+(this.getAttribute('name')||'query')+'</span><span class="kind">work-query · '+esc(this.getAttribute('db')||'')+'</span></div>'+(this.getAttribute('sql')?'<div class="sql">'+esc(this.getAttribute('sql'))+'</div>':'')+'</div>';
  }
});

function viz(glyph,label){ return class extends HTMLElement {
  connectedCallback(){ if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="card"><div class="viz"><span class="ico">'+glyph+'</span><span>'+label+' bound to <span class="chip ref">from: '+esc(this.getAttribute('from')||'?')+'</span></span></div></div>'; } }; }
customElements.define('work-table', viz('⊞','table'));
customElements.define('work-chart', viz('▦','chart'));

function custom(tag){ return class extends HTMLElement {
  connectedCallback(){ if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="custom"><span class="b">custom · '+tag+'</span>'+esc(this.textContent.trim())+'</div>'; } }; }
customElements.define('acme-note', custom('acme-note'));
customElements.define('acme-chart', custom('acme-chart'));
customElements.define('work-agent-system', class extends HTMLElement {
  connectedCallback(){ if(!this.shadowRoot) this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML='<style>'+STYLE+'</style><div class="card"><span class="kind" style="margin:0">work-agent-system (compound)</span><div class="prompt" style="margin-top:6px">'+esc(this.textContent.trim())+'</div></div>'; }
});
`;

/* ── app wiring ── */
const cm = CodeMirror.fromTextArea(document.getElementById('code'),{lineNumbers:true,mode:'xml',tabSize:2});
let current = Object.keys(FILES)[0];

function previewDoc(src){
  return '<!doctype html><meta charset=utf8>'+
    '<style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap");body{background:#f7f6f1;margin:0;padding:18px;font-family:Geist,sans-serif}</style>'+
    '<body>'+src+'</body><scr'+'ipt>'+REGISTER+'</scr'+'ipt>';
}
function render(){
  document.getElementById('preview').srcdoc = previewDoc(cm.getValue());
  document.getElementById('note').innerHTML = FILES[current].note;
}
function open(name){
  current=name;
  cm.setValue(FILES[name].html);
  document.getElementById('curPath').textContent=name;
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.k===name));
  render();
}
function buildTree(){
  const tree=document.getElementById('tree'),groups={};
  for(const k of Object.keys(FILES)){ const [g]=k.split('/'); (groups[g]=groups[g]||[]).push(k); }
  let html='';
  for(const g of Object.keys(groups)){
    html+='<div class="tree-group">'+g+'</div>';
    for(const k of groups[g]){ const label=k.split('/')[1]; const num=label.split(' ')[0];
      html+='<div class="node" data-k="'+k+'"><span class="n">'+num+'</span><span>'+label.replace(/^\\d+ · /,'')+'</span></div>'; }
  }
  tree.innerHTML=html;
  tree.querySelectorAll('.node').forEach(el=>el.onclick=()=>open(el.dataset.k));
}
cm.on('change', render);
buildTree();
open(current);
</script>
</body>
</html>
