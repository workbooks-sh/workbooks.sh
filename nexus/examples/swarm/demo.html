<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock"><meta name="color-scheme" content="dark">
<title>Search Swarm</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>html,body{height:100%;margin:0;background:#0a0a0f}</style></head>
<body>
<div class="px" id="app" data-stream="swarm">
  <div class="glow"></div>
  <header class="top" hidden><span class="logo"><span class="glyph"></span> Search Swarm</span><span class="grow"></span><button class="newbtn" type="button">New</button></header>

  <section class="hero">
    <div class="brand"><span class="glyph"></span> Search Swarm</div>
    <h1>Ask anything. A swarm researches it.</h1>
    <form class="ask">
      <input class="q" type="text" placeholder="What do you want to know?" autocomplete="off" autofocus>
      <div class="agc"><button class="sdec" type="button">−</button><span class="snum">8</span><span class="slbl">agents</span><button class="sinc" type="button">+</button></div>
      <button class="go" type="submit" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <div class="chips">
      <button class="chip" type="button">How does BEAM concurrency work?</button>
      <button class="chip" type="button">Compare WebAssembly runtimes</button>
      <button class="chip" type="button">State of local-first sync engines</button>
    </div>
    <div class="recent"></div>
  </section>

  <main class="result" hidden>
    <h1 class="qh"></h1>
    <div class="prog">
      <div class="pline"><span class="spin"></span><span class="ptxt">Planning research…</span></div>
      <div class="avs"></div>
      <div class="act"></div>
    </div>
    <div class="sources"></div>
    <article class="report"></article>
    <form class="ask askmini" hidden>
      <input class="q2" type="text" placeholder="Ask a follow-up…" autocomplete="off">
      <button class="go2" type="submit" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </main>
</div>
<style>
.px{--bg:#0a0a0f;--surface:#13131c;--surface2:#191922;--line:#23232f;--ink:#ececf2;--muted:#9a9aab;--subtle:#5e5e72;
  --accent:#8b93ff;--searching:#6aa8ff;--reading:#ffc760;--thinking:#b89bff;--done:#5fe0a8;
  position:fixed;inset:0;overflow-y:auto;background:var(--bg);color:var(--ink);
  font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.px *{box-sizing:border-box}
.px .glow{position:fixed;top:-30vh;left:50%;transform:translateX(-50%);width:90vw;height:70vh;pointer-events:none;
  background:radial-gradient(ellipse at center,#8b93ff22,transparent 60%);filter:blur(40px);z-index:0}
.px .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.6rem;padding:.7rem 1.1rem;background:#0a0a0fcc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.px .logo,.px .brand{display:flex;align-items:center;gap:.55rem;font-weight:600;letter-spacing:-.01em}
.px .grow{flex:1}
.px .newbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:.4rem .9rem;font-size:.85em;cursor:pointer}
.px .newbtn:hover{border-color:var(--accent)}
.px .glyph{width:18px;height:18px;border-radius:6px;background:conic-gradient(from 210deg,var(--accent),#c084fc,#22d3ee,var(--accent));box-shadow:0 0 14px -2px var(--accent)}

.px .hero{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18vh 1.2rem 4rem;text-align:center}
.px .hero .brand{justify-content:center;color:var(--muted);font-size:.92rem;margin-bottom:1.4rem}
.px .hero h1{margin:0 0 2rem;font-size:2.3rem;line-height:1.15;letter-spacing:-.03em;font-weight:600;
  background:linear-gradient(180deg,#fff,#b9b9cc);-webkit-background-clip:text;background-clip:text;color:transparent}
.px .ask{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:.55rem .55rem .55rem 1.1rem;box-shadow:0 8px 40px -12px #8b93ff33,0 2px 8px #0008;transition:.18s}
.px .ask:focus-within{border-color:var(--accent);box-shadow:0 8px 50px -10px #8b93ff55,0 2px 8px #0008}
.px .q,.px .q2{flex:1;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:1.05rem}
.px .q::placeholder,.px .q2::placeholder{color:var(--subtle)}
.px .agc{display:flex;align-items:center;gap:.3rem;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:.2rem .4rem;color:var(--muted);font-size:.82em;flex:none}
.px .agc button{width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;line-height:1}
.px .agc button:hover{background:var(--line);color:var(--ink)}
.px .snum{min-width:1.1em;text-align:center;color:var(--ink);font-weight:600}
.px .go,.px .go2{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:var(--accent);color:#0a0a0f;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 16px -4px var(--accent)}
.px .go:hover{filter:brightness(1.12)}
.px .chips{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1.4rem}
.px .chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.45rem .9rem;font-size:.85em;cursor:pointer;transition:.15s}
.px .chip:hover{color:var(--ink);border-color:var(--accent)}
.px .recent{max-width:520px;margin:2rem auto 0;text-align:left}
.px .rh{color:var(--subtle);font-size:.74em;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.px .ritem{display:flex;gap:.6rem;align-items:baseline;padding:.55rem .2rem;border-top:1px solid var(--line);cursor:pointer}
.px .ritem:hover .rq{color:var(--accent)}
.px .rq{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px .rmeta{flex:none;color:var(--subtle);font-size:.78em}

.px .result{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:2.5rem 1.2rem 8rem}
.px .qh{font-size:1.9rem;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0 0 1.4rem}
.px .prog{border:1px solid var(--line);border-radius:14px;background:#ffffff05;padding:.9rem 1.1rem;margin-bottom:1.4rem;transition:.3s}
.px .prog.done{opacity:.0;height:0;padding:0;margin:0;border:0;overflow:hidden}
.px .pline{display:flex;align-items:center;gap:.6rem;color:var(--ink);font-weight:500}
.px .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.px .avs{display:flex;flex-wrap:wrap;gap:5px;margin:.7rem 0 .2rem}
.px .av{width:26px;height:26px;border-radius:7px;overflow:hidden;border:1.5px solid var(--line);position:relative}
.px .av svg{display:block;width:100%;height:auto}
.px .av[data-s=searching]{border-color:var(--searching)}.px .av[data-s=reading]{border-color:var(--reading)}
.px .av[data-s=thinking]{border-color:var(--thinking)}.px .av[data-s=done]{border-color:var(--done)}
.px .av[data-s=searching],.px .av[data-s=reading],.px .av[data-s=thinking]{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.px .act{color:var(--muted);font-size:.88em;margin-top:.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px .sources{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:1.6rem;scrollbar-width:thin}
.px .sources:empty{display:none}
.px .scard{flex:none;width:170px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:.55rem .65rem;text-decoration:none;color:var(--ink);transition:.15s}
.px .scard:hover{border-color:var(--accent);background:var(--surface2)}
.px .scard .sd{font-size:.72em;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:.2rem}
.px .scard .st{font-size:.82em;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.px .report{font-size:1.04rem}
.px .report h1{font-size:1.7rem;letter-spacing:-.02em;margin:1.6rem 0 .8rem}
.px .report h2{font-size:1.3rem;letter-spacing:-.015em;margin:1.8rem 0 .6rem;padding-top:.2rem}
.px .report h3{font-size:1.08rem;margin:1.3rem 0 .4rem;color:var(--accent)}
.px .report p{margin:.7rem 0;color:#dcdce6}
.px .report ul{margin:.7rem 0;padding-left:1.3rem}.px .report li{margin:.3rem 0;color:#dcdce6}
.px .report b{color:#fff}
.px .report a{color:var(--accent);text-decoration:none;border-bottom:1px solid #8b93ff44}.px .report a:hover{border-color:var(--accent)}
.px .report .shimmer{background:linear-gradient(90deg,#5e5e72,#ececf2,#5e5e72);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite;font-size:1.1rem}
@keyframes sh{to{background-position:-200% 0}}
.px .askmini{max-width:740px;position:fixed;left:50%;transform:translateX(-50%);bottom:1.4rem;width:calc(100% - 2.4rem);max-width:600px;z-index:9}
</style>
<script>(function(){
  var root=document.getElementById('app'); if(!root) return;
  var G=window.gsap, stream=root.dataset.stream, es=null, agents={}, sources={}, srcN=0, spawned=0, done=0, naAgents=8;
  var hero=root.querySelector('.hero'), result=root.querySelector('.result'), top=root.querySelector('.top');
  var qh=root.querySelector('.qh'), prog=root.querySelector('.prog'), ptxt=root.querySelector('.ptxt'), avs=root.querySelector('.avs'), act=root.querySelector('.act');
  var srcWrap=root.querySelector('.sources'), report=root.querySelector('.report'), askmini=root.querySelector('.askmini');
  var q=root.querySelector('.q'), q2=root.querySelector('.q2'), snum=root.querySelector('.snum');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function md(t){return '<p>'+esc(t)
    .replace(/^### (.*)$/gm,'</p><h3>$1</h3><p>').replace(/^## (.*)$/gm,'</p><h2>$1</h2><p>').replace(/^# (.*)$/gm,'</p><h1>$1</h1><p>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/(^|\n)[-*] (.*)/g,'$1<li>$2</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';}
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function avatar(id){var h=hash(id),hue=h%360,c='hsl('+hue+',60%,66%)',cells='';
    for(var y=0;y<5;y++)for(var x=0;x<3;x++){if((h>>(y*3+x))&1){var xs=[x,4-x];for(var k=0;k<xs.length;k++)cells+='<rect x="'+(xs[k]*10)+'" y="'+(y*10)+'" width="10" height="10"/>';}}
    return '<svg viewBox="0 0 50 50" fill="'+c+'"><rect width="50" height="50" fill="#191922"/>'+cells+'</svg>';}
  function domainOf(u){try{return (u.split('/')[2]||u).replace('www.','');}catch(e){return u;}}
  function step(n){naAgents=Math.max(1,Math.min(48,naAgents+n));snum.textContent=naAgents;}
  root.querySelector('.sdec').addEventListener('click',function(){step(-1);});
  root.querySelector('.sinc').addEventListener('click',function(){step(1);});
  [].forEach.call(root.querySelectorAll('.chip'),function(c){c.addEventListener('click',function(){q.value=c.textContent;q.focus();});});
  function loadHistory(){fetch('/sessions').then(function(r){return r.json();}).then(function(rows){
    var rc=root.querySelector('.recent');if(!rc)return;if(!rows||!rows.length){rc.innerHTML='';return;}
    rc.innerHTML='<div class="rh">Recent</div>'+rows.map(function(s){return '<div class="ritem" data-id="'+s.id+'"><span class="rq">'+esc(s.query)+'</span><span class="rmeta">'+s.agents+' agents</span></div>';}).join('');
    [].forEach.call(rc.querySelectorAll('.ritem'),function(el){el.addEventListener('click',function(){openSession(el.dataset.id);});});
  }).catch(function(){});}
  function show(){hero.hidden=true;result.hidden=false;top.hidden=false;}
  function reset(query){show();qh.textContent=query;agents={};sources={};srcN=0;spawned=0;done=0;
    prog.classList.remove('done');prog.hidden=false;ptxt.textContent='Planning research…';avs.innerHTML='';act.textContent='';
    srcWrap.innerHTML='';report.innerHTML='';askmini.hidden=true;
    if(G)G.from(qh,{opacity:0,y:10,duration:.4});}
  function progress(){ptxt.textContent=(done<spawned?(done+' of '+spawned+' agents reported'):(spawned+' agents'))+(srcN?(' · '+srcN+' sources'):'');}
  function avatarChip(id){var el=document.createElement('span');el.className='av';el.dataset.s='thinking';el.innerHTML=avatar(id);avs.appendChild(el);if(G)G.from(el,{scale:.3,opacity:0,duration:.4,ease:'back.out(2)'});return el;}
  function sourceCards(){var urls=Object.keys(sources);srcWrap.innerHTML=urls.slice(0,12).map(function(u){return '<a class="scard" href="'+esc(u)+'" target="_blank"><div class="sd">'+esc(domainOf(u))+'</div><div class="st">'+esc(sources[u].title||u)+'</div></a>';}).join('');}
  function finish(){prog.classList.add('done');askmini.hidden=false;sourceCards();}
  function ev(e){
    if(e.type==='fleet'){ptxt.textContent='Breaking this into focused questions…';return;}
    if(e.type==='round'){ptxt.textContent='Round '+e.n+' · dispatching '+e.dispatching+' agents';return;}
    if(e.type==='digest'){act.textContent=e.note||'';return;}
    if(e.type==='spawn'){agents[e.id]={el:avatarChip(e.id),sources:[]};spawned++;progress();return;}
    var a=agents[e.id];
    if(e.type==='state'){if(!a)return;a.el.dataset.s=e.status;
      if(e.status==='searching')act.textContent=e.id+' searching: '+(e.action||'');else if(e.status==='reading')act.textContent=e.id+' reading '+domainOf(e.url||'');return;}
    if(e.type==='page'){if(!a)return;if(e.url&&!sources[e.url]){sources[e.url]={title:(e.preview||'').split('\n')[0].replace(/^#+\s*/,'').slice(0,90)};srcN++;progress();}return;}
    if(e.type==='done'){if(!a)return;a.el.dataset.s='done';done++;progress();return;}
    if(e.type==='synth'){ptxt.textContent='Synthesizing…';report.innerHTML='<span class="shimmer">Writing the report…</span>';return;}
    if(e.type==='report'){report.innerHTML=md(e.content||'');finish();if(G)G.from(report,{opacity:0,y:16,duration:.6,ease:'power3.out'});return;}
    if(e.type==='fleet_done'||e.type==='end'){if(es){es.close();es=null;}prog.classList.add('done');return;}
  }
  function openSession(id){fetch('/sessions/'+id).then(function(r){return r.json();}).then(function(s){
    if(!s||!s.query)return;reset(s.query);prog.classList.add('done');askmini.hidden=false;
    report.innerHTML=md(s.report||'');
  }).catch(function(){});}
  function start(query){query=(query||'').trim();if(!query)return;reset(query);
    if(es)es.close();es=new EventSource('/live/'+encodeURIComponent(stream)+'?q='+encodeURIComponent(query)+'&max='+naAgents);
    es.onmessage=function(m){try{ev(JSON.parse(m.data));}catch(_){}};es.onerror=function(){if(es){es.close();es=null;}};}
  root.querySelector('.ask').addEventListener('submit',function(x){x.preventDefault();start(q.value);});
  askmini.addEventListener('submit',function(x){x.preventDefault();var v=q2.value;q2.value='';start(v);window.scrollTo({top:0,behavior:'smooth'});});
  root.querySelector('.newbtn').addEventListener('click',function(){if(es){es.close();es=null;}location.reload();});
  loadHistory();
})();</script>
</body></html>
