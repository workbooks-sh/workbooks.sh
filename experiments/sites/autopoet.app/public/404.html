<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Autopoet</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=geist:400,500,600,700|jetbrains-mono:400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { height: 100svh; display: grid; place-items: center; text-align: center; }
  .wrap { display: grid; gap: 14px; justify-items: center; padding: 24px; }
  h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 700; letter-spacing: -0.04em; }
</style>
</head>
<body class="grid-paper">
  <div class="wrap">
    <span class="kicker">verdict: fail · route: rejected</span>
    <h1>404</h1>
    <p style="color: var(--fg-muted); max-width: 42ch;">
      This path didn't parse. The reason has been written to the knowledge log.
    </p>
    <a class="btn btn-primary" href="/">back to the graph</a>
  </div>
<script src="/theme.js" defer></script>
</body>
</html>
