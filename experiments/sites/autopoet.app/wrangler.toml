name = "autopoet-app"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

routes = [
  { pattern = "autopoet.app", custom_domain = true },
  { pattern = "www.autopoet.app", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true
