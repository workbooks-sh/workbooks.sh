[package]
name = "wb-cli"
version = "0.13.0"
edition = "2021"
description = "Workbooks CLI — one Rust source, native + wasm32-wasip1 targets."
license = "Apache-2.0"
repository = "https://github.com/workbooks-sh/workbooks.sh"

[[bin]]
name = "wbx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
# The OQL kernel as a pure rlib — local org ops, no running runtime needed.
# default-features = false drops the wasm-Component glue so it links cleanly on
# BOTH the CLI's native and wasm32-wasip1 targets (same crate, just the rlib).
oql = { path = "../runtime/kernel", default-features = false }
# .wbundle is a plain zip (workbook.html + vfs.sqlite + manifest.json) — match
# the runtime's :zip exactly. Store+deflate only; no crypto/time/zstd bloat.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Provenance: Ed25519 over canonical JSON, did:key (multicodec 0xed01, base58btc),
# sha256 asset integrity — byte-compatible with Workbooks.Manifest / Workbooks.Git.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

# Native-only edge: HTTP (RCP to the runtime + publish targets).
# On wasm32 these go through host imports brokered by the runtime Dock instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
