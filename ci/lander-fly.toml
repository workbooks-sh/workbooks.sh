# wb-lander-live — app config. auto_stop OFF is load-bearing: the resident
# agent's clock dies with the machine. Deploys MUST use this file
# (fly deploy -c ci/lander-fly.toml --image …) or they silently re-enable
# autostop from stale server-side config.
app = "wb-lander-live"
primary_region = "sjc"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
