# wb-bitml — the bit.ml newsroom box. auto_stop OFF is load-bearing: the crew's
# clocks die with the machine. Deploys MUST use this file.
app = "wb-bitml"
primary_region = "sjc"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "wb_data"
  destination = "/data"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
