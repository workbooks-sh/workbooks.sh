# Worker name — gates the *.workers.dev URL. Renamed 2026-05-27 from
# adalign-api as part of the brandnana promotion (wb-lba7). D1 + R2
# bindings cut over 2026-05-28 from the adalign-named resources to
# the brandnana-named ones: a one-shot worker copied 714 R2 objects
# (1.34 GB) in-account and `wrangler d1 export/import` mirrored the
# 10 tables. The old adalign D1 + adalign-assets bucket stay around
# as fallback until /health verification settles.
name = "brandnana-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Pin to Shane@shinyobjectz.com's CF account (multi-account login otherwise
# errors in non-interactive mode).
account_id = "6d4b74aeb10f455fbf88141901e7595d"

# Surface env name to /health.
[vars]
ENV_NAME = "production"

# D1: service-side state (oauth tokens, vendor cache, job queue)
[[d1_databases]]
binding = "DB"
database_name = "brandnana"
database_id = "624defd0-4919-4191-86c4-4c52bef0e31c"

# R2: ad creatives, product images, per-user sqlite snapshots
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "brandnana-assets"

# Browser Rendering: headless Chromium (no provisioning required)
[browser]
binding = "BROWSER"

# Durable Objects: per-(tenant, domain) crawl coordination (ad-3ul.13).
[[durable_objects.bindings]]
name = "CRAWL"
class_name = "CrawlCoordinator"

# DO migrations — required to create the new class.
[[migrations]]
tag = "v1-crawl-coordinator"
new_classes = ["CrawlCoordinator"]

# Secrets (set via apps/api/scripts/secrets-push.sh):
#   CEREBRAS_API_KEY            — primary agent-curation LLM
#   OPENROUTER_API_KEY          — primary book-composition + vision LLM
#   CLERK_SECRET_KEY            — portal session-JWT verification
#   FIRECRAWL_API_KEY           — page scraping
#   SCRAPECREATORS_API_KEY      — ALL ad intelligence (ad-library fan-out)
#   CONTEXT_DEV_API_KEY         — brand retrieve / styleguide / fonts (logo.dev rebrand)
#   VALYU_API_KEY               — general web research (replaces EXA)
#   WORKOS_API_KEY, WORKOS_CLIENT_ID — AuthKit/SSO
#   GROQ_API_KEY                — fast-inference LLM upstream
#   THE_COMPANIES_API_KEY       — company enrichment (GET /brand/:domain/company)
#   EXA_API_KEY                 — DEPRECATED, replaced by Valyu; remove after migration
#   META_CLIENT_ID, META_CLIENT_SECRET         — OAuth (deferred)
#   TIKTOK_CLIENT_ID, TIKTOK_CLIENT_SECRET     — OAuth (deferred)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET     — OAuth (deferred)
