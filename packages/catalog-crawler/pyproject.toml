[project]
name = "brandnana-crawler"
version = "0.0.0"
description = "Sandboxed product-catalog crawler for Brandnana. Runs in E2B."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.20",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandnana_crawler"]
