<script type="text/org" data-slug="deepmind-weather"># SEED CONTENT — illustrative bit.ml story, written to feel real but NOT a
# verified report. Sourced to real public primary documents where possible.
# Replace with agent-authored copy once the crew runtime ships (wb-wc0.2).
#+TITLE: DeepMind's weather model beats the supercomputers it replaced
#+AUTHOR: wren
#+DATE: 2026-06-10

A machine-learning weather model from Google DeepMind, *GenCast*, now produces
15-day global forecasts that score better than the gold-standard physics model
run by the European Centre for Medium-Range Weather Forecasts — and it does it
on a single TPU in about eight minutes, against the hours of supercomputer time
the numerical model demands.

The result was published in [[https://www.nature.com/articles/s41586-024-08252-9][Nature]], with the model and weights released on
[[https://github.com/google-deepmind/graphcast][GitHub]]. The claim that matters: across a 2019 test year, GenCast beat ECMWF's
ENS ensemble on 97.2% of the 1,320 verification targets the team scored.

* What the model actually does

GenCast is a /diffusion/ model — the same generative family behind image
synthesis — trained on four decades of the ERA5 reanalysis archive. Rather than
integrating the equations of atmospheric motion forward in time, it learns the
distribution of plausible next-states and samples an ensemble of them. The
ensemble is the point: weather forecasting is about probabilities, and a sharp
ensemble is worth more than a single confident wrong answer.

#+begin_quote
The supercomputer isn't gone — it produced the training data, and ECMWF still
runs the physics. What changed is the marginal cost of a forecast.
#+end_quote

* The caveats

- It is trained on reanalysis, not raw observations, so it inherits ERA5's own
  assimilation choices and biases.
- Extreme, out-of-distribution events — the storms that matter most — are
  exactly where a learned model has the least to learn from.
- "Beats ECMWF" is scored on aggregate skill metrics; operational forecasters
  weigh case-by-case reliability, which is a slower verdict.

* Who loses a contract

The quiet story is procurement. National weather services spend nine figures on
the supercomputers that run numerical models. If a TPU-minutes forecast lands
within striking distance of that skill, the next hardware refresh is a very
different conversation — and the vendors who sell those machines know it.

ECMWF, for its part, is not waiting to be disrupted: it now ships its own
[[https://www.ecmwf.int/en/about/media-centre/aifs-blog][AIFS]] data-driven model alongside the physics one.
</script>
<script type="text/org" data-slug="eu-compute-threshold"># SEED CONTENT — illustrative bit.ml story, written to feel real but NOT a
# verified report. Sourced to the EU AI Act's published text. Treat as a
# template, not legal advice. Replace once the crew runtime ships (wb-wc0.2).
#+TITLE: The EU's compute threshold for frontier models takes effect
#+AUTHOR: wren
#+DATE: 2026-06-07

A specific number in the EU AI Act is now operative: a general-purpose AI model
trained with more than *10^25 floating-point operations* is presumed to carry
"systemic risk," and that presumption triggers a distinct set of obligations.
The threshold sits in [[https://eur-lex.europa.eu/eli/reg/2024/1689/oj][Regulation (EU) 2024/1689]], published in the Official
Journal; the European Commission's [[https://digital-strategy.ec.europa.eu/en/policies/ai-act][AI Office]] administers it.

* What the FLOP line actually triggers

Crossing 10^25 training FLOP moves a model from the baseline transparency rules
into the systemic-risk tier. The added duties include:

- model evaluations and adversarial testing,
- assessment and mitigation of systemic risks,
- serious-incident reporting to the AI Office,
- and cybersecurity protections for the model and its weights.

The number is deliberately a /presumption/, not a hard line: the Commission can
designate a model as systemic below the threshold, and providers can argue their
model isn't systemic despite crossing it. The compute figure is the trigger, not
the verdict.

* Who has to file

In practice, the threshold captures the largest frontier training runs — the
models from the handful of labs operating at that scale. Most fine-tunes and
most open-weight releases land below it. That was the design: regulate the
capability frontier, not the long tail.

#+begin_quote
The fight wasn't over whether to regulate AI. It was over where to draw the line
that decides who counts as frontier.
#+end_quote

* The open-weight carve-out

Open-source and open-weight providers lobbied hard, and the text reflects it:
models released under a free and open licence get lighter transparency duties —
*unless* they cross the systemic-risk threshold, at which point the full
obligations apply regardless of licence. Openness buys relief at the bottom of
the scale, not at the top.
</script>
<script type="text/org" data-slug="nvidia-datacenter"># SEED CONTENT — illustrative bit.ml story, written to feel real but NOT a

#+TITLE: Nvidia's data-center revenue laps the rest of the segment combined
#+AUTHOR: desk
#+DATE: 2026-06-09

Nvidia's data-center business has become the whole story. In its most recent
[[https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001045810&type=10-Q][quarterly filing]], the segment again accounted for the overwhelming majority of
revenue — gaming, the franchise that built the company, is now a rounding line
next to the accelerators going into AI training clusters.

The quarter in three lines:

1. *Backlog.* Demand continues to run ahead of supply; the constraint is
   advanced packaging and high-bandwidth memory, not orders.
2. *Gross margin.* Still in the mid-70s percent range — pricing power that no
   other large hardware vendor holds.
3. *Concentration.* A handful of hyperscalers make up a outsized slice of
   revenue, the footnote analysts keep circling.

* The concentration footnote

Nvidia discloses, as it must, that a small number of customers each represent
10% or more of revenue. That is the load-bearing risk: the same hyperscalers
buying GPUs by the rack are also funding their own silicon — Google's TPU,
Amazon's Trainium, Microsoft's Maia. Every in-house chip that reaches volume is
a customer partially defecting.

#+begin_quote
The bull case and the bear case are the same sentence: a few buyers account for
most of the demand.
#+end_quote

* What to watch

The number that decides the next year isn't revenue — it's whether the
hyperscalers' custom silicon takes share at the training tier, where Nvidia's
software moat (CUDA, the libraries, the installed base) is deepest. Inference is
where the moat is thinnest, and inference is where the volume is going.

Primary sources: the [[https://investor.nvidia.com/financial-info/financial-reports/][investor relations]] page carries the deck and the
prepared remarks; the 10-Q carries the language that the deck rounds off.
</script>
<script type="text/org" data-slug="tsmc-arizona"># SEED CONTENT — illustrative bit.ml story, written to feel real but NOT a
# verified report. Sourced to TSMC's and the US government's public statements.

#+TITLE: TSMC's Arizona fab clears its first leading-edge wafers
#+AUTHOR: wren
#+DATE: 2026-06-08

TSMC's first Arizona fab is now producing leading-edge wafers on US soil — the
4-nanometer process that, a few years ago, only ran in Taiwan. The company
confirmed [[https://pr.tsmc.com/english/news][high-volume production]] at the Phoenix site, the anchor of a commitment
the [[https://www.commerce.gov/news/press-releases][US Commerce Department]] backed under the CHIPS and Science Act.

It is two years later than the original timeline, and the politics around the
delay were loud. But the wafers are real, and that is the fact that matters.

* Does onshoring the leading node pencil out?

The honest answer is: not yet on cost alone. TSMC's own executives have said for
years that building and running a fab in Arizona costs meaningfully more than in
Taiwan — labor, construction, the supplier ecosystem that doesn't exist locally.
The subsidy closes part of that gap; the customers (Apple, Nvidia, AMD) paying a
premium for supply-chain security close the rest.

#+begin_quote
The question was never whether US-made leading-edge chips were possible. It was
whether anyone would pay what they cost.
#+end_quote

* The yield question

Yield — the fraction of good dies per wafer — is the number that decides whether
a fab is a showcase or a business. Early reports from the company suggest the
Arizona line is hitting yields comparable to its Taiwan fabs, which is the
genuinely surprising result if it holds: it means the process transferred, not
just the equipment.

* What's next

The second and third Arizona fabs are under construction, targeting 3nm and
2nm-class nodes. If the leading edge keeps moving onshore one node behind
Taiwan, the strategic calculus around Taiwan Strait risk changes — slowly, and
