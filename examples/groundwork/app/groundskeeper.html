<!doctype html>
<!-- groundskeeper — voice-first, one orb, nothing else (wb-3ojf.5).
     Served by the bridge at /gk/app, or wrapped by the native shell (which
     seeds gk-bridge/gk-secret into localStorage at build time; this committed
     file carries no credentials). Voice: @elevenlabs/client over a signed URL
     minted host-side. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>groundskeeper</title>
<style>
  :root { --green:#3fe081; --green-dim:#149157; --bg:#070b08; --text:#d7e4da; --mut:#5d7264; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #0c130e 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace;
    display:flex; flex-direction:column; align-items:center;
    padding: calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 28px);
    user-select:none; -webkit-user-select:none;
  }
  #mark { font-size:12px; letter-spacing:.28em; color:var(--mut); }
  #mark b { color:var(--green); font-weight:600; }

  #stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; width:100%; }

  #orb {
    width:172px; height:172px; border-radius:50%;
    border:1px solid rgba(63,224,129,.35);
    background:
      radial-gradient(circle at 38% 32%, rgba(63,224,129,.22), transparent 58%),
      radial-gradient(circle at 50% 50%, rgba(20,145,87,.16), rgba(7,11,8,.9) 70%);
    box-shadow: 0 0 36px rgba(63,224,129,.10), inset 0 0 28px rgba(63,224,129,.08);
    transition: box-shadow .4s, border-color .4s, transform .2s;
  }
  #orb:active { transform: scale(.97); }
  body.connecting #orb { animation: pulse 1.1s ease-in-out infinite; }
  body.listening  #orb { border-color: rgba(63,224,129,.8); box-shadow: 0 0 56px rgba(63,224,129,.28), inset 0 0 34px rgba(63,224,129,.14); animation: breathe 3.2s ease-in-out infinite; }
  body.speaking   #orb { border-color: var(--green); box-shadow: 0 0 80px rgba(63,224,129,.45), inset 0 0 40px rgba(63,224,129,.22); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.045); } }
  @keyframes pulse   { 50% { transform: scale(1.03); opacity:.86; } }

  #status { font-size:12px; letter-spacing:.18em; color:var(--mut); text-transform:lowercase; min-height:18px; }
  body.listening #status, body.speaking #status { color: var(--green-dim); }

  #caption {
    min-height:66px; max-width:34ch; text-align:center; color:var(--text);
    font-size:15px; line-height:1.55; opacity:0; transition: opacity .5s;
  }
  #caption.show { opacity:.92; }

  /* the single fallback surface: a centered field, shown only when locked /
     unconfigured. no dialogs, no panels. */
  #gate { display:none; flex-direction:column; gap:12px; width:min(78vw,300px); }
  body.locked #gate { display:flex; }
  body.locked #orb, body.locked #status, body.locked #caption { display:none; }
  #gate input {
    width:100%; padding:14px 16px; font:inherit; text-align:center; border-radius:12px;
    background:rgba(255,255,255,.04); color:var(--text); border:1px solid rgba(63,224,129,.25); outline:none;
  }
  #gate input:focus { border-color: var(--green-dim); }
  #gate .hint { font-size:11px; color:var(--mut); text-align:center; }
</style>
</head>
<body>
  <div id="mark"><b>●</b>&nbsp;GROUNDSKEEPER</div>

  <div id="stage">
    <div id="gate">
      <input id="password" type="password" placeholder="password" autocomplete="current-password" enterkeyhint="go">
      <div class="hint">the gate is locked</div>
    </div>
    <div id="orb"></div>
    <div id="status">tap to talk</div>
    <div id="caption"></div>
  </div>

<script type="module">
  import { Conversation } from "https://esm.sh/@elevenlabs/client@latest";

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  let convo = null;

  const base = () => localStorage.getItem("gk-bridge") || "";
  const secret = () => localStorage.getItem("gk-secret") || "";
  const setState = (s, label) => { body.className = s; $("status").textContent = label; };
  const caption = (t) => { const c = $("caption"); c.textContent = t; c.classList.toggle("show", !!t); };

  const bridge = async (path, payload) => {
    const r = await fetch(base() + path, {
      method: "POST",
      credentials: "same-origin",
      headers: Object.assign({ "content-type": "application/json" }, secret() ? { "x-gk-secret": secret() } : {}),
      body: JSON.stringify(payload || {})
    });
    if (r.status === 403) { setState("locked", ""); throw new Error("locked"); }
    if (!r.ok) throw new Error("bridge " + r.status);
    return r.json();
  };

  async function start() {
    setState("connecting", "connecting");
    try {
      const { signed_url } = await bridge("/gk/tool/signed_url");
      convo = await Conversation.startSession({
        signedUrl: signed_url,
        connectionType: "websocket",
        onConnect: () => setState("listening", "listening"),
        onDisconnect: () => stop(true),
        onModeChange: (m) => setState(m.mode === "speaking" ? "speaking" : "listening", m.mode),
        onMessage: (m) => { if (m.source === "ai") caption(m.message); },
        onError: (e) => { caption("⚠ " + (e?.message || e)); stop(true); }
      });
    } catch (e) {
      if (e.message !== "locked") { caption("⚠ " + e.message); setState("", "tap to talk"); }
    }
  }
  async function stop(silent) {
    try { await convo?.endSession(); } catch {}
    convo = null;
    if (!silent) caption("");
    setState("", "tap to talk");
  }

  $("orb").onclick = () => (convo ? stop() : start());

  // PWA unlock: password → 30-day session cookie; secrets stay host-side.
  $("password").addEventListener("keydown", async (ev) => {
    if (ev.key !== "Enter") return;
    const r = await fetch(base() + "/gk/login", {
      method: "POST", credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: $("password").value })
    });
    if (r.ok) { $("password").value = ""; setState("", "tap to talk"); }
    else $("password").value = "";
  });

  // Probe auth once at open so the gate shows immediately when needed.
  bridge("/gk/tool/tasks").catch(() => {});
</script>
</body>
</html>
