<script type="text/plain" id="c-live-state">
# A task is DATA — parsed, never compiled to wasm. So its state is LIVE:
# you change it by EDITING the declaration. The document IS the store.

task "tune the scorer", status: :todo,  owner: :ada
# an agent claims it → the SAME line becomes:
task "tune the scorer", status: :doing, owner: :ada, lock: "wb-7f3"

# nothing recompiles — only the FUNCTION lane (target → wasm) ever compiles.
# data edits are cheap + live, and every edit is versioned — restorable, like
# Drive history (our own workspace layer, not an external tool).
#
# declarative ≠ frozen. it's the DOM: live markup that's also the source.
</script>
