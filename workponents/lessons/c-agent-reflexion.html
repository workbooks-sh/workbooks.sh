# Reflexion

This is `reflexion.work` — a self-improving agent that *generates*, *critiques* its
own draft, and *revises*. Its memory **is the trace of attempts**, each one a draft
plus its self-critique plus a score:

@type attempt :: %{draft: String.t(), critique: String.t(), score: float()}

The **brain** carries that trace as memory and reaches for no external tools — this
is pure reasoning (see [[The brain]]):

agent :writer do
  model  :mimo
  system "Draft, critique your own draft honestly, then revise. Stop when it's good."
  memory list(Attempt)                    # memory = the trace of attempts
  tools  []                               # pure reasoning, no external tools
end

The loop is plain **`server` Elixir** — reflect until the score clears the bar. Every
revision sees the prior attempts, so the agent learns from its own history:

server :reflexion do
  def run(task, attempts \\ []) do
    draft    = generate(:writer, task, attempts)
    critique = self_critique(:writer, draft)
    a        = %Attempt{draft: draft, critique: critique, score: score(critique)}
    if a.score >= 0.9, do: draft, else: run(task, [a | attempts])
  end
end

Because **memory is typed data** and **the loop is plain Elixir**, a well-known
research pattern fits in a single literate file — and it runs as-is, no store needed.
</script>
