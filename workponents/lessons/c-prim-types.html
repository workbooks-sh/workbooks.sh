# Types

A type is **plain Elixir**, and we anchor on the parts that don't change: a
**struct** for a record, **atoms** for an enum, a **tagged tuple** for a tagged
choice. You write the data the way you already would, and the compiler reads its
*shape* to generate the cross-language contract — so you never author or even see
it (that's [[The data model]]).

Declare them once in a shared file, imported where used — never the index:

# team.work — shared definitions:

@statuses [:todo, :doing, :done]                 # an enum — the allowed atoms

defmodule User do
  defstruct name: "", email: ""                  # a record — a struct;
end                                              # the defaults give the field types

user :analyst, %User{name: "Ada Lovelace", email: "ada@acme.co"}   # a value of User
user :shane,   %User{name: "Shane",        email: "shane@acme.co"}

Anything references those **by name**, and the weave gate checks both that the ref
resolves *and* that the value fits the shape:

task "tune the scorer", status: :todo, owner: :analyst, ref: :scorer
#                       ^ one of @statuses     ^ a defined User

Want more precision than the defaults carry? Add a type annotation — but it stays
**optional**: the struct and its values already pin the contract. (Elixir's own
type system is mid-evolution, so we lean on stable *structure* and treat annotations
as a layer that rides along — see [[The data model]].)
