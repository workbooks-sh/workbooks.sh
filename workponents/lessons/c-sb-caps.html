# Caps & limits

A sandbox decides not just *who runs together* but *what they're allowed to do*. By
default a unit can touch nothing outside its own memory — no network, no files, no
secrets. You hand it power explicitly, one capability at a time:

sandbox :pricing, grant: [:net, :kv], memory: "128mb", timeout: 30_000 do
  server :score, uses: :fx do … end
end

Three things are being set here. **`grant:`** is the list of capabilities the box
may use — `net`, `kv`, `fs`, `secrets`, and the rest; anything not granted simply
isn't reachable. **`memory:`** caps how much it can allocate. **`timeout:`** caps
how long a call may run before it is stopped.

The enforcement is the part worth trusting. Caps are checked **by construction**:
each capability a unit uses becomes an import in its compiled WIT world, and a unit
that imports a capability its sandbox never granted **fails to instantiate** — it
cannot start, let alone run. There's no runtime check to forget and no flag to set
the wrong way; an ungranted `net` is just a component that won't load.

This is why placement and caps are different axes. `server` is the tier *allowed* to
ask for `net` or the database; the sandbox's `grant:` is where you actually hand
those over. A `client` unit, however it's written, can't be granted what its
placement forbids. Where it runs sets the ceiling; the grant sets the reach. #sandbox
</script>
