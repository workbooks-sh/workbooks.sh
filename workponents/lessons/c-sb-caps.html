# Caps & limits

A sandbox decides not just *who runs together* but *what they're allowed to do*. By
default a unit can touch nothing outside its own memory — no network, no files, no
secrets. You hand it power explicitly, one capability at a time:

sandbox :pricing, grant: [:net, :kv], memory: "128mb", timeout: 30_000 do
  server :score, uses: :fx do … end
end

Three things are being set here. **`grant:`** is the list of capabilities the box
may use — `net`, `kv`, `fs`, `secrets`, and the rest; anything not granted simply
isn't reachable. **`memory:`** caps how much it can allocate. **`timeout:`** caps
how long a call may run before it is stopped.

You won't want to spell those out on every box. A profile is just config, so bind
it **once** to a plain Elixir module attribute and stamp it onto many:

@pricing grant: [:net, :kv], memory: "128mb", timeout: 30_000

sandbox :quotes,  @pricing do … end
sandbox :billing, @pricing do … end

`@pricing` is just the box's options as a plain keyword list, so you pass it
straight in — no special keyword needed. Override one with ordinary Elixir:
`@pricing ++ [timeout: 60_000]`. Change the profile in one place and every box that
passes it moves together.

The enforcement is the part worth trusting. For a wasm unit it's **structural**:
each capability becomes an import in the unit's compiled WIT world, and importing one
the sandbox never granted means the component **fails to instantiate** — it cannot
start, let alone run. For native server Elixir, the **nexus** enforces the very same
grant at the capability seam (the Dock), so an ungranted `net` is simply unreachable.
Either way there's no runtime check to forget and no flag to set the wrong way.

This is why placement and caps are different axes. `server` is the tier *allowed* to
ask for `net` or the database; the sandbox's `grant:` is where you actually hand
those over. A `client` unit, however it's written, can't be granted what its
placement forbids. Where it runs sets the ceiling; the grant sets the reach. #sandbox
</script>
