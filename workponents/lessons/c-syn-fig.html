## The numbers

A figure is **markdown** — it never runs, so there's no keyword for it. Richness
escalates in two markdown rungs, then code. The floor is a plain inline image;
its alt text *is* the caption (a lone image renders as a `<figure>`):

![Revenue by quarter, FY24](revenue.png)

Need a richer caption — **bold**, a link, a second line? Don't reach for a new
construct: write a markdown paragraph right under the image. Co-located prose is
the whole point of a literate file, and it reads as the caption:

![Revenue by quarter, FY24](revenue.png)

Revenue climbed every quarter — see the [board](work://board#q4). *Still markdown.*

And when markdown genuinely can't say it, a `sandbox` unit renders it — a
front-end island, hydrated in the browser, with *no custom elements* needed:

sandbox client :revenue_chart, reads: :ranked do
  # the front-end that charts the data — hydrated in the browser
end

Two markdown rungs, then code. No `figure` keyword, no new grammar. #rich-text
