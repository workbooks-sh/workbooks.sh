# The four lanes — one document, written in all of them

This whole file is a work document, and every line sits in exactly ONE lane,
decided by a single question: WHO READS IT? This paragraph is markdown — the
rich-text lane — so a human is reading it. It explains; it never runs.


## ① rich text — what a HUMAN reads   →   markdown

Headings, **bold**, lists, links, quotes, figures: everything you're reading now.
The rule that keeps the format clean — markdown only narrates. It never holds
logic, a value, or a field. The moment a line gains behavior, it leaves this lane.


## ② function — what the RUNTIME runs   →   native BEAM on server, wasm on client

The `def` below is real, runnable compute. The `server` in front is its placement —
where it runs (native Elixir on the BEAM) — and it's Elixir, so it's never mistaken
for the prose around it:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees
end


## ③ build — what the COMPILER builds   →   plain elixir

The placement above already builds — it compiles the unit to wasm; you never write
an explicit step. A `test` joins it, proving the unit at the weave gate (a red test
ships no bundle):

test :score do
  assert score(%{revenue: 50_000, employees: 20}) == 70
end


## ④ data — what the SYSTEM queries   →   declarative elixir

Types and tasks are declarations the system reads and validates — not code it
runs. They have fields, not a body:

@type status :: :todo | :doing | :done

task "tune the scorer", status: :todo, owner: :ada, ref: :score


## the discriminator

Four lanes, one file. Ask only "who reads this line?" — a human, the runtime, the
compiler, or the system — and the lane follows. Never confuse function with literacy.
