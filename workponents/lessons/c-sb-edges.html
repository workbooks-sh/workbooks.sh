# Cross-sandbox edges

Units in the same sandbox call each other directly. Units in *different* sandboxes
can still work together — they just do it across a boundary the host brokers, and
that boundary is exactly the point.

Say one sandbox owns a shared capability — live exchange rates — that many others
need:

sandbox :rates, grant: [:net] do
  server :fx do … end            # fetches and caches rates; only this box has :net
end

A unit in another sandbox reaches it by name, the same way a flow references a step:

server :score, uses: :fx do … end   # subscribes to :fx across the boundary

`:score` never gets `net` of its own — it borrows `:fx`'s result through a
host-brokered call. The two sandboxes stay separate instances; what crosses between
them is a single, typed edge, not shared memory. Capabilities **flow by grant, not
by inheritance**: `:score` may call `:fx`, but it doesn't inherit `:fx`'s `net`.

This is the same shape the whole system uses — a flat forest of isolated boxes with
the host wiring the edges between them, never one box nested inside another's memory.
It's also why these edges show up in [[The graph]]: a cross-sandbox call is a typed
link, so "who can reach the network" is a question you read straight off the picture.
