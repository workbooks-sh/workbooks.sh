# Enrich

A pure compute unit — the smallest shape there is. It bumps each lead's revenue by
the enrichment rate. **Prose and code are siblings**: the prose is markdown, the
code is a `sandbox` block, and they sit in the same file.

The unit's only *capability request* is a `grant` — it reaches the CRM over the
network, nothing else:

grant net "api.crm.com"

One named `sandbox` block is the code. The header (`rust :enrich`) names the lane
and the unit; the body is just a function:

server rust :enrich do
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
end

And a `test :unit` block proves it at the weave gate — every unit can carry its own
proof:

test :enrich do
  assert enrich(1000) == 1100
end

A unit is just a *name* — writing it inline or in its own file is purely an
authoring choice (see [[The contract]] for what that name compiles to).
