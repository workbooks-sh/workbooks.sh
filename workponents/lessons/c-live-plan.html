<script type="text/plain" id="c-live-plan">
# plan.work

This is `plan.work` — **one file** holding the plan, the live board, and the audit
log at once. Agents and tasks live together; the runtime reads it and dispatches. The
agents come first, declared right alongside the work:

agent :ada, model: :mimo, tools: [:crm]
agent :rex, model: :mimo, tools: [:charts]

Then the tasks. Each carries an `owner` (which agent), `paths` (what it may touch), a
`ref` (the code it tracks), and `after` (ordering) — and a task with no owner is an
**open slot** the coordinator can fill:

task "enrich the leads",  status: :doing, owner: :ada, ref: :enrich, paths: ["enrich.work"]
task "score + rank",      status: :todo,  owner: :rex, ref: :score,  paths: ["score.work"]
task "ship the page",     status: :todo,  owner: :ada, after: :score
task "email the analyst", status: :todo                  # unassigned — an open slot

Every field is **typed and validated** at the weave gate. The board view, the agent
assignments, the audit trail — all of them are *queries* over these declarations
(it's all [[Live state]]), not separate systems. Assign each task to an agent and the
runtime takes it from there.
