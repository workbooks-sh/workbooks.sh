# Compute

Compute is just code that runs. You write plain Elixir inside a placed block, and
the engine takes care of *how* — you never think about it:

server :score do
  def score(%Lead{} = lead) do
    revenue_points = lead.revenue / 1_000
    size_points    = lead.employees * 0.5
    round(revenue_points + size_points)
  end
end

The *how* is a footnote you never author. On the `server` your Elixir runs
**natively on the BEAM** — real OTP. Move it to `client :score` and the very same
`def` runs in the **browser** instead, on an Elixir-in-wasm runtime (so it works
there at all). Either way real Elixir semantics hold — you don't map types or memory
by hand — and nothing about how you wrote it changes (see [[Placement — where code
runs]]). Foreign languages compile to wasm in both places.
</script>
