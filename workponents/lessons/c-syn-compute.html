<script type="text/plain" id="c-syn-compute">
# Compute

Compute is just code that runs. You write plain Elixir inside a placed block, and
it runs as wasm — you never think about *how*:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees
end

The *how* is a footnote you never author. On the `server` your Elixir runs
**natively on the BEAM** — real OTP. Move it to `client :score` and the very same
`def` runs in the **browser** instead, on an Elixir-in-wasm runtime (so it works
there at all). Either way real Elixir semantics hold — you don't map types or memory
by hand — and nothing about how you wrote it changes (see [[Placement — where code
runs]]). Foreign languages compile to wasm in both places. #compute
</script>

  <h3>Just Elixir</h3>
  <p>The <code>def …</code> is the compute — ordinary Elixir, no dialect to learn. On the <code>server</code> it's <b>native BEAM Elixir</b>; on the <code>client</code> it runs on an <b>Elixir-in-wasm runtime</b> (Popcorn/AtomVM) so it works in the browser. Real Elixir semantics either way — you don't map types or memory by hand.</p>
  <h3>Placement is the only choice</h3>
  <p>The same <code>def</code> runs on the <code>client</code> or the <code>server</code> — the placement word changes <i>where</i> it runs (and so which engine), never <i>what you write</i> (see [[Placement — where code runs]]). How tightly it's boxed is a separate question, answered by its [[What a sandbox is]].</p>
  <div class="note"><b>Orb</b> — Elixir that authors low-level wasm directly — isn't how you write compute; it's a rare escape hatch (hot paths, extending the system), compiled like any other source language.</div>
