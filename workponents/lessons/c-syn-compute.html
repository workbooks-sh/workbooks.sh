<script type="text/plain" id="c-syn-compute">
# Compute

Compute is just code that runs. You write plain Elixir inside a placed block, and
it runs as wasm — you never think about *how*:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees
end

The *how* is a footnote you never author. Your Elixir runs on an Elixir-in-wasm
runtime, compiled in at build, so real Elixir semantics carry over — you don't map
types or memory by hand. Foreign languages compile straight to wasm the same way.

The placement word in front is the only thing that decides *where* this runs. Move
it to `client :score` and the very same `def` runs in the browser instead; nothing
about how you wrote it changes (see [[Placement — where code runs]]). #compute
</script>
