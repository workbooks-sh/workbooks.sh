<script type="text/plain" id="c-syn-tasks">
# Tasks

Don't ask "markdown or Elixir." Ask **does anything query it?** A casual note a human
just reads is rich text — a plain markdown checklist:

- [ ] remember to email the analyst        # just for a human to read

A **tracked task** — one the app renders and the agent acts on — is *data*: a typed
`task` declaration.

task "tune the scorer", status: :todo, owner: :analyst, ref: :scorer
task "wire the crm",    status: :done
task "ship v1",         status: :todo,  owner: :shane

`task` is the **primitive** — there's no "board" container to run; the unit *is* the
task. It's typed: `status` is an enum, `owner` references a `user` defined in a shared
file, and `ref:` cross-links to code so tasks, workflow, and defs become one graph
(see [[Types]]). The casual list above is prose; these tasks are queryable, typed
data. #tasks
</script>
