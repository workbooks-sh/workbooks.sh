<script type="text/plain" id="c-dock-seam">
# The one seam

The UI talks to **one** capability surface — the **Dock**. It never calls a server
or an OS API directly. Every capability (fetch, store, compute) is a *request* to
that single membrane:

fetch_leads()            # a capability request
  -> Dock                # the membrane decides who fulfills it
       -> local          # browser / OS via Tauri
       -> runtime        # the nexus, over RCP

The author writes the **request**; the Dock routes it to a *provider* — `local` (the
browser, or the OS via Tauri) or `runtime` (the nexus over RCP, see
[[What it backs]]). A target — desktop / web / mobile — is therefore just a
**routing config**, not a code fork. One frontend, many targets, behind a single
seam (see [[Providers]] for how the same request resolves two ways).
</script>
