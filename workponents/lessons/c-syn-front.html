# The header

A file opens with its **header** — Elixir declarations, *not* YAML frontmatter. It's
the same data lane as `task` and `user` (see [[Tasks]]); markdown is left purely for
the prose below.

route "/dashboard"                      # this page's URL (a leaf page)
lang  :svelte                           # the front-end lane for this file's islands
use   [:crm, :charts]                   # toolkits — helpers (fns / types) this page draws on
grant net "api.crm.com"                # capability requests, scoped to this file
deps  [hex: "decimal@2", npm: "d3@7"]   # unit-level deps (app-level → the index)

The header carries `route`, `lang`, caps, and this file's `deps` — all **declarations
the system reads**, so they're Elixir like every other declaration. No YAML, no second
mini-language: **markdown narrates, Elixir declares**. Then comes the literate body:
prose, and target blocks (`client`/`sandbox`/`server`, see [[Targets]]). The header is
declared, never run — the file's data-lane twin of the index, owning the file the way
the index owns the app. #header
