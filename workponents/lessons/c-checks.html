# Checks & queries

An agent reads the code **through the graph** — not by grepping. The `work` CLI
exposes it as verbs that return *typed, located* results:

work check :enrich            # type-check + lint along the edges
  => ok    exports enrich/1 · imports net
  ⚠ unused grant net          # an import with no use — a graph lint

work why :score               # who depends on :score (rdeps)
  => pipeline (step) · ranked (dataflow)

work near :score              # the context subgraph — structural + semantic
  => Lead (type) · enrich (sibling) · "scoring the leads" (prose, by meaning)

At runtime the *same* graph is live: OpenTelemetry spans map onto nodes, so
"which unit is slow" is a node, not a log line. Structure (WIT) and behaviour
(OTel) on one surface — the feedback loop an agent actually acts on.
