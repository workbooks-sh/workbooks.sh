# The primitive map

Every primitive, and the lane it lives in. If a line isn't on this map, it's
**prose** — or a composition of these. The discriminator never changes: *who
reads it?* (see [[The four lanes]]). #primitive

**Rich text** — markdown, a *human* reads it:

  prose · headings · lists · links · tables · quotes · `code`
  ![caption](src)        inline image — a lone one renders as a figure
  - [ ] casual todo      a checklist for a human (not tracked data)

**Function** — code that *runs*; the first word is the **placement** — where it
runs (`client` = wasm in the browser, `server` = native Elixir on the BEAM):

  client :x  do … end       # in the browser (any lang; default :elixir)
  server :x  do … end       # on the backend — the trusted tier
  sandbox :x do … end       # a named isolation unit — groups the units inside it
  flow do … step … end      # workflows (step, parallel)
  agent "…" do … end        # a brain (model, system, tools)

**Build** — the *compiler*, mostly implicit in the target (no explicit build step
to write):

  test :unit do          # verification (fails the build when red)
  package hex/npm/cargo  # deps in the index manifest

**Data** — declarative Elixir, the *system* queries it:

  task · user · type     # typed records + enums
  data :x, from: …       # a named source; query() over it
  grant · posture        # caps + publish posture
  route · lang · use     # the file's Elixir header (no YAML)

Everything runnable or declared is **Elixir**. Markdown *only* narrates — the
rich text and the context around the code, never the code itself.
