# Extractors

The graph is fed by **three extractors**, and they all write into the *one* graph —
nothing language-specific leaks out:

- **literate** — the markdown itself: headings, `[[backlinks]]`, `#tags`, and the
  prose, which we embed for semantic search.
- **AST** — every language's structure. `tree-sitter` parses them all uniformly;
  our own compilers (clang, mrustc, zig) and `mix xref` add the deep, typed view.
- **WIT** — `wasm-tools` reads each compiled component's imports and exports. This
  is the language-agnostic join: rust, Elixir, and js all merge at the typed edge.

Because every unit compiles through the same in-sandbox lanes, **any source enters
the graph** — inline in a work file, or a bare standalone file you reference:

use "enrich.rs"               # a plain rust file, referenced — not literate
  → tree-sitter / clang AST   # its symbols
  → a WIT component           # its typed boundary
  → nodes + edges in the graph

Our compilers double as extractors — we point each language at its WebAssembly
lane, and the pass that builds it also graphs it. There is **no Bazel**: the
in-sandbox lanes *are* the build graph — hermetic by construction (wasm, zero
native exec), content-addressed, incremental — so we never bolt on a build system.
</script>
