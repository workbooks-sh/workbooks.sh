# Placement — where code runs

Every runnable unit names *where* it runs, and there are only two places. You say
which one with the very first word of the block:

client :spinner do … end        # in the BROWSER — the UI a person touches
server :sync    do … end         # on your BACKEND — secrets, the database, the network

The grammar is the same for both: `<place> [language] :name do … end`. The
language is optional and **defaults to Elixir**, so the everyday case reads as
ordinary Elixir with a placement word in front of it:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees
end

The two places don't run the same way underneath. `client` is **wasm** in the
browser — there's no other option there, so Elixir runs on a wasm runtime and other
languages compile to wasm too. `server` is **native Elixir on the BEAM** — real
OTP, not wasm — with foreign languages placed there running as sandboxed wasm units
beside it. What's identical is the *authoring*: a placement word in front, the same
grammar either way.

**Any language runs in either place.** Reach for Rust, Zig, or C wherever it earns
its keep, and write the body raw inside `do…end`:

server rust :enrich do
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
end

`server` is the **trusted** tier. Its Elixir runs natively on the BEAM and can be
granted secrets, the database, and the network — and it only ever runs on a nexus
you own. Keeping tenants apart and enforcing each unit's capabilities there is the
**nexus's** job, not a wasm box. `client` ships to anyone who opens the page, so it's
wasm-sandboxed and starts with none of that. Either way a unit gets only the
capabilities it's granted (see [[Caps & limits]]). Want to name and group those
boundaries yourself? That's the sandbox's own chapter (see [[What a sandbox is]]).

A unit with **no placement** is a *static definition* — it has no `do…end` body to
run, so it's simply compiled wherever something references it. #placement
