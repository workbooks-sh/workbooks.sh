# Placement — where code runs

Every runnable unit names *where* it runs, and there are only two places. You say
which one with the very first word of the block:

client :spinner do … end        # in the BROWSER — the UI a person touches
server :sync    do … end         # on your BACKEND — secrets, the database, the network

The grammar is the same for both: `<place> [language] :name do … end`. The
language is optional and **defaults to Elixir**, so the everyday case reads as
ordinary Elixir with a placement word in front of it:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees
end

Under the hood, **every unit runs as isolated wasm** — `client` and `server` say
*where* the code runs, not *how* tightly it's boxed. That isolation is a separate
idea with its own chapter (see [[What a sandbox is]]): by default a unit runs in the
ambient sandbox for its placement, and you only name a sandbox when you want to
group units together or hold them apart yourself.

Because it all compiles to wasm, **any language runs in either place**. Reach for
Rust, Zig, or C wherever it earns its keep, and write the body raw inside `do…end`:

server rust :enrich do
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
end

`server` is the **trusted** tier. A unit placed there can be granted secrets, the
database, and the network, and it only ever runs on a nexus you own. `client`
ships to anyone who opens the page, so it starts with none of that. It's still
isolated either way — "trusted" means a unit is *allowed* those capabilities, not
that it escapes the sandbox (see [[Caps & limits]]).

A unit with **no placement** is a *static definition* — it has no `do…end` body to
run, so it's simply compiled wherever something references it. #placement

  <h3>Two things placement is <i>not</i></h3>
  <p><b>Not isolation.</b> Every unit is wasm-isolated regardless of where it runs; how tightly is the sandbox's job, not placement's (see [[What a sandbox is]]). <b>Not a body.</b> A unit with no placement is just a <i>static definition</i> — compiled wherever it's referenced, with nothing to run on its own.</p>
