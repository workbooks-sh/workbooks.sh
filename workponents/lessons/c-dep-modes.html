<script type="text/plain" id="c-dep-modes">
# Delivery modes

You author a workbook **once**. How it reaches a reader is a *deploy* choice, not a
rewrite — and the choice is decided for you by one thing you already wrote: whether
each unit is `client` or `server` (see [[Placement — where code runs]]). The same tree
ships three ways, a ladder you climb as you gain infrastructure:

  static bundle    one self-contained .html — the browser does everything
  nexus SSR        server regions render on the BEAM; client units are islands
  live SSR         a stateful server render that streams diffs over a socket

**Static bundle** is the floor. `work bundle` weaves the tree into one gzipped
`dist/index.html` and the browser hydrates it (see [[The weave]] and
[[dist/index.html]]). No server, infinitely cacheable, hostable on any edge — the right
answer when there's nothing behind the page.

**Nexus SSR** is what you get the moment an app declares a `nexus` (see
[[What it backs]]). Now the placement bit pays off: every `server` unit renders on the
trusted BEAM tier and arrives as ready HTML, and every `client` unit ships as an
*island* — a small interactive patch hydrated on top of that HTML. This is islands
architecture, and it falls straight out of placement: `server` says "render this on the
backend," `client` says "wake this in the browser." Nothing else changed in your source.

server :greeting do
  def render(user), do: "<h1>Welcome back, #{user.name}</h1>"   # rendered on the BEAM
end

client :counter do                                              # an island, hydrated
  # ...interactive UI, woken in the browser on top of the SSR'd HTML...
end

**Live SSR** is the interactive ceiling. When a `server` region is *stateful* — it holds
a view and changes over time — the nexus keeps that render alive per connection and
pushes **diffs** (just what changed) over our own socket as state moves. It's the shape
people reach LiveView for, except it rides the **same RCP WebSocket** the runtime already
speaks, not a second framework you have to manage. The nexus is BEAM, so a live render
loop is native ground.

The point is **not** that SSR beats the static bundle — it's that the *same workbook*
ships every way with no rewrite. Static when there's no server. Server-rendered when
there is. Live when it's interactive. You declared `client`/`server` once; delivery just
reads that bit (see [[Two targets]] for where each mode runs). #delivery #placement
</script>
