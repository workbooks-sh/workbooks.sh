# Extrapolate

A `server` lane **extrapolates**: the same code, two homes. The target lives on the
unit itself — `server` is a *unit prefix*, marking where that unit's work runs:

server :enrich do
  # ... heavy / trusted work ...
end

That single marker is the only thing that **moves the work**, and the Dock picks
*where*. As a **static build** the `server` unit runs at the weave and its result
bakes into the file. **Docked** to a nexus (see [[What it backs]]) the same unit
runs on the nexus *per request* — and the data never leaves the server. That's
**unbundling**: one file scales from a static document to a live, data-private app
with no code change — the `#extrapolate` property as syntax (see [[Providers]]).
</script>
