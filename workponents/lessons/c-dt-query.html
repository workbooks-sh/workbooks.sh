<script type="text/plain" id="c-dt-query">
# a query is a SELECTOR over a source's WIT values — returns WIT values too:

data :ranked, from: select(:leads, fields: [:name, :score], sort: {:score, :desc})

# SHOWING it needs no widget — typed data renders by DEFAULT (the type tells the
# renderer: record → card, list of records → table, scalar → text). reference it:

Top lead: {{ ranked.first.name }} at {{ ranked.first.score }}.   # inline · live (signals)

# want a specific look? a CLIENT unit reads the source and renders it your way:
client :ranked_table, reads: :ranked do ... end

# telemetry and a unit's output are just data sources — shown the SAME way:
data :health, from: telemetry(:enrich)     # live metrics
data :result, from: enrich(1000)           # a call's result
</script>
<template id="e-dt-query">
  <div class="kick">data · query</div>
  <h2>Query <span class="lane l-data">data</span> <span class="lane l-text">rich text</span></h2>
  <p class="tagline">Select over a source's WIT values; show them with zero ceremony — typed data renders itself.</p>
  <h3>Select, then show</h3>
  <p><code>select(...)</code> filters / sorts / picks over a source's values (drop to a <b>unit</b> for more; real SQL only when the source is a db). <b>Showing needs no widget</b>: because data is WIT-typed, the renderer knows its shape — a record becomes a card, a list of records a table, a scalar text. Reference it inline and it renders, re-rendering on change (<b>signals</b>). Want a specific look? a <b>client unit</b> <code>reads:</code> the source and renders it.</p>
  <h3>Telemetry, results — all just data</h3>
  <p>There's no separate "live readout" primitive: <b>telemetry</b> (<code>telemetry(:x)</code>) and a <b>unit's output</b> (<code>enrich(1000)</code>) are data sources, shown exactly like inline values.</p>
  <div class="note">This is why there's no "probe" — typed data + default rendering + a client unit for custom covers every live-readout case, and the markdown fence stays plainly display-only.</div>
</template>
