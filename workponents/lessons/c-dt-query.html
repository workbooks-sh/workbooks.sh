<script type="text/plain" id="c-dt-query">
# Query

A query is a **selector** over a source's WIT values — and it returns WIT values
too (see [[Data sources]]). You `select` to filter, sort, and pick fields:

data :ranked, from: select(:leads, fields: [:name, :score], sort: {:score, :desc})

**Showing it needs no widget.** Because data is `#data`-typed, the renderer already
knows its shape: a record → a card, a list of records → a table, a scalar → text. So
you just *reference* it inline, and it renders — re-rendering on change, via
**signals**:

> Top lead: `{{ ranked.first.name }}` at `{{ ranked.first.score }}`.

Want a specific look? A **client unit** `reads:` the source and renders it your way:

client :ranked_table, reads: :ranked do ... end

And there's no separate "live readout" primitive — **telemetry** and a **unit's
output** are *just data sources*, shown exactly the same way:

data :health, from: telemetry(:enrich)     # live metrics
data :result, from: enrich(1000)           # a call's result
</script>
