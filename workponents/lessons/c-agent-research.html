<script type="text/plain" id="c-agent-research">
# researcher.work — an autonomous research agent (the auto-researcher shape).

type Finding = record(claim: string, source: string, confidence: f32)
type Report  = record(question: string, findings: list(Finding), summary: string)

agent :researcher do
  model  :mimo
  system "Research the question. Search broadly, verify each claim, then synthesize."
  memory Report
  tools  [:web_search, :fetch]
  grant  net "*"                          # read-only web, capability-gated
end

# the loop is a FLOW — fan out searches, verify, synthesize, critique, repeat:
flow :research do
  step     :plan                          # break the question into sub-queries
  parallel :search                        # fan out — one search per sub-query
  step     :verify                        # adversarially check each finding
  step     :synthesize
  step     :critique                      # "what's missing?" → loop if gaps remain
end

# each step is server Elixir; the agent decides, tools fetch through the Dock:
server :verify do
  def verify(findings), do: Enum.filter(findings, & &1.confidence >= 0.7)
end
</script>
