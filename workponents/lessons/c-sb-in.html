# Co-location & in:

A unit joins a sandbox in one of two ways, and they mean the same thing — they just
read differently depending on where the code lives.

The first is **nesting**. Write the unit inside the sandbox's `do…end`, and it
belongs there implicitly. This is the natural choice when the units obviously go
together and sit in the same file:

sandbox :pricing do
  server :score do … end       # nested ⇒ in :pricing, no extra word
  server :tax   do … end
end

The second is **by name**. A unit defined somewhere else binds in with `in:`. This
is how a unit in another file — or one you'd rather keep next to its own prose —
still lands in the same box:

server :forecast, in: :pricing do … end   # defined here, runs inside :pricing

Same name, same container. `:forecast` now shares `:pricing`'s memory and caps with
`:score` and `:tax`, exactly as if it had been nested. A **different** name (or no
`in:` at all) puts a unit in its own box. That is the whole control surface — pick a
name to pull things together, pick another to keep them apart.

Where the membership is *declared* depends on scope: nest or `in:` within a file for
the local case, or compose units from across files in the index when a sandbox spans
the project (see [[index.work]]). #sandbox
