# The block — do…end

One delimiter does everything. `do…end` is *self-delimiting* Elixir, so it
separates from the prose around it with **no fence and no sigil**. The **kind
word** in front names the lane (see [[The four lanes]]):

sandbox :score do ... end      # function lane (code → wasm)
flow do ... end                # function lane (workflow)
figure "x.png" do ... end      # rich-text lane (presentation)

A `do…end` always wraps a **bodied unit** — a body of code, or of content. Flat
**data** is the exception: a `task`, a `user`, a `type` are *declarations*, not
blocks. They carry **fields, not a body**, so they need no delimiter at all:

task "...", status: :todo      # data lane (a typed declaration)
user :analyst, name: "Ada"     # data lane

Two shapes — bodied blocks and flat declarations — cover every lane. #primitive
</script>
