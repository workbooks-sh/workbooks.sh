# The block — do…end

One delimiter, one lane. `do…end` is *self-delimiting* Elixir, so it separates
from the prose around it with **no fence and no sigil**. It always wraps a
**function unit** — a body of code or a workflow — and the **kind word** in front
says which (see [[The four lanes]]):

server :score do ... end      # code → wasm
flow do ... end                # a workflow (step, parallel)
agent "..." do ... end         # a brain (model, system, tools)

Flat **data** is the other shape: a `task`, a `user`, a `type` are *declarations*,
not blocks. They carry **fields, not a body**, so they need no delimiter at all:

task "...", status: :todo      # data lane (a typed declaration)
user :analyst, name: "Ada"     # data lane

Two Elixir shapes — bodied blocks (function) and flat declarations (data) — and
markdown narrates the rest.
</script>
