<script type="text/plain" id="c-syn-head">
# Document title

A single `#` at line-start is an **H1** — the work file's title. Deeper levels
nest the outline:

## A section                # H2 — structure you READ

### A subsection            # H3

Headings form the **narrative outline** — the shape a human reads the document
in. Don't conflate them with the *other* two structures: they are **not** the
app's route/skeleton (that lives in the index, see [[The header]]) and **not** a
queryable tree (that would be data). Just rich-text structure.
