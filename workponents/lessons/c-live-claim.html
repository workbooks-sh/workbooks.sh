<script type="text/plain" id="c-live-claim">
# claiming a task is the COORDINATOR's job (on the nexus). it:
#   1. flips status :todo → :doing in plan.work      (the declarative claim)
#   2. opens a DRAFT for the agent                  (the LOCK — isolated, restorable)
#   3. SCOPES the draft to task.paths                (the FENCE — only its files)

# most tasks are flat. one that needs custom behavior carries a claim script:

task "enrich the leads", owner: :ada, paths: ["enrich.work"] do
  claim do
    draft "wb-#{id}"        # an isolated, restorable change = the lock
    scope paths             # narrow the draft to these paths
  end
end

# two agents, one tree, zero collision: each works its own DRAFT, SCOPED to its
# paths. agents never touch the substrate — the system versions it underneath.
</script>
