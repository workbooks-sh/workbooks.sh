# Claim, lock & fence

A task is a **flat declaration** — fields, no body. It just states who owns the work
and which files it may touch:

task "enrich the leads", owner: :ada, paths: ["enrich.work"]

Claiming it is the **coordinator's job**, on the nexus, and it happens *automatically*
— there's no script hanging off the task. When the coordinator picks the task up it
does three things in order. First it **flips** `status: :todo → :doing` in plan.work —
the declarative claim, recorded in the document itself (see [[Live state]]). Then it
**opens a draft** for the agent — an isolated, restorable change, which is the *lock*
(optimistic, no mutex). Finally it **scopes** that draft to the task's `paths` — a
narrowed view of the tree, the *fence*, so the agent only ever sees its own files.

You can read the whole sequence off the run:

run claim "enrich the leads"
  → status :todo → :doing          # 1. flip   — the declarative claim
  → draft "wb-7f3"                 # 2. lock   — isolated, restorable
  → scope ["enrich.work"]          # 3. fence  — only the task's paths

Two agents work the same tree with zero collision: each gets its own `draft`,
`scope`d to its paths. **Agents never touch the substrate** — the coordinator versions
it underneath. `draft` and `scope` are **our own capabilities** (the Drive-simple
workspace layer), surfaced through the Dock like any other; no external names to
learn.
</script>
