# Workflows

A workflow you're only *describing* can stay prose — an ordinary markdown list:

1. seed leads
2. enrich
3. score

But a workflow that actually **runs** — orchestrating real calls at weave or
runtime — is Elixir, a `flow do … end` block, so a function is never mistaken for
literacy:

flow do
  step :seed
  step :enrich
  parallel [:min, :max]
  step :score
end

The steps **reference defs by name** (`:seed`, `:enrich`, `:score`) — the workflow is
wired to the compute (see [[Compute]]) and validated at the gate. A pipeline of calls
is exactly what Elixir is good at, and keeping it in the function lane keeps
orchestration out of the prose lane.
