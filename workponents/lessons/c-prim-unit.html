<script type="text/plain" id="c-prim-unit">
# The unit

Everything addressable is a **named unit** — a function, a task, a workflow, a
data source. The name is the whole interface: it's how the flow, the board, and
the views reach what they need. #primitive

Here a `server` block declares one unit, `:score`, and a `flow` reaches it purely
by naming it:

server :score do
  def score(lead), do: lead.revenue / 1000 + lead.employees   # unit: :score
end

flow do
  step :score          # the flow references the unit purely by name
end

Whether a unit lives *inline* in a page or in *its own file* is only a question
of **where** it sits — references don't care, because a unit is just a name (see
[[References]]).
