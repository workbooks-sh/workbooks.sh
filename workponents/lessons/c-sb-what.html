# What a sandbox is

Every unit already runs inside an isolation boundary — a wasm sandbox for anything
in the browser or any foreign-language unit, and the nexus's tenant isolation for
native server Elixir. You get that for free. A **sandbox** is what you reach for when
you want to *name* that boundary and decide who shares it. Naming one is optional;
you do it to group units together, or to hold them apart.

You declare a sandbox the same way as any block — a name and a `do…end` body — and
the units you write inside it run **together, inside one boundary**:

sandbox :pricing do
  server :score do
    def score(lead), do: lead.revenue / 1000 + lead.employees
  end

  server :tax do
    def tax(amount), do: amount * 0.0825
  end
end

`:score` and `:tax` now live in the same box. They share its capabilities and
limits, and they can call each other directly without crossing a boundary. A unit
in a *different* sandbox — or in the default, unnamed one — is genuinely separate:
its own boundary, its own limits.

The line down the left of the block is that boundary made visible: everything from
the `sandbox` keyword to its `end` is contained. That containment is the whole idea
— a sandbox is a *place you put units so they run as one*. The next lessons cover
how units join a sandbox ([[Co-location & in:]]), what you can grant it
([[Caps & limits]]), and how separate sandboxes still talk ([[Cross-sandbox edges]]).
