# The contract

A unit's contract is just its **Elixir module**. Its **exports** are the public
functions it defines; its **imports** are the dependencies and `grant`s it asks for;
its **types** are the structs, atoms, and tuples it passes around. That is the whole
interface — and every part of it is Elixir you already know. You describe it once,
in one language.

server :enrich do
  def enrich(lead), do: %{lead | score: lead.score * 11}   # a public fn → an export
end
grant net "api.crm.com"                                      # a grant → an import

When two units need to **share** a contract — a kit and the units that use it — that
shared interface is an Elixir **behaviour** (`@callback`), implemented like any other.
Elixir's module system *is* the interface system; there's nothing new to learn.

Underneath, each unit compiles to a **standard wasm component** — the same contract a
Rust or JS unit produces — which is *why* units in different languages interoperate
cleanly, meeting at a typed boundary instead of raw memory. That generated artifact is
the wasm-native form of your Elixir, and **you never write or read it:**

  # ↓ generated — you never touch this
  world enrich {
    export enrich: func(lead) -> lead
    import net: func(url: string) -> string
  }

So the rule is simply: **learn Elixir, not WIT.** Your modules are the interfaces,
your structs and atoms are the types, your `grant`s are the imports — and all the
WebAssembly falls out.
