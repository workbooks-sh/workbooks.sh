<script type="text/plain" id="c-plan-harness">
# plan.work — a full agentic harness in ONE file: a brain, the flow it runs,
# the tasks it works, and the validations that gate them. one agent here; the
# same shape scales to many.

# ── the agent (the brain) ───────────────────────────────────────────
agent :ada, model: :mimo, tools: [:crm, :charts] do
  system "Enrich, score, and rank leads. File an issue for what you can't resolve."
end

# ── the work it runs (a flow — the runnable DAG) ────────────────────
flow :pipeline do
  step :enrich
  step :score
  parallel [:rank, :chart]
end

# ── a unit the flow calls, with a validation that gates the plan ────
sandbox rust :enrich do
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
end

test :enrich do
  assert enrich(1000) == 1100        # red validation → the whole plan stalls
end

# ── the tasks ada works: ordered by after:, gated by needs: ─────────
type Status = enum(:todo, :doing, :done)

task "run the pipeline",   status: :doing, owner: :ada, ref: :pipeline, paths: ["leads/"]
task "review the ranking", status: :todo,  owner: :ada, after: :pipeline, needs: :enrich
task "publish the page",   status: :todo,  owner: :ada, after: "review the ranking"

# ada claims a task → draft + scope → runs :pipeline → tests gate it → :done.
# one file: the brain, the work, the proof, and the live board — same primitives.
</script>
