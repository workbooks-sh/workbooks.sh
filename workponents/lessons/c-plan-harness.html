<script type="text/plain" id="c-plan-harness">
# A full harness

This is `plan.work` as a **full agentic harness in one file**: a brain, the flow it
runs, the tasks it works, and the validations that gate them. One agent here, but the
same shape scales to many.

It opens with the **agent** — the brain (model, system, tools):

agent :ada, model: :mimo, tools: [:crm, :charts] do
  system "Enrich, score, and rank leads. File an issue for what you can't resolve."
end

Next the **work it runs** — a flow, the runnable DAG, with steps in order and a
parallel fan-out at the end:

flow :pipeline do
  step :enrich
  step :score
  parallel [:rank, :chart]
end

The flow calls **units**, and each unit can carry a `test` that **gates the whole
plan** — a red validation stalls everything downstream:

server rust :enrich do
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
end

test :enrich do
  assert enrich(1000) == 1100        # red validation → the whole plan stalls
end

Finally the **tasks** ada works — ordered by `after:`, gated by `needs:` a passing
unit (it's all [[Live state]]):

@type status :: :todo | :doing | :done

task "run the pipeline",   status: :doing, owner: :ada, ref: :pipeline, paths: ["leads/"]
task "review the ranking", status: :todo,  owner: :ada, after: :pipeline, needs: :enrich
task "publish the page",   status: :todo,  owner: :ada, after: "review the ranking"

Put together, the loop reads end to end: ada claims a task → `draft` + `scope` (see
[[Claim, lock & fence]]) → runs `:pipeline` → the tests gate it → status flips to
`:done`. **The brain, the work, the proof, and the live board** — all composed from
the same primitives, no separate harness to learn.
</script>
