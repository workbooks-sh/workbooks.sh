<script type="text/plain" id="c-agent-coder">
# coder.work

A coding agent — the whole framework in one file (the Claude-Code shape).

**Memory is WIT-typed data** — the agent's state is just records & lists:

@type msg :: %{role: String.t(), content: String.t()}
@type mem :: %{history: [msg], files: [String.t()], cwd: String.t()}

The **brain** declares the model, prompt, tools, and the caps those tools need:

agent :coder do
  model  :mimo
  system """
  You are a coding agent. Read, edit, and run code to satisfy the task.
  Work in small steps; run the tests before you finish.
  """
  memory Mem
  tools  [:bash, :edit, :read, :search]   # toolkits — helpers on PATH
  grant  exec "bash", fs "./project"      # the sandbox it acts in
end

The **loop is `server` Elixir** (full OTP) — real ReAct, written in Elixir:

server :coder_loop do
  def run(task, mem \\ %Mem{}) do
    case think(:coder, mem, task) do        # LLM call → next action
      {:tool, name, args} ->
        obs = call_tool(name, args)         # the tool runs in the SANDBOX
        run(task, remember(mem, name, obs)) # observe → loop
      {:done, answer} -> answer
    end
  end
end

`bash "mix test"` is a sandboxed command, fs-scoped to `./project` — never host exec.
</script>
