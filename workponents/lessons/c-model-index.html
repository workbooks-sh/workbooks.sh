<script type="text/plain" id="c-model-index">
# index.work

The app **manifest** — literate, like every other work file. It declares what the
app is *made of*: the pages it weaves, its deps and toolkits, the nexus it docks to,
the capabilities it requests, and the checks the gate enforces.

First it **composes** — `use` pulls in the pages and units the app weaves:

use "dashboard.work"                 # pages & units the app weaves in
use "enrich.work"
use "team.work"                      # shared types

Then it names its dependencies. **Toolkits** are `#crm`-style packages of helpers
(see [[Packages]]); language deps come from hex, npm, or cargo:

import :crm,    from: "crm@2"        # toolkits — packages of helpers
import :charts, from: "charts@1"

package npm: "d3@7"                  # language deps
package cargo: "regex@1.10"

Finally it wires the **server tier and capabilities** — the nexus it docks to (see
[[What it backs]]), the network grants it needs, the secrets the host binds, and
the strictness the weave gate runs at:

nexus  "wss://acme.nexus.work.dev"   # the server tier
grant  net "api.crm.com"             # app-wide capability requests
secret "CRM_API_KEY"                 # declared; the host binds the value
check  types: :strict, caps: :declared_only

Routes and nav live in the *pages* (each page's frontmatter `route`), **not here**.
The index only declares structure — deps, toolkits, nexus, caps, checks. It's just
another `.work` file: no HTML, no custom elements.
</script>
