<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock"><meta name="color-scheme" content="light dark">
<title>The work format — a lesson plan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="work-format.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <section class="code">
      <div class="bar"><span class="dot"></span><span class="fn" id="fn"></span><button class="run" id="runbtn">▶ Run</button><span class="lg" id="lg"></span></div>
      <textarea id="ed"></textarea>
      <div class="term" id="term"></div>
      <div class="graphpane" id="graphpane"></div>
      <div class="drawer" id="drawer">
        <div class="dhead"><span id="dtitle">run</span><span class="x" id="dclose">✕</span></div>
        <div class="dterm" id="dterm"></div>
      </div>
    </section>
    <div class="drag" id="drag"></div>
    <section class="exp" id="exp"></section>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="work-format.js"></script>
<script>
  // Bootstrap: the engine (above) loaded synchronously — it defines LESSONS, the
  // render fns, and cm. Derive the per-lesson file ids from LESSONS, fetch
  // lessons/<id>.html in parallel, inject them into a hidden div (the c-*/e-*
  // nodes enter the DOM — inert when injected via innerHTML, but getElementById +
  // .textContent still work), then renderNav()+loadLesson(0).
  (async () => {
    const ids = [...new Set(LESSONS.map(l => l.code || l.exp))];
    const parts = await Promise.all(
      ids.map(id => fetch("lessons/" + id + ".html").then(r => r.text()))
    );
    const holder = document.createElement("div");
    holder.style.display = "none";
    holder.innerHTML = parts.join("\n");
    document.body.appendChild(holder);

    renderNav();
    loadLesson(0);
  })();
</script>
</body>
</html>
