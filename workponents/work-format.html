<!-- ══════════════════ SYNTAX exploration ══════════════════ -->
<script type="text/plain" id="c-syn-prose">
# Sales

Plain prose is **markdown** — *italics*, **bold**, lists, links, quotes.
This lane is for **rich text only**. It is never a function, never logic.

> A blockquote is rich text.

- a bullet
- another one

A [link](https://workbooks.sh) and `inline code` (display only — not evaluated,
because this lane never runs anything).
</script>

<script type="text/plain" id="c-syn-head">
# Document title            (H1 — the work file's title)

## A section                (H2 — structure you READ)

### A subsection            (H3)

Headings form the narrative outline — the shape a human reads the document in.

They are NOT the app's route/skeleton (that lives in the index) and NOT a
queryable tree (that would be data). Just rich-text structure.
</script>

<script type="text/plain" id="c-syn-fig">
## The numbers

A markdown image works inline:

![Revenue chart](revenue.png)

For a captioned figure — richer than markdown — a presentational block. Same
do…end grammar as code, but it RENDERS, it doesn't run:

figure "revenue.png" do
  Revenue by quarter, FY24. **The caption is markdown.**
end

And when markdown can't say it, drop to a component (the output is HTML anyway):

<work-chart from="ranked" x="name" y="score"></work-chart>
</script>

<script type="text/plain" id="c-syn-tasks">
## A casual note — rich text (markdown)

- [ ] remember to email the analyst        # just for a human to read

## Tracked tasks — DATA (declarative Elixir, typed)

task "tune the scorer", status: :todo, owner: :analyst, ref: :scorer
task "wire the crm",    status: :done
task "ship v1",         status: :todo,  owner: :shane

# `task` is the PRIMITIVE — no "board" container to run. status is a typed enum,
# owner references a user defined in a shared file (see Primitives → Types).
# The casual list above is prose; these tasks are queryable, typed data.
</script>

<script type="text/plain" id="c-syn-flow">
## Describing the steps — prose (markdown)

1. seed leads   2. enrich   3. score

## Running them — a FUNCTION (Elixir), never confused with prose

flow do
  step :seed
  step :enrich
  parallel [:min, :max]
  step :score
end

# Any workflow that actually RUNS is Elixir, so a function is never mistaken
# for literacy. The steps reference defs by name (:seed, :enrich, :score).
</script>

<script type="text/plain" id="c-syn-compute">
## Scoring

Compute is plain Elixir, wrapped in a tangle block so it compiles to wasm for
the container. Orb is the compiler underneath — but you just write Elixir:

tangle "score.wasm" do
  defmodule Scoring do
    def score(lead), do: lead.revenue / 1000 + lead.employees
  end
end

# You only reach for orb-specific syntax (I32.global, defw, memory) when a case
# genuinely needs low-level wasm types — e.g. a byte-level state machine.
# Everything else is just clean Elixir.
</script>

<!-- ══════════════════ PRIMITIVES exploration ══════════════════ -->
<script type="text/plain" id="c-prim-unit">
# The unit

Everything addressable is a NAMED UNIT — a def, a board entry, a figure, a data
source. The name is how the flow / board / views reach it.

tangle "score.wasm" do
  defmodule Scoring do
    def score(lead), do: lead.revenue / 1000 + lead.employees   # unit: Scoring.score
  end
end

flow do
  step :score          # the flow references the unit purely by name
end

# Inline vs its-own-file is just WHERE a unit lives. References don't care —
# a unit is just a name.
</script>

<script type="text/plain" id="c-prim-block">
# The block — do…end

One delimiter does everything. do…end is self-delimiting Elixir, so it
separates from prose with no fence and no sigil:

tangle "x.wasm" do ... end     # build lane
flow do ... end                # function lane
figure "x.png" do ... end      # rich-text lane (presentation)

# do…end wraps BODIED units — a body of code or content. The KIND word in
# front (tangle / flow / figure) names the lane.

# Flat DATA is the exception: tasks, users, and types are DECLARATIONS,
# not blocks — they have fields, not a body:
task "...", status: :todo      # data lane (a typed declaration)
user :analyst, name: "Ada"     # data lane
</script>

<script type="text/plain" id="c-prim-lanes">
# The four lanes

Every line in a work file sits in exactly ONE lane, decided by who reads it:

  rich text   prose, figures        a HUMAN reads        ->  markdown
  function    compute, workflows    the RUNTIME runs     ->  elixir / orb -> wasm
  build       tangle, untangle      the COMPILER builds  ->  plain elixir
  data        tasks, types, config  the SYSTEM queries   ->  declarative elixir

# markdown is rich text, full stop. Anything with behavior or fields is Elixir.
</script>

<script type="text/plain" id="c-prim-types">
# Types & definitions

Shared types live in their OWN file — imported where used, never in the index
(the index is the build skeleton, not a data dictionary).

# team.work — a shared definitions file

type Status = :todo | :doing | :done          # an enum

user :analyst, name: "Ada Lovelace", email: "ada@acme.co"
user :shane,   name: "Shane",        email: "shane@acme.co"

# Anything in the workbook then references those by NAME, and the weave gate
# checks the reference resolves + the value fits the type:

task "tune the scorer", status: :todo, owner: :analyst, ref: :scorer
#                       ^ must be a Status     ^ must be a defined user

# Two defined the same way? Just two declarations — each a named unit sharing
# the same shape. user :analyst and user :shane both fit User; refs pick by name.
# Add a field to the type, or a new user — one place, everywhere stays in sync.
</script>

<script type="text/plain" id="c-prim-refs">
# References

Units cross-link by NAME — no import ceremony inside the document:

  a workflow step refers to a def      ->  step :score
  a task refers to the code it tracks  ->  todo "tune", ref: :scorer
  a view binds to a work output        ->  <work-table from="ranked">
  the index imports a work file        ->  <work-import src="enrich.work">

# Names are the only glue. The weave gate checks that every reference resolves —
# a dangling :name fails the build.
</script>

<!-- ══════════════════ MODEL exploration ══════════════════ -->
<script type="text/plain" id="c-model-index">
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales</title>

  <!-- pages & units: a native <link>. the weave follows rel="work". -->
  <link rel="work" href="dashboard.work">
  <link rel="work" href="enrich.work">
  <link rel="work" href="team.work">                <!-- shared types -->

  <!-- toolkits: a native <link rel="toolkit">. its <crm-*> elements appear in pages. -->
  <link rel="toolkit" href="crm@2"    src="components.work.dev">
  <link rel="toolkit" href="charts@1" src="components.work.dev">

  <!-- packages: a native <link rel="package">. -->
  <link rel="package" href="npm:d3@7">
  <link rel="package" href="cargo:regex@1.10">

  <!-- net capability rides native CSP — the BROWSER already enforces this. -->
  <meta http-equiv="content-security-policy" content="connect-src https://api.crm.com">

  <!-- the rest is plain <meta>: a request the host binds, a target, a check. -->
  <meta name="secret" content="CRM_API_KEY">        <!-- declared; host binds the value -->
  <meta name="nexus"  content="wss://acme.nexus.work.dev">
  <meta name="check"  content="types:strict, caps:declared-only">
</head>

<body>
  <!-- the whole skeleton is plain HTML. ZERO custom elements in the index. -->
  <main>
    <h1>Sales</h1>
    <nav>
      <a href="dashboard.work">Dashboard</a>
      <a href="enrich.work">Leads</a>
    </nav>
  </main>
</body>
</html>
</script>

<script type="text/plain" id="c-model-dash">
route "/dashboard"
lang  :svelte         # this page's front-end lane (could be solid / astro / js)
use   [:crm, :charts]

# Sales dashboard

Rich-text prose. Then tasks, workflow, and code — all in the page, not the index.
The header above is Elixir; the prose is markdown; the code is a source block.

## Tasks

task "tune the scorer", status: :todo, owner: :analyst
task "wire the crm",    status: :done

## The view — a front-end island, hydrated client-side

source :board, lang: :svelte, client: true do
  ~S"""
  <script>
    import { Chart } from "charts"
    export let ranked = []
  <\/script>
  <Chart rows={ranked} x="name" y="score" />
  """
end
</script>

<script type="text/plain" id="c-model-enrich">
lang  :rust
grant net: "api.crm.com"

# Enrich

Bump each lead's revenue by the enrichment rate. Prose and code are siblings —
the prose is markdown, the code is an Elixir source block.

source :enrich, lang: :rust, tangle: "enrich.wasm" do
  ~S"""
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
  """
end

test :enrich do
  assert enrich(1000) == 1100
end
</script>

<script type="text/plain" id="c-model-dist">
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Sales</title>
  <script id="workbook-spec" type="application/wbundle">wbundle-html/1<\/script>
</head>
<body>
  <!-- SERVER regions arrive already rendered (SSR from the BEAM) -->
  <h1>Sales</h1>
  <work-island id="board"> … chart of ranked leads … </work-island>

  <!-- woven tree + wasm + js bundles + data, gzipped -->
  <script type="application/octet-stream" id="wb-blob">
    H4sIAAAAAAAA/+1c…  (enrich.wasm · board.js · DOM · leads)
  <\/script>
  <script type="module">
    const ds = new DecompressionStream("gzip");
    await hydrate(blobOf("#wb-blob"), ds);   // wake the islands
  <\/script>
</body>
</html>
</script>

<!-- ══════════════════ ARCHITECTURE explorations ══════════════════ -->
<script type="text/plain" id="c-tk-use">
# index.html — pull in a toolkit (an external component)

<work-use component="crm" from="components.work.dev/crm@2">

# a toolkit ships a PREFIX + its elements + the caps they need.
# any page can then use its elements and functions:

# dashboard.work
<crm-contacts list="leads"></crm-contacts>
import { lookup } from "crm"      # the toolkit's functions, too
</script>

<script type="text/plain" id="c-tk-author">
# crm.work — a toolkit is just a work file that EXPORTS a prefix

export prefix: "crm"

grant net "api.crm.com"            # caps the toolkit needs, declared up front

component "crm-contacts" do        # an element it ships
  # a view over the crm, rendered client-side
end

tangle "crm.wasm" do               # a function it ships
  defmodule CRM do
    def lookup(id), do: get("api.crm.com/contacts/" <> id)
  end
end
</script>

<script type="text/plain" id="c-dock-seam">
# The UI talks to ONE capability surface — the Dock.
# It never calls a server or an OS API directly.

fetch_leads()            # a capability request
  -> Dock                # the membrane decides who fulfills it
       -> local          # browser / OS via Tauri
       -> runtime        # the nexus, over RCP

# the author writes the request; the Dock routes it. a target
# (desktop / web / mobile) is just a routing config, not a fork.
</script>

<script type="text/plain" id="c-dock-prov">
# the SAME work file, two behaviours — the Dock swaps the provider.

data :leads, from: query("...")

#   static workbook   ->  sqlite-wasm in the browser
#   docked to a nexus ->  Postgres on the nexus (data stays server-side)

# zero code change. work declares "runs behind the Dock";
# the Dock resolves it differently by where it runs. (the "extrapolate".)
</script>

<script type="text/plain" id="c-nx-backs">
# The nexus is the server tier — pinpointed in the index:

<work-nexus url="wss://acme.nexus.work.dev">

# it backs the things a static file can't do alone:
#   . server compute    heavy / trusted functions
#   . data              Postgres, persistence, sync
#   . agents            long-running brains, tools
#   . secrets           bound at run, never in the bundle

# optional: a fully static workbook needs no nexus.
</script>

<script type="text/plain" id="c-nx-extrap">
# a SERVER lane extrapolates: same code, two homes.

flow do
  step :enrich, server     # static build -> runs at weave (baked in)
                           # docked       -> runs on the nexus per request
end

# `server` is the only marker that moves the work; the Dock picks where.
# docked, the data can stay server-side — "unbundling".
</script>

<script type="text/plain" id="c-dt-src">
# data sources are named units, resolved by a PROVIDER seam:

data :leads, from: "data/leads.csv"
data :crm,   from: query("SELECT * FROM crm.leads")
data :prefs, from: kv("user-prefs")

# the same source resolves by where it runs:
#   inline  -> in-memory
#   static  -> sqlite-wasm over an embedded (compressed) VFS
#   docked  -> exqlite / Postgres on the nexus
</script>

<script type="text/plain" id="c-dt-query">
# a query is a function over a source; a view binds to its result:

data :ranked, from: query("SELECT name, score FROM leads ORDER BY score DESC")

# in a page — re-renders when the source changes (signals, not a page overlay):
<work-table from="ranked"></work-table>
</script>

<script type="text/plain" id="c-sec-post">
# one posture per workbook governs what publishing exposes:

posture :public        # fully static, no secrets — safe anywhere
posture :gated_data    # shell ships public; data fetched from nexus AFTER auth
posture :gated_route   # the whole route is behind auth

# the COMPILER enforces it: a gated workbook can't be baked into a static host —
# it emits a shell that fetches the protected payload post-auth.
</script>

<script type="text/plain" id="c-sec-caps">
# capabilities are REQUESTS, not authority:

grant net "api.crm.com"      # the workbook asks
grant env "CRM_API_KEY"      # declared, never valued

# the HOST authorizes. "anyone can dock it" only works if the host grants caps.
# secrets are bound at RUN by the host — never authored, never bundled.
# the weave gate audits: a unit may use ONLY what it requested.
</script>

<script type="text/plain" id="c-ag-brain">
# an agent is a work file with a BRAIN — a system prompt + tools.

agent "Analyst" do
  model :mimo
  system """
  You enrich and score leads, then file issues for anything you can't resolve.
  """
  tools [:crm, :charts]      # tools ARE toolkits (components on PATH)
end

# runtime-backed: the nexus holds the loop, lifecycle, and context.
# the agent acts through the SAME Dock caps a human page would.
</script>

<script type="text/plain" id="c-dep">
# two canonical targets, one image, replicable between them:

work deploy local      # the runtime image in a local container (krunvm)
work deploy cloud      # the same image on the nexus (Fly), your registry

# the deliverable (dist/index.html) is static — host it ANYWHERE.
# `deploy` provisions the NEXUS tier (agents / data / secrets), not the page.
</script>

<!-- ══════════════════ added: grammar keystone + completeness ══════════════════ -->
<script type="text/plain" id="c-syn-fence">
# Code is RUNNABLE — so it lives on the Elixir side, as a source block. A plain
# markdown fence only SHOWS code (rich text, never runs); we rarely want it.

## Elixir — bare. do…end self-delimits: no fence, no sigil

tangle "score.wasm" do
  defmodule Scoring do
    def score(lead), do: lead.revenue / 1000 + lead.employees
  end
end

## A foreign language — still an Elixir block, carrying source + lang

source :enrich, lang: :rust, tangle: "enrich.wasm" do
  ~S"""
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
  """
end

# the BLOCK is the unit — name (:enrich), lang, build target: all Elixir.
# runnable ⇒ a source / tangle block. markdown just narrates around it.
</script>

<script type="text/plain" id="c-syn-test">
# A test is an Elixir block bound to a unit by name. BUILD lane: it runs at the
# weave gate, and a red test fails the build — no green dist/ over a broken unit.

source :enrich, lang: :rust, tangle: "enrich.wasm" do
  ~S"""
  pub fn enrich(revenue: i64) -> i64 { revenue * 110 / 100 }
  """
end

test :enrich do
  assert enrich(1000) == 1100
  assert enrich(0)    == 0
end

# `test :enrich` names the subject; the body asserts over its output. No runner
# to wire — the weave discovers the test blocks and runs them at the gate.
</script>

<script type="text/plain" id="c-syn-front">
# The file opens with its header — Elixir declarations, NOT YAML frontmatter.
# Same data lane as tasks; markdown is left purely for the prose below.

route "/dashboard"                      # this page's URL (a leaf page)
lang  :svelte                           # the front-end lane for this file's islands
use   [:crm, :charts]                   # toolkits this page draws elements / fns from
grant net: "api.crm.com"                # capability requests, scoped to this file
deps  [hex: "decimal@2", npm: "d3@7"]   # unit-level deps (app-level → the index)

# Sales dashboard

Then the literate body: markdown prose, and Elixir source / tangle blocks. The
header is declared, never run — the file's data-lane twin of the index.
</script>

<script type="text/plain" id="c-prim-map">
# Every primitive, and the lane it lives in. If a line isn't here, it's prose —
# or a composition of these. The discriminator never changes: WHO READS IT?

# ── rich text · markdown · a HUMAN reads ───────────────────────────
#   prose · headings · lists · links · tables · quotes · `code`
#   ![alt](src)            inline image
#   figure "…" do … end    captioned figure (renders, does NOT run)
#   - [ ] casual todo      a checklist for a human (not tracked data)

# ── function · elixir → orb → wasm · the RUNTIME runs ──────────────
#   tangle "…" do … end       compute · state machines (elixir)
#   source :x, lang: :rust do  a foreign-lang unit — still elixir-wrapped
#   flow do … step … end      workflows (step, parallel)
#   agent "…" do … end         a brain (model, system, tools)

# ── build · plain elixir / weave directives · the COMPILER builds ──
#   tangle: · @tangle      a unit's build target
#   test :unit do          verification (fails the build when red)
#   <link rel=package>     deps: hex / npm / cargo — the index manifest

# ── data · declarative elixir · the SYSTEM queries ────────────────
#   task · user · type     typed records + enums
#   data :x, from: …       a named source; query() over it
#   grant · posture        caps + publish posture
#   route · lang · use     the file's Elixir header (no YAML)

# everything runnable or declared is Elixir. markdown ONLY narrates — rich text
# and context around the code, never the code itself.
</script>

<script type="text/plain" id="c-model-pkg">
<!-- index.html — ONE manifest for EVERY ecosystem.
     no mix.exs · no package.json · no Cargo.toml · no vite.config.
     the index declares; the weave resolves. -->

<link rel="package" href="hex:decimal@2.1">      <!-- elixir -->
<link rel="package" href="npm:d3@7">             <!-- js     -->
<link rel="package" href="cargo:regex@1.10">     <!-- rust   -->

# pinned versions ARE the lockfile (source = lock). a unit's OWN deps can sit in
# its frontmatter instead; app-wide deps live here.
#
# do we need mix?  no — mix.exs would be a SECOND manifest fighting the index.
#   the weave does mix's job: pull hex, compile elixir→orb→wasm, in-sandbox.
# do we need vite? its ROLE yes (dev/HMR + bundling svelte/solid/js islands),
#   the TOOL no — a vite-MODEL lane, no Node. same for cargo, npm.
#
# ONE build tool (work bundle) absorbs every ecosystem's ROLE and adopts none
# of their manifests. that's the no-JSON rule + DRY, expressed as a build system.
</script>

<template id="e-syn-prose">
  <div class="kick">syntax · prose</div>
  <h2>Prose <span class="lane l-text">rich text</span></h2>
  <p class="tagline">Markdown, and only markdown. The rich-text lane never holds logic.</p>
  <h3>Where it sits</h3>
  <p>Prose is the <b>rich-text</b> lane: headings, <b>bold</b>, <i>italic</i>, lists, links, tables, quotes — already rich text for ~90% of any document. The rule that makes the whole format clean: <b>markdown is for reading, full stop</b>. It never expresses a function. Keeping this lane logic-free is what lets us "never confuse function with literacy."</p>
  <h3>Inline code is display-only</h3>
  <p>A backtick in prose (<code>`enrich`</code>) is just monospace text — <b>not</b> evaluated. Evaluation lives in the function lane (Compute), never in prose.</p>
</template>

<template id="e-syn-head">
  <div class="kick">syntax · headings</div>
  <h2>Headings <span class="lane l-text">rich text</span></h2>
  <p class="tagline">The narrative outline — what a human reads. Not the app skeleton, not a data tree.</p>
  <h3>Three "structures" — don't conflate them</h3>
  <ul><li><b>Narrative structure</b> = markdown headings (this page). For reading.</li>
  <li><b>App structure</b> = the <code>index.html</code> skeleton (routes, mounts). For the build.</li>
  <li><b>Queryable structure</b> = data (a <code>board</code>, records). For the system.</li></ul>
  <p>Headings are the first one only — they give the document its outline; they don't route the app and aren't queried as data.</p>
</template>

<template id="e-syn-fig">
  <div class="kick">syntax · figures</div>
  <h2>Figures <span class="lane l-text">rich text</span></h2>
  <p class="tagline">Richer-than-markdown, without leaving the rich-text lane — three escalators.</p>
  <h3>How richness escalates</h3>
  <ul><li class="pro"><b>Markdown image</b> — <code>![alt](src)</code>. The floor.</li>
  <li class="pro"><b>Presentational block</b> — <code>figure "…" do … end</code>. Same <code>do…end</code> grammar as code, but it <i>renders</i> (caption, layout); it doesn't run. One grammar, a new job.</li>
  <li class="pro"><b>Component escape hatch</b> — drop to <code>work-*</code> / raw HTML when markdown can't say it. The output is HTML anyway, so it's always available.</li></ul>
  <div class="note">Rich-text editing ≠ rich-text format. The file stays markdown; an editor can render it live (WYSIWYG) so it <i>feels</i> rich while the source stays literate.</div>
</template>

<template id="e-syn-tasks">
  <div class="kick">syntax · tasks · the contested line</div>
  <h2>Tasks <span class="lane l-text">rich text</span> <span class="lane l-data">data</span></h2>
  <p class="tagline">A to-do is prose or typed data, depending on who reads it. The task itself is the primitive — no "board" container.</p>
  <h3>The discriminator</h3>
  <p>Don't ask "markdown or Elixir." Ask <b>does anything query it?</b> A casual checklist a human reads is rich text (<code>- [ ]</code>). A <b>tracked task</b> with <code>status</code> / <code>owner</code> / <code>ref:</code> that the app renders and the agent acts on is <b>data</b> — a <code>task</code> declaration.</p>
  <h3>Task is the primitive, and it's typed</h3>
  <ul><li class="pro">No wrapper: <code>task "…", status: :todo, owner: :analyst</code> stands alone. "Board" was a leaky container; the unit is the task.</li>
  <li class="pro"><b>Typed</b> — <code>status</code> is an enum and <code>owner</code> references a <code>user</code> defined in a shared file. The weave gate validates both (see Primitives → Types).</li>
  <li class="pro">Cross-links to code (<code>ref: :scorer</code>) — tasks, workflow, and defs become one graph.</li></ul>
  <div class="note">Throwaway checklist → markdown. Anything tracked → a typed <code>task</code> declaration (declarative Elixir).</div>
</template>

<template id="e-syn-flow">
  <div class="kick">syntax · workflows</div>
  <h2>Workflows <span class="lane l-fn">function</span></h2>
  <p class="tagline">If it runs, it's Elixir — so a function is never confused with literacy.</p>
  <h3>Descriptive vs executable</h3>
  <p>A workflow you're only <i>describing</i> can be a markdown ordered list (prose). A workflow that <b>executes</b> — orchestrates real calls at weave or runtime — is Elixir: a <code>flow do … end</code> block. We lean Elixir for any runnable workflow, because orchestration is a function, and the point is to keep functions out of the prose lane.</p>
  <h3>Why Elixir fits</h3>
  <ul><li class="pro">A pipeline of calls is exactly what Elixir is good at (<code>step</code>, <code>parallel</code>).</li>
  <li class="pro">Steps <b>reference defs by name</b> — the workflow is wired to the compute and validated at the gate.</li></ul>
</template>

<template id="e-syn-compute">
  <div class="kick">syntax · compute</div>
  <h2>Compute <span class="lane l-fn">function</span> <span class="lane l-build">build</span></h2>
  <p class="tagline">Clean Elixir, wrapped in a tangle block. Orb underneath because it runs in the container.</p>
  <h3>Two lanes in one snippet</h3>
  <ul><li><b>Function</b> — the <code>defmodule … def …</code> is the compute. Authored as plain Elixir; <b>Orb compiles it to wasm</b> so it runs in the container. Surface orb-specific syntax (<code>I32</code>, <code>defw</code>, <code>memory</code>) only when a case truly needs low-level wasm types.</li>
  <li><b>Build</b> — the <code>tangle "score.wasm" do … end</code> wrapper is the build directive. <b>Plain Elixir, not Orb</b> — the one Elixir-but-not-Orb thing. It just says "compile these defs to this artifact."</li></ul>
  <div class="note">Prefer no nesting? <code>@tangle "score.wasm"</code> atop a plain <code>defmodule</code> does the same job — the module becomes the unit.</div>
</template>

<template id="e-prim-unit">
  <div class="kick">primitive · the unit</div>
  <h2>The unit</h2>
  <p class="tagline">The one addressable primitive. Everything else references units by name.</p>
  <h3>What it is</h3>
  <p>A <b>named thing</b> — a <code>def</code>, a board item, a figure, a data source. Naming is the whole interface: the flow names steps, a task names its <code>ref:</code>, a view names its source. <b>A unit is just a name</b>, so where it lives (inline in a page, or its own file) is an authoring choice nothing downstream depends on.</p>
</template>

<template id="e-prim-block">
  <div class="kick">primitive · the block</div>
  <h2>The block — <code>do…end</code></h2>
  <p class="tagline">One self-delimiting delimiter, four jobs. This is why code needs no fence.</p>
  <h3>Kind + body</h3>
  <p>A block is <code>&lt;kind&gt; … do … end</code> for <b>bodied units</b> — the <b>kind word selects the lane</b> (<code>tangle</code> build, <code>flow</code> function, <code>figure</code> rich text) and the body is what that lane holds. Because <code>do…end</code> is self-delimiting Elixir, the parser separates it from prose with <b>no fence and no sigil</b>.</p>
  <p>Flat <b>data</b> is the exception: a <code>task</code>, a <code>user</code>, a <code>type</code> have <i>fields</i>, not a body, so they're <b>declarations</b>, not blocks. Two shapes — bodied blocks and flat declarations — cover all four lanes.</p>
</template>

<template id="e-prim-lanes">
  <div class="kick">primitive · the four lanes</div>
  <h2>The four lanes</h2>
  <p class="tagline">The core primitive: every line belongs to exactly one lane, chosen by who reads it.</p>
  <div class="tests">
    <div class="test"><div class="t">rich text — markdown</div><div class="v">what you READ</div><div class="d">prose, headings, figures, tables. only this — never logic.</div></div>
    <div class="test"><div class="t">function — elixir → orb → wasm</div><div class="v">what RUNS</div><div class="d">compute, state machines, workflows. clean Elixir; Orb because it runs in the container.</div></div>
    <div class="test"><div class="t">build — plain elixir</div><div class="v">what COMPILES function</div><div class="d">tangle / untangle. the one Elixir-but-not-Orb thing.</div></div>
    <div class="test"><div class="t">data — declarative elixir</div><div class="v">what the system TRACKS</div><div class="d">tasks, users, types, config. typed + validated at the weave gate.</div></div>
  </div>
  <h3>The discriminator</h3>
  <p>Human reads it → markdown. Runtime runs it → Elixir/Orb. Compiler builds it → plain Elixir (tangle). System queries it as data → declarative Elixir. <b>Never confuse function with literacy.</b></p>
</template>

<template id="e-prim-types">
  <div class="kick">primitive · types &amp; definitions</div>
  <h2>Types <span class="lane l-data">data</span></h2>
  <p class="tagline">Types, enums, and people are declared once in a shared file — referenced by name, validated everywhere.</p>
  <h3>Where they live</h3>
  <p>A definitions file (e.g. <code>team.work</code>) holds <code>type</code> declarations (enums) and <code>user</code> / record declarations. It's <b>imported where used</b>, or resolved workbook-wide — <b>not the index</b>. The index is the build skeleton; this is the data dictionary. Keeping them separate is the same instinct as not putting secrets in the bundle: the right thing lives in the right place.</p>
  <h3>Referenced + validated</h3>
  <ul><li class="pro"><code>status: :todo</code> must be a value of <code>Status</code> — the weave gate rejects a typo.</li>
  <li class="pro"><code>owner: :analyst</code> must resolve to a defined <code>user</code> — a dangling owner fails the build.</li>
  <li class="pro">So the whole system shares <b>one source of truth</b> for people, statuses, categories — typed, no drift (philosophy C). Run this page to see the check.</li></ul>
  <h3>"Two defined the same way?"</h3>
  <p>They're just two declarations — <code>user :analyst</code> and <code>user :shane</code> both fit the <code>User</code> shape; each is a named unit, and references pick by name. Fully extensible: add a field to the <code>type</code>, or a new <code>user</code>, in one place and every reference stays in sync.</p>
  <div class="note">Tasks (the previous page) lean on this: a <code>task</code>'s <code>status</code> and <code>owner</code> are typed against these shared definitions.</div>
</template>

<template id="e-prim-refs">
  <div class="kick">primitive · references</div>
  <h2>References</h2>
  <p class="tagline">Names are the only glue — and the weave gate guarantees they resolve.</p>
  <h3>One linking mechanism</h3>
  <p>Units compose by <b>name</b>, not by imports scattered through the body: a flow step names a def, a task names its <code>ref:</code>, a view binds <code>from=</code> a work output, the index <code>work-import</code>s a file. Because everything links by name, the <b>weave gate can check every reference resolves</b> — a dangling <code>:name</code> fails the build. That's org-mode's cross-linking, kept, but validated.</p>
</template>

<template id="e-model-index">
  <div class="kick">model · the skeleton</div>
  <h2>index.html</h2>
  <p class="tagline">Not the content host — the app skeleton, the dependency manifest, the validation gate.</p>
  <h3>Its jobs</h3>
  <ul><li><b>Skeleton</b> — set up the app in one file; native HTML; pages are <code>work-import</code>ed.</li>
  <li><b>Validate the tangle</b> — <code>work-check</code> declares requirements the weave gate enforces.</li>
  <li><b>Manage deps</b> — <code>work-package</code> / <code>work-use</code> (toolkits as components), plus <code>work-nexus</code> (server target) and <code>work-grant</code> (capability requests).</li></ul>
  <div class="note">Native HTML first — <code>work-*</code> only where HTML can't say it (imports, packages, grants, nexus, checks).</div>
</template>

<template id="e-model-dash">
  <div class="kick">model · a page</div>
  <h2>dashboard.work</h2>
  <p class="tagline">Everything authored lives in the work file — rich text, a data board, a front-end island.</p>
  <h3>Lanes coexisting</h3>
  <p>Prose is markdown; the <code>task</code> lines are data; the Svelte <code>source … client: true</code> block is a front-end island the weave bundles and hydrates. Tasks and workflows live <b>here</b>, not the index.</p>
  <h3>Polyglot front-end</h3>
  <p>The lane is free — Svelte here, but Solid / Astro / plain JS weave the same way. <code>client</code> hydrates in the browser; a <code>server</code> block would run behind the Dock.</p>
</template>

<template id="e-model-enrich">
  <div class="kick">model · a compute unit</div>
  <h2>enrich.work</h2>
  <p class="tagline">A pure compute unit — markdown-literate, one typed block, one test.</p>
  <h3>Smallest shape</h3>
  <p>The header = lane + the unit's capability request (Elixir, not YAML). Prose explains it. One named <code>source</code> block is the code; a <code>test :unit</code> block proves it at the weave gate. A unit is just a name — inline or its own file is an authoring choice.</p>
</template>

<template id="e-model-weave">
  <div class="kick">model · the cli</div>
  <h2>the weave</h2>
  <p class="tagline">It's a CLI — <code>work dev</code> for the loop, <code>work bundle</code> to ship.</p>
  <h3>Two engines, one gate</h3>
  <p>Front-end lanes go through a Vite-class engine (borrow Vite's dev/HMR; ship in-sandbox, no Node). Server lanes: rust/zig → wasm via in-sandbox clang; elixir/orb → wasm/BEAM. Both feed the <b>weave gate</b>: resolve refs, audit caps + deps, run tests. Then server regions SSR from the BEAM, client lanes become islands, everything gzips into the blob.</p>
  <div class="note">Where Vite fits: <b>role yes, Node no.</b> Vite-model for the dev loop; our in-sandbox lane for the ship — portable, reproducible, zero native exec.</div>
</template>

<template id="e-model-dist">
  <div class="kick">model · the deliverable</div>
  <h2>dist/index.html</h2>
  <p class="tagline">One self-contained HTML — SSR shell + a gzip blob of wasm, JS, and data.</p>
  <h3>Security — what publishing means</h3>
  <ul><li class="pro"><b>Code in the bundle is fine</b> — logic isn't secret.</li>
  <li class="con"><b>Secrets never bundled</b> — <code>env</code> is a request; the host binds it at run.</li>
  <li class="con"><b>Gated data never enters a static file</b> — gated builds ship a shell that fetches from the nexus after auth; the compiler enforces it.</li></ul>
  <div class="note">Postures: <b>public</b> · <b>gated_data</b> · <b>gated_route</b>. The posture is the publish lever; the weave gate + grants keep it honest.</div>
</template>

<template id="e-tk-use">
  <div class="kick">toolkits · use</div>
  <h2>Use a toolkit <span class="lane l-build">build</span></h2>
  <p class="tagline">External deps, shipped as components — included by a native link; their elements appear in pages.</p>
  <h3>How it works</h3>
  <p>A toolkit is pulled in with a <b>native <code>&lt;link rel="toolkit"&gt;</code></b> (version-pinned, verified). It ships a <b>prefix</b> + its custom elements + the caps they need. Pages then use <code>&lt;crm-contacts&gt;</code> and <code>import … from "crm"</code>. The weave audits the caps the toolkit brings — nothing ambient.</p>
  <h3>Why components</h3>
  <p>Web components are the natural <b>distribution unit</b>: a prefix namespaces the elements, and the same registry serves the desktop app and any workbook. Toolkits are the one place custom elements clearly earn their keep.</p>
</template>

<template id="e-tk-author">
  <div class="kick">toolkits · author</div>
  <h2>Author one <span class="lane l-build">build</span></h2>
  <p class="tagline">A toolkit is just a work file that exports a prefix — kit is the floor.</p>
  <h3>What it declares</h3>
  <p><code>export prefix: "crm"</code> plus the caps it needs, the <code>component</code>s it ships, and the <code>tangle</code>d functions behind them. Published to a registry, versioned; consumers link it in.</p>
  <h3>Why it matters</h3>
  <p>The <b>same authoring surface builds apps and the libraries apps import</b> — there's no separate "plugin SDK." If a primitive isn't ready, you build it as a toolkit and use it.</p>
</template>

<template id="e-dock-seam">
  <div class="kick">dock · the seam</div>
  <h2>The one seam</h2>
  <p class="tagline">The UI requests a capability; the Dock routes it to a provider. Never a server or OS call directly.</p>
  <h3>How it works</h3>
  <p>Every capability (fetch, store, compute) is a request to <b>one membrane</b>. Behind it a router fulfills from a <b>provider</b>: <code>local</code> (OS via Tauri, or browser-native) or <code>runtime</code> (the nexus over RCP). The author writes the request, not the wiring.</p>
  <h3>Why it matters</h3>
  <p>A <b>target — desktop / web / mobile — is just a routing config</b>, not a code fork. One frontend, many targets, behind a single seam.</p>
</template>

<template id="e-dock-prov">
  <div class="kick">dock · providers</div>
  <h2>Providers</h2>
  <p class="tagline">The same request, fulfilled locally or by the runtime — the workbook doesn't change.</p>
  <h3>Extrapolate</h3>
  <p>A static workbook resolves <code>data</code>/compute against <b>browser-native</b> providers (sqlite-wasm, in-guest wasm). Docked, the Dock resolves the <i>same</i> request against the <b>nexus</b> (Postgres, server compute) — and the data can stay server-side.</p>
  <h3>Why it matters</h3>
  <p>Write once; ship the same file as a zero-infra static doc <i>or</i> a live server app. The Dock is where that choice lives — as resolution, not as a rewrite.</p>
</template>

<template id="e-nx-backs">
  <div class="kick">nexus · what it backs</div>
  <h2>What it backs <span class="lane l-fn">function</span></h2>
  <p class="tagline">The optional server tier behind the Dock — compute, data, agents, secrets, sync.</p>
  <h3>How it works</h3>
  <p>Pinpointed in the index (a single nexus URL). It backs what a static file can't do alone: heavy/trusted compute, persistence + sync, long-running agents, and secret binding. Metered per tenant.</p>
  <h3>Why it matters</h3>
  <p>The workbook still <b>renders client-side</b> — the nexus is additive, not required. A static workbook needs none; an app opts in by declaring one.</p>
</template>

<template id="e-nx-extrap">
  <div class="kick">nexus · extrapolate</div>
  <h2>Extrapolate <span class="lane l-fn">function</span></h2>
  <p class="tagline">A server lane runs at build when static, on the nexus when docked — one marker.</p>
  <h3>How it works</h3>
  <p><code>server</code> on a step is the only thing that moves the work. Static: it runs at weave and the result bakes in. Docked: it runs on the nexus per request, and the data never leaves the server (<b>unbundling</b>).</p>
  <h3>Why it matters</h3>
  <p>One file scales from a static document to a live, data-private app with no code change — the "extrapolate" property as syntax.</p>
</template>

<template id="e-dt-src">
  <div class="kick">data · sources</div>
  <h2>Sources <span class="lane l-data">data</span></h2>
  <p class="tagline">A named source, resolved by a provider seam — memory, sqlite-wasm, or the nexus.</p>
  <h3>How it works</h3>
  <p>A <code>data</code> unit names where data comes from (a file, a query, a kv). The workbook embeds a <b>SQLite VFS as a compressed blob</b>; the Host resolves a query to <b>exqlite/Postgres when docked</b>, <b>sqlite-wasm when static</b>, in-memory inline.</p>
  <h3>Why it matters</h3>
  <p>Data stays server-side when it should (unbundling), works offline when it can — same declaration, different provider.</p>
</template>

<template id="e-dt-query">
  <div class="kick">data · query</div>
  <h2>Query <span class="lane l-data">data</span> <span class="lane l-text">rich text</span></h2>
  <p class="tagline">Query a source; a view binds to the result and re-renders reactively.</p>
  <h3>How it works</h3>
  <p>A query is a <code>data</code> unit over a source. A view <code>from=</code> binds to it by name. Reactivity is <b>signals</b> (TC39 signals), node-local — not a page-level overlay.</p>
  <h3>Why it matters</h3>
  <p>Declarative data → view, validated at the gate (the binding's <code>from</code> must resolve). The view is just a selector over the work.</p>
</template>

<template id="e-sec-post">
  <div class="kick">security · postures</div>
  <h2>Postures</h2>
  <p class="tagline">One posture per workbook decides what publishing exposes — and the compiler enforces it.</p>
  <h3>The three</h3>
  <ul><li class="pro"><b>public</b> — fully static, no secrets; safe to host anywhere.</li>
  <li class="con"><b>gated_data</b> — shell ships public; data fetched from the nexus after auth.</li>
  <li class="con"><b>gated_route</b> — the whole route is behind auth.</li></ul>
  <h3>Enforced, not trusted</h3>
  <p>A static file <b>can't</b> be gated client-side (that's theater — the bytes ship to anyone). So the compiler rejects gated content on a static host and emits a <b>shell that fetches the protected payload post-auth</b>.</p>
</template>

<template id="e-sec-caps">
  <div class="kick">security · caps &amp; secrets</div>
  <h2>Caps &amp; secrets</h2>
  <p class="tagline">Capabilities are requests the host authorizes; secrets are bound at run, never bundled.</p>
  <h3>How it works</h3>
  <ul><li class="pro"><code>grant</code> is a <b>request</b>, not authority — the host decides. "Anyone can dock it" only works if the host grants the caps.</li>
  <li class="con"><b>Secrets are host-bound at run</b> — <code>env</code> is declared, never valued, never in the bundle.</li>
  <li class="pro">The weave audits <b>declared-only</b> — a unit may use only what it requested (over-reach <i>and</i> unused grants flag).</li></ul>
  <div class="note">Native carrier: in the index these ride <code>&lt;meta&gt;</code> — net caps map onto a CSP <code>connect-src</code> the browser already enforces.</div>
</template>

<template id="e-ag-brain">
  <div class="kick">agents · the brain</div>
  <h2>The brain <span class="lane l-fn">function</span></h2>
  <p class="tagline">An agent is a work file with a brain — a system prompt, a model, and tools.</p>
  <h3>How it works</h3>
  <p>An <code>agent</code> block declares a <code>model</code>, a <code>system</code> prompt, and <code>tools</code> — and <b>tools are toolkits</b> (the same components a page uses). It's <b>runtime-backed</b>: the nexus owns the loop, lifecycle, and context; the agent acts through the <b>same Dock caps</b> a human page would.</p>
  <h3>Why it matters</h3>
  <p>Agent behavior lives in the <b>declarative config layer</b>, not host code — so it composes the exact same primitives as everything else. No separate agent runtime to learn.</p>
</template>

<template id="e-dep">
  <div class="kick">deploy · two targets</div>
  <h2>Two targets</h2>
  <p class="tagline">Local container and cloud nexus, from one image. The page itself hosts anywhere.</p>
  <h3>How it works</h3>
  <p><code>work deploy local</code> runs the runtime image in a local container; <code>work deploy cloud</code> runs the same image on the nexus. The static deliverable (<code>dist/index.html</code>) is just files — host it on any static host.</p>
  <h3>Why it matters</h3>
  <p><b>Deploy provisions the nexus tier</b> (agents/data/secrets), never the page. In-sandbox build means push-to-live is instant; CI is only for special cases.</p>
</template>

<template id="e-syn-fence">
  <div class="kick">syntax · source blocks</div>
  <h2>Source blocks <span class="lane l-fn">function</span> <span class="lane l-build">build</span></h2>
  <p class="tagline">Code is runnable, so it's Elixir — a source block, never a bare markdown fence.</p>
  <h3>Why not a fence</h3>
  <p>A markdown <code>```fence```</code> only <i>shows</i> code — it's rich text, it never runs. We almost never want that. Real code is meant to <b>run</b>, so it's authored as an Elixir block (<code>tangle</code> / <code>source</code>) the weave compiles and the container executes. The dividing line stays clean: <b>markdown communicates, Elixir runs</b>.</p>
  <h3>One block, any language</h3>
  <ul><li class="pro"><b>Elixir is bare</b> — <code>do…end</code> self-delimits; a <code>tangle</code> block needs no wrapper.</li>
  <li class="pro"><b>Foreign code rides a source block</b> — <code>source :enrich, lang: :rust, tangle: "…" do … end</code> carries the source, its lang, and its build target. Still Elixir on the outside; the unit is named by atom.</li></ul>
  <div class="note">"Runnable or not" is just <b>source block vs fence</b> — and we lean runnable. If you only want to <i>display</i> code, a fence does it; nothing runs.</div>
</template>

<template id="e-syn-test">
  <div class="kick">syntax · tests</div>
  <h2>Tests <span class="lane l-build">build</span></h2>
  <p class="tagline">An Elixir block bound to a unit by name. Red test → no bundle.</p>
  <h3>How it works</h3>
  <p>A <code>test :enrich do … end</code> block asserts over the unit's output. The weave <b>discovers and runs them at the gate</b> — there's no runner to wire. A failure fails the build, so a green <code>dist/</code> means every test passed.</p>
  <h3>Why it's build-lane</h3>
  <p>A test isn't shipped behavior and isn't prose — it's a <b>gate check</b>, the same lane as <code>tangle</code>. It proves the function <i>before</i> the function is woven in.</p>
</template>

<template id="e-syn-front">
  <div class="kick">syntax · the header</div>
  <h2>The header <span class="lane l-data">data</span></h2>
  <p class="tagline">A file's header is Elixir declarations — not YAML frontmatter. Markdown is left for prose only.</p>
  <h3>Why Elixir, not YAML</h3>
  <p>The header carries <code>route</code>, <code>lang</code>, caps, and this file's <code>deps</code> — all <b>declarations the system reads</b>. That's the data lane, so it's Elixir like every other declaration (<code>task</code>, <code>user</code>). No YAML, no second mini-language: <b>markdown narrates, Elixir declares</b>.</p>
  <h3>The unit-scoped twin of the index</h3>
  <p>The <b>index</b> owns the app; a file's <b>header</b> owns the file — its route, its islands' lane, its own deps. Same instinct as colocating a unit's deps with the unit.</p>
</template>

<template id="e-prim-map">
  <div class="kick">primitive · the map</div>
  <h2>The primitive map</h2>
  <p class="tagline">Every primitive → its lane. The completeness check: markdown side or Elixir side, at a glance.</p>
  <h3>rich text <span class="lane l-text">markdown</span></h3>
  <p><code>prose</code> · <code>headings</code> · <code>lists</code> · <code>tables</code> · <code>quotes</code> · <code>`code`</code> · <code>![img]()</code> · <code>figure do</code> · <code>- [ ]</code> casual todo</p>
  <h3>function <span class="lane l-fn">elixir → wasm</span></h3>
  <p><code>tangle do</code> compute · <code>source lang:</code> foreign code · <code>flow do</code> workflows · <code>agent do</code> brains</p>
  <h3>build <span class="lane l-build">plain elixir / weave</span></h3>
  <p><code>tangle: · @tangle</code> · <code>test :unit do</code> · <code>&lt;link rel=package&gt;</code></p>
  <h3>data <span class="lane l-data">declarative elixir</span></h3>
  <p><code>task · user · type</code> · <code>data :x, from:</code> · <code>grant · posture</code> · <code>route · lang · use</code> (header)</p>
  <div class="note">If a line is none of these, it's prose. <b>Markdown only narrates</b> — rich text and context around code, never the code itself. The discriminator never changes: <b>who reads it?</b></div>
</template>

<template id="e-model-pkg">
  <div class="kick">model · packages</div>
  <h2>Packages <span class="lane l-build">build</span></h2>
  <p class="tagline">One manifest, one build tool. No mix.exs, no package.json, no Cargo.toml, no vite.config.</p>
  <h3>The index is the only manifest</h3>
  <p>Deps for every ecosystem are <code>&lt;link rel="package" href="hex:… | npm:… | cargo:…"&gt;</code> in the index (app-wide) or a file's frontmatter (unit-local). <b>Pinned versions are the lockfile</b> — source is the lock, no sidecar to drift.</p>
  <h3>Do we need mix? Vite?</h3>
  <ul><li class="con"><b>mix.exs — no.</b> A second manifest fighting the index. The weave does mix's job: pull hex, compile elixir → orb → wasm, in-sandbox.</li>
  <li class="pro"><b>Vite's role — yes; the tool — no.</b> A vite-<i>model</i> lane gives dev / HMR + bundles svelte / solid / js islands, with no Node. Same story for cargo and npm.</li></ul>
  <div class="note"><b>One build tool — <code>work bundle</code> — absorbs every ecosystem's role and adopts none of their manifests.</b> That's the no-JSON rule and DRY, expressed as a build system.</div>
</template>

      { regex: /\*\*[^*]+\*\*/, token: "strong" },                  // **bold**
      { regex: /\*[^*\s][^*]*\*/, token: "em" },                    // *italic*
      { regex: /\[[^\]]*\]\([^)]*\)/, token: "link" },              // [text](url)
      { regex: /#.*/, token: "comment" },                           // # comment (non-heading)
      { regex: /:[A-Za-z_]\w*[!?]?/, token: "atom" },               // :atoms
      { regex: /@[A-Za-z_]\w*/, token: "meta" },                    // @module_attrs
      { regex: /\b(?:defmodule|defmacro|defp|def|do|end|cond|case|fn|when|if|else|true|false|nil|import|alias|use|require)\b/, token: "keyword" },
      { regex: /\b(?:tangle|untangle|flow|board|figure|note|task|user|type|step|parallel|todo|doing|done|compute|validate|grant|memory)\b/, token: "variable-2" },
      { regex: /<\/?[A-Za-z][\w-]*/, token: "tag" },                // <work-* / html tags
      { regex: /\b\d[\d_]*\b/, token: "number" },
      { regex: /./, token: null },
    ],
  });

  const grab = (id) => document.getElementById(id).textContent
        .replace(/^\n/,"").replace(/\s+$/,"").replace(/<\\\/script>/g,"<\/script>");
  const cm = CodeMirror.fromTextArea(document.getElementById("ed"), {
    theme:"material-darker", lineNumbers:true, lineWrapping:false, tabSize:2, readOnly:false,
  });
  const nav  = document.getElementById("nav");
  const exp  = document.getElementById("exp");
  const term = document.getElementById("term");
  const fnEl = document.getElementById("fn");
  const lgEl = document.getElementById("lg");
  const drawer=document.getElementById("drawer"), dterm=document.getElementById("dterm"),
        dclose=document.getElementById("dclose"), dtitle=document.getElementById("dtitle"),
        runbtn=document.getElementById("runbtn");
  let termTimer=null, drawerTimer=null, curE=0, curTi=0;

  function streamDrawer(lines){
    dterm.innerHTML=""; if(drawerTimer)clearTimeout(drawerTimer);
    let k=0;
    (function step(){
      if(k<lines.length){ const d=document.createElement("div"); d.className="tl"; d.innerHTML=lines[k++]||"&nbsp;"; dterm.appendChild(d); dterm.scrollTop=dterm.scrollHeight; drawerTimer=setTimeout(step,55); }
      else { const c=document.createElement("span"); c.className="cur"; c.textContent="▋"; dterm.appendChild(c); }
    })();
  }
  function closeDrawer(){ if(drawerTimer){clearTimeout(drawerTimer);drawerTimer=null;} drawer.classList.remove("open"); setTimeout(()=>cm.refresh(),210); }
  runbtn.onclick=()=>{
    const t=EXPLORATIONS[curE].topics[curTi];
    if(!t.run) return;
    if(drawer.classList.contains("open")){ closeDrawer(); return; }
    dtitle.textContent="run · "+t.fn;
    drawer.classList.add("open");
    streamDrawer(t.run);
    setTimeout(()=>cm.refresh(),210);
  };
  dclose.onclick=closeDrawer;

  function runTerm(){
    term.innerHTML=""; if(termTimer)clearTimeout(termTimer);
    let k=0;
    (function step(){
      if(k<WEAVE.length){
        const d=document.createElement("div"); d.className="tl"; d.innerHTML=WEAVE[k++]||"&nbsp;";
        term.appendChild(d); term.scrollTop=term.scrollHeight;
        termTimer=setTimeout(step,42);
      } else { const c=document.createElement("span"); c.className="cur"; c.textContent="▋"; term.appendChild(c); }
    })();
  }

  function loadTopic(ti){
    curTi = ti;
    const t = EXPLORATIONS[curE].topics[ti];
    const isTerm = !!t.term;
    runbtn.classList.toggle("show", !!t.run);
    closeDrawer();
    const cmWrap = document.querySelector(".CodeMirror");
    if(cmWrap) cmWrap.style.display = isTerm ? "none" : "";
    term.style.display = isTerm ? "block" : "none";
    if(termTimer){ clearTimeout(termTimer); termTimer=null; }
    if(isTerm){ runTerm(); }
    else { cm.setOption("mode", t.mode||"null"); cm.setValue(grab(t.code)); setTimeout(()=>cm.refresh(),0); }
    fnEl.textContent = t.fn; lgEl.textContent = t.lg;
    exp.innerHTML=""; exp.appendChild(document.getElementById(t.exp).content.cloneNode(true)); exp.scrollTop=0;
    nav.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on", j===ti));
  }

  function renderNav(ei){
    const e = EXPLORATIONS[ei];
    let html = `<div class="nav-head"><h1>${e.name}</h1><p class="lede">${e.lede}</p></div>`;
    let lastG=null;
    e.topics.forEach((t,ti)=>{
      if(t.group && t.group!==lastG){ html+=`<div class="grp">${t.group}</div>`; lastG=t.group; }
      html += `<button data-topic="${ti}"><div class="nm">${t.nm}</div><span class="tag">${t.tag}</span></button>`;
    });
    nav.innerHTML = html;
    nav.querySelectorAll("button").forEach(b=>b.onclick=()=>loadTopic(+b.dataset.topic));
  }

  function loadExploration(ei){
    curE = ei;
    renderNav(ei);
    document.querySelectorAll(".rail button").forEach((b,j)=>b.classList.toggle("on", j===ei));
    loadTopic(0);
  }

  const rail = document.getElementById("rail");
  EXPLORATIONS.forEach((e,i)=>{
    const b=document.createElement("button"); b.title=e.name; b.textContent=e.emoji;
    b.onclick=()=>loadExploration(i); rail.appendChild(b);
  });

  (function(){
    const drag=document.getElementById("drag"), expEl=document.querySelector(".exp");
    let on=false;
    drag.addEventListener("pointerdown",e=>{on=true;drag.classList.add("on");drag.setPointerCapture(e.pointerId);document.body.style.userSelect="none";});
    drag.addEventListener("pointermove",e=>{if(!on)return;const w=window.innerWidth-e.clientX;expEl.style.width=Math.max(240,Math.min(760,w))+"px";});
    const end=()=>{if(!on)return;on=false;drag.classList.remove("on");document.body.style.userSelect="";cm.refresh();};
    drag.addEventListener("pointerup",end);drag.addEventListener("pointercancel",end);
  })();

  loadExploration(0);
</script>
</body>
</html>
