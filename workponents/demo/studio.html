<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="darkreader-lock" />
  <meta name="color-scheme" content="light dark" />
  <title>Workbook Studio — code ⟷ result</title>
  <style>
    :root { --ink:#121316; --paper:#f7f6f1; --line:#2a2b30; --mut:#9a988f; --acc:#aee5c2; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { display:flex; flex-direction:column; background:var(--ink); color:#e9e8e2;
           font:14px/1.5 "Geist", ui-sans-serif, system-ui, sans-serif; overflow:hidden; }
    header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); flex:0 0 auto; }
    header h1 { font-size:14px; margin:0; letter-spacing:-.01em; }
    header h1 b { background:var(--paper); color:var(--ink); padding:2px 8px; border-radius:7px; }
    header .file { font:12px/1 "Geist Mono",ui-monospace,monospace; color:var(--mut); }
    header .grow { flex:1; }
    header .dot { width:8px; height:8px; border-radius:50%; background:var(--acc); display:inline-block; }
    header .status { font:12px/1 "Geist Mono",monospace; color:var(--mut); }
    header button { font:600 12px "Geist Mono",monospace; padding:6px 11px; border-radius:7px;
                    border:1px solid var(--line); background:#1b1c21; color:#e9e8e2; cursor:pointer; }
    .split { flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; min-height:0; }
    .pane { min-width:0; min-height:0; display:flex; flex-direction:column; }
    .pane.left { border-right:1px solid var(--line); }
    .pane > .label { font:11px/1 "Geist Mono",monospace; letter-spacing:.12em; text-transform:uppercase;
                     color:var(--mut); padding:8px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; }
    #code { flex:1; width:100%; resize:none; border:0; outline:0; padding:14px 16px; tab-size:2;
            background:#0f1013; color:#dfe4dd; white-space:pre; overflow:auto;
            font:12.5px/1.6 "Geist Mono", ui-monospace, "SF Mono", monospace; }
    .pane.right { background:var(--paper); }
    #out { flex:1; width:100%; border:0; background:var(--paper); }
  </style>
</head>
<body>
  <header>
    <h1><b>Workbook</b> Studio</h1>
    <span class="file">demo/composite.html</span>
    <span class="grow"></span>
    <span class="dot"></span><span class="status" id="status">rendered</span>
    <button id="reset">reset</button>
  </header>
  <div class="split">
    <div class="pane left">
      <div class="label">source · html</div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div class="pane right">
      <div class="label">result · live</div>
      <iframe id="out" title="result"></iframe>
    </div>
  </div>

  <script type="module">
    const codeEl = document.getElementById("code");
    const out = document.getElementById("out");
    const status = document.getElementById("status");
    // absolute base so the workbook's ../src imports + importmap resolve inside the iframe
    const BASE = new URL("./", location.href).href;
    let original = "";

    // inject a <base> right after <head> so relative module paths work in srcdoc
    const withBase = (src) =>
      src.replace(/<head>/i, `<head>\n  <base href="${BASE}">`);

    function render() {
      status.textContent = "rendering…";
      out.srcdoc = withBase(codeEl.value);
    }
    out.addEventListener("load", () => { status.textContent = "rendered"; });

    let t;
    codeEl.addEventListener("input", () => {
      status.textContent = "edited";
      clearTimeout(t);
      t = setTimeout(render, 450);
    });
    document.getElementById("reset").addEventListener("click", () => {
      codeEl.value = original; render();
    });

    // load the composite as the studio's starting source (DRY — single source file)
    original = await (await fetch("composite.html")).text();
    codeEl.value = original;
    render();
  </script>
</body>
</html>
