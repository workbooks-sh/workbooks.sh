<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock"><meta name="color-scheme" content="light dark">
<title>Workbooks — live roadmap</title>
<style>
  :root { --ink:#121316; --paper:#f7f6f1; --card:#fbfaf3; --line:#e4e1d6; --mut:#6b6a63;
          --mint:#aee5c2; --mint-ink:#0c3a22; --sky:#a8d4f0; --sky-ink:#0d3450;
          --peach:#f3c5a3; --peach-ink:#5a2c10; --red:#e9a8a3; --red-ink:#5a1410; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:15px/1.5 "Geist", ui-sans-serif, system-ui, sans-serif; }
  code, .mono { font-family:"Geist Mono", ui-monospace, "SF Mono", monospace; }
  header { padding:34px 40px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:24px; letter-spacing:-.02em; }
  header h1 b { background:var(--ink); color:var(--paper); padding:2px 9px; border-radius:8px; }
  header .sub { color:var(--mut); margin:8px 0 0; max-width:74ch; }
  header .mantra { margin:14px 0 0; font:600 12px/1.4 "Geist Mono",monospace; letter-spacing:.04em;
                   color:var(--mint-ink); background:var(--mint); display:inline-block; padding:5px 11px; border-radius:8px; }
  .bar-wrap { margin:18px 0 0; }
  .bar { height:10px; background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ink); transition:width .4s; }
  .bar-label { font:12px/1 "Geist Mono",monospace; color:var(--mut); margin:0 0 6px; }
  .live { float:right; font:11px/1 "Geist Mono",monospace; color:var(--mut); }
  .live .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--mint); margin-right:5px;
               box-shadow:0 0 0 3px color-mix(in srgb, var(--mint) 40%, transparent); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:18px; padding:24px 40px 90px; align-items:start; }
  .phase { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
           box-shadow:0 1px 0 rgba(18,19,22,.03), 0 8px 22px -16px rgba(18,19,22,.25); }
  .phase header { padding:16px 18px; border-bottom:1px solid var(--line); background:var(--paper); }
  .phase h2 { margin:0; font-size:16px; letter-spacing:-.01em; }
  .phase .goal { color:var(--mut); font-size:13px; margin:6px 0 0; }
  .phase .tag { display:inline-block; margin:8px 0 0; font:11px/1 "Geist Mono",monospace; color:var(--sky-ink);
                background:var(--sky); padding:3px 8px; border-radius:20px; }
  .phase .ph-bar { padding:10px 18px 0; }
  .tasks { padding:10px 14px 16px; display:flex; flex-direction:column; gap:8px; }
  .task { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line);
          border-radius:10px; background:var(--paper); }
  .task .mark { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line);
                display:grid; place-items:center; font-size:11px; margin-top:1px; }
  .task.done   { opacity:.66; } .task.done .mark { background:var(--mint); border-color:var(--mint); color:var(--mint-ink); }
  .task.doing  .mark { background:var(--peach); border-color:var(--peach); color:var(--peach-ink); }
  .task.blocked .mark { background:var(--red); border-color:var(--red); color:var(--red-ink); }
  .task .body { flex:1; font-size:13.5px; line-height:1.45; }
  .task.done .body { text-decoration:line-through; text-decoration-color:var(--mut); }
  .task .id { font:10px/1 "Geist Mono",monospace; color:var(--mut); display:block; margin-bottom:2px; }
  .task .note { color:var(--mut); font-size:12px; margin-top:3px; }
</style>
</head>
<body>
  <header>
    <span class="live"><span class="dot"></span><span id="stamp">live · polling roadmap.json</span></span>
    <h1><b>Workbooks</b> · live roadmap</h1>
    <p class="sub" id="sub"></p>
    <p class="mantra" id="mantra"></p>
    <div class="bar-wrap">
      <p class="bar-label"><span id="overall-label">—</span></p>
      <div class="bar"><i id="overall-bar" style="width:0"></i></div>
    </div>
  </header>
  <main id="board"></main>

  <script type="module">
    const MARK = { done: "✓", doing: "▸", blocked: "✕", todo: "" };
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    let last = "";

    async function tick() {
      let data;
      try { data = await (await fetch(`roadmap.json?t=${Date.now()}`)).json(); }
      catch { document.getElementById("stamp").textContent = "roadmap.json unreachable"; return; }
      const sig = JSON.stringify(data);
      if (sig === last) return;                  // no change → no re-render (cheap poll)
      last = sig;
      render(data);
      const now = new Date().toLocaleTimeString();
      document.getElementById("stamp").textContent = `live · updated ${now}`;
    }

    function pct(tasks) {
      const done = tasks.filter((t) => t.status === "done").length;
      return tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    }

    function render(d) {
      document.getElementById("sub").textContent = d.subtitle || "";
      document.getElementById("mantra").textContent = d.mantra || "";
      const all = d.phases.flatMap((p) => p.tasks);
      const overall = pct(all);
      document.getElementById("overall-bar").style.width = overall + "%";
      const doneN = all.filter((t) => t.status === "done").length;
      document.getElementById("overall-label").textContent =
        `${overall}% — ${doneN}/${all.length} tasks · ${all.filter((t) => t.status === "doing").length} in flight`;

      document.getElementById("board").innerHTML = d.phases.map((p) => {
        const pp = pct(p.tasks);
        return `
        <section class="phase">
          <header>
            <h2>${esc(p.title)}</h2>
            <p class="goal">${esc(p.goal || "")}</p>
            <span class="tag">${esc(p.autonomy || "")}</span>
          </header>
          <div class="ph-bar">
            <p class="bar-label">${pp}% · ${p.tasks.filter((t) => t.status === "done").length}/${p.tasks.length}</p>
            <div class="bar"><i style="width:${pp}%"></i></div>
          </div>
          <div class="tasks">
            ${p.tasks.map((t) => `
              <div class="task ${t.status}">
                <span class="mark">${MARK[t.status] || ""}</span>
                <div class="body"><span class="id mono">${esc(t.id)}</span>${esc(t.title)}
                  ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}</div>
              </div>`).join("")}
          </div>
        </section>`;
      }).join("");
    }

    tick();
    setInterval(tick, 3000);   // hot-reload: re-fetch every 3s, re-render only on change
  </script>
</body>
</html>
