<!doctype html>
<html lang="en" data-work-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- offline import map: lit + every directive specifier → the one shared bundle -->
  <script type="importmap">
    {
      "imports": {
        "lit": "/__lit/all.js",
        "lit/directives/unsafe-html.js": "/__lit/all.js",
        "lit/directives/unsafe-svg.js": "/__lit/all.js",
        "lit/directives/ref.js": "/__lit/all.js"
      }
    }
  </script>
  <link rel="stylesheet" href="/src/theme/tokens.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--work-bg); color: var(--work-fg); font-family: var(--work-font, system-ui); padding: 24px; }
    #stage { display: block; }
  </style>
  <!-- register every element (idempotent); the harness mounts by tag name.
       A throw mid-barrel (a floor element with a Lit dev-mode warning that
       escalates) must NOT strand the harness — load the whole barrel first
       (gets most), then expose a per-module loader so the harness can import any
       still-unregistered element by its OWN module path with isolated try/catch.
       Each module's failure is recorded, never fatal. -->
  <script type="module">
    window.__loadErrors = [];
    try { await import("/src/index.js"); }
    catch (e) { window.__loadErrors.push("index.js: " + String(e)); }
    // The harness runs OFFLINE (no CDN). Pin the shared data engine to the zero-dep
    // in-JS memory provider so data-bound elements (work-chart/table/metric) never
    // hang awaiting the sqlite-wasm CDN boot — they resolve their queries instantly
    // against the in-page subset, exactly as the offline-floor contract intends.
    try {
      const { getEngine } = await import("/src/data/index.js");
      const eng = getEngine();
      eng._provider = "memory";
      eng._initPromise = Promise.resolve();
      eng._ensureProvider = async () => "memory";
    } catch (e) { window.__loadErrors.push("data-engine pin: " + String(e)); }
    // Per-module loader: import one element file in isolation. Returns true if the
    // tag is registered afterwards. Used by the harness to recover elements that a
    // barrel-level throw skipped (a bad sibling module can't strand a good one).
    window.__loadModule = async (path) => {
      try { await import("/" + path.replace(/^\/+/, "")); return true; }
      catch (e) { window.__loadErrors.push(path + ": " + String(e)); return false; }
    };
    window.__workponentsLoaded = true;
  </script>
</head>
<body>
  <div id="stage"></div>
  <script>
    // ── harness API (driven from Playwright via page.evaluate) ────────────────
    // The gate calls window.__gate.* — kept tiny + synchronous-friendly.
    window.__gate = {
      setTheme(theme) {
        document.documentElement.setAttribute("data-work-theme", theme);
      },
      // Mount one element. spec = { tag, attrs:{}, html:"", into:"#stage" }.
      // Returns once the element has upgraded + completed its first Lit update.
      async mount(spec) {
        const stage = document.querySelector(spec.into || "#stage");
        stage.innerHTML = "";
        const el = document.createElement(spec.tag);
        for (const [k, v] of Object.entries(spec.attrs || {})) {
          if (v === true) el.setAttribute(k, "");
          else if (v != null) el.setAttribute(k, String(v));
        }
        if (spec.html) el.innerHTML = spec.html;
        stage.appendChild(el);
        await customElements.whenDefined(spec.tag);
        // wait for Lit's first render to settle
        if (el.updateComplete) { try { await el.updateComplete; } catch {} }
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        return true;
      },
      // Sweep the shadow tree's paint-relevant computed styles. Returns a list of
      // { sel, prop, value } for every shadow node + the host.
      sweepStyles(tag, props) {
        const el = document.querySelector("#stage " + tag) || document.querySelector(tag);
        if (!el) return { error: "no element" };
        const PAINT = props || [
          "color", "background-color", "border-top-color", "border-bottom-color",
          "border-left-color", "border-right-color", "outline-color", "fill", "stroke",
          "box-shadow",
        ];
        const out = [];
        const visit = (node, path) => {
          if (node.nodeType !== 1) return;
          const cs = getComputedStyle(node);
          const rec = { sel: path };
          for (const p of PAINT) rec[p] = cs.getPropertyValue(p).trim();
          out.push(rec);
          // descend into light children + shadow root
          const kids = [...node.children];
          kids.forEach((c, i) => visit(c, path + ">" + c.tagName.toLowerCase() + ":" + i));
          if (node.shadowRoot) {
            [...node.shadowRoot.children].forEach((c, i) =>
              visit(c, path + "::shadow>" + c.tagName.toLowerCase() + ":" + i));
          }
        };
        visit(el, tag);
        return { records: out };
      },
      // Install a faithful offline Observable Plot shim as window.__WB_PLOT__ so
      // the powered tier's BINDING path runs without a CDN (the parity gate reads
      // the datum Plot binds onto each mark). Real Plot rendering is proven in the
      // browser demo step — here we verify only that the tier hands Plot the SAME
      // logical model the floor computed (same series/points/domain/labels).
      installPlotShim() {
        if (window.__WB_PLOT__) return;
        const NS = "http://www.w3.org/2000/svg";
        const dataMark = (data, tag) => ({ __mark: true, data, tag });
        const Plot = {
          frame: () => ({ __mark: true, data: [], tag: "rect", frame: true }),
          gridY: () => ({ __mark: true, data: [], tag: "line", grid: true }),
          ruleY: () => ({ __mark: true, data: [], tag: "line", rule: true }),
          barY: (data) => dataMark(data, "rect"),
          line: (data) => dataMark(data, "path"),
          areaY: (data) => dataMark(data, "path"),
          dot: (data) => dataMark(data, "circle"),
          text: () => ({ __mark: true, data: [], tag: "text" }),
          plot(spec) {
            const W = spec.width || 320, H = spec.height || 300;
            const fig = document.createElement("figure");
            fig.style.margin = "0";
            // Plot writes a scoped <style> INSIDE the figure — mirror that so the
            // scope gate sees the same shape (no document.head pollution).
            const st = document.createElement("style");
            st.textContent = ".plot-shim{}"; // inert, scoped within the figure subtree
            fig.appendChild(st);
            const svg = document.createElementNS(NS, "svg");
            svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
            svg.setAttribute("width", "100%");
            for (const m of (spec.marks || [])) {
              if (!m || !m.__mark) continue;
              // a line/area mark binds ONE datum per series point — explode it so the
              // bound-datum count matches the floor's point count.
              for (const d of (m.data || [])) {
                const node = document.createElementNS(NS, m.tag === "path" ? "circle" : m.tag);
                node.setAttribute("data-mark", "");
                node.setAttribute("fill", "currentColor");
                node.__data__ = d; // the bound datum the parity gate reads
                svg.appendChild(node);
              }
            }
            fig.appendChild(svg);
            return fig;
          },
        };
        window.__WB_PLOT__ = Plot;
      },
      // Install a faithful offline MiniSearch shim as window.__WB_MINISEARCH__ so the
      // search powered tier's build+search path runs without a CDN. The parity gate
      // proves RECALL ⊇ the floor LIKE set — so the shim must, at minimum, match every
      // substring the floor LIKE would (token prefix + whole-field substring), in
      // descending-score order. Real MiniSearch ranking/typo-tolerance is proven in
      // the browser demo step; here we verify the tier hands MiniSearch the SAME
      // source rows and returns at least the floor's matches.
      installMiniSearchShim() {
        if (window.__WB_MINISEARCH__) return;
        class MiniSearchShim {
          constructor(opts) { this._fields = (opts && opts.fields) || []; this._docs = []; }
          addAll(docs) { for (const d of docs) this._docs.push(d); }
          add(doc) { this._docs.push(doc); }
          search(query) {
            const q = String(query || "").trim().toLowerCase();
            if (!q) return this._docs.map((d) => ({ id: d._id, score: 1 }));
            const terms = q.split(/\s+/).filter(Boolean);
            const out = [];
            for (const d of this._docs) {
              let score = 0;
              for (const f of this._fields) {
                const val = String(d[f] == null ? "" : d[f]).toLowerCase();
                for (const t of terms) {
                  // whole-field substring (covers the floor LIKE) + per-token prefix.
                  if (val.includes(t)) score += 10;
                  for (const w of val.split(/\s+/)) if (w.startsWith(t)) score += 5;
                }
              }
              if (score > 0) out.push({ id: d._id, score });
            }
            out.sort((a, b) => b.score - a.score);
            return out;
          }
        }
        window.__WB_MINISEARCH__ = MiniSearchShim;
      },
      // Install a faithful offline MapLibre GL shim as window.__WB_MAPLIBRE__ so the
      // <work-map> powered tier's BINDING path runs without a CDN/WebGL. The parity
      // gate reads the GeoJSON the tier hands the `wb-data` source — so the shim is a
      // no-canvas Map that RECORDS every source's data onto window.__WB_MAP_BOUND__
      // and fires `load` synchronously (so addDataLayers + the binding run). Real
      // MapLibre rendering is proven in the browser demo step; here we verify only
      // that the tier binds the SAME features the floor projected.
      installMaplibreShim() {
        if (window.__WB_MAPLIBRE__) return;
        window.__WB_MAP_BOUND__ = null;
        class MapShim {
          constructor(opts) {
            this._opts = opts || {};
            this._sources = {};
            this._layers = {};
            this._handlers = {};
            this._loaded = false;
            // a minimal canvas stand-in for cursor styling + size reads
            this._canvas = document.createElement("canvas");
            if (opts && opts.container) opts.container.appendChild(this._canvas);
            // fire `load` on the next microtask, mirroring MapLibre's async style load
            queueMicrotask(() => { this._loaded = true; this._fire("load"); });
          }
          _fire(ev, arg) { for (const h of (this._handlers[ev] || [])) h(arg); }
          on(ev, layerOrCb, cb) {
            const fn = cb || layerOrCb;
            (this._handlers[ev] = this._handlers[ev] || []).push(fn);
            return this;
          }
          once(ev, cb) {
            const wrap = (a) => { cb(a); this._handlers[ev] = (this._handlers[ev] || []).filter((h) => h !== wrap); };
            return this.on(ev, wrap);
          }
          loaded() { return this._loaded; }
          isStyleLoaded() { return this._loaded; }
          resize() {}
          getCanvas() { return this._canvas; }
          addSource(id, src) {
            this._sources[id] = src;
            if (id === "wb-data") window.__WB_MAP_BOUND__ = src.data; // the bound GeoJSON
          }
          getSource(id) {
            const self = this;
            return this._sources[id]
              ? { setData(data) { self._sources[id].data = data; if (id === "wb-data") window.__WB_MAP_BOUND__ = data; } }
              : null;
          }
          addLayer(layer) { this._layers[layer.id] = layer; }
          removeLayer(id) { delete this._layers[id]; }
          getLayer(id) { return this._layers[id]; }
          setPaintProperty() {}
          setStyle() { queueMicrotask(() => this._fire("styledata")); }
          fitBounds() {}
          remove() { try { this._canvas.remove(); } catch {} }
        }
        window.__WB_MAPLIBRE__ = { Map: MapShim };
      },
      // Install a faithful offline CodeMirror 6 shim as window.__WB_CODEMIRROR__ so the
      // <work-editor> powered tier's mount/getValue/setValue/change path runs without a
      // CDN. The shim is shaped EXACTLY like the namespace codemirror-tier.js consumes
      // (createEditorView): an EditorView holding a doc string, a dispatch that applies
      // `changes` + fires the updateListener (so work-code-change emits), Compartments
      // that no-op-reconfigure, and the theme/highlight/state helpers as inert stubs.
      // The parity gate proves the powered tier exposes the SAME value contract the
      // floor does (initial value, edited value, work-code-change.detail.value). Real
      // CM editing/highlighting is proven in the browser demo step.
      installCodeMirrorShim() {
        if (window.__WB_CODEMIRROR__) return;
        const ext = (kind, payload) => ({ __cmExt: kind, payload });
        class Compartment {
          of(e) { return ext("compartment", e); }
          reconfigure(e) { return ext("reconfigure", e); }
        }
        // a Text-like doc: toString() + length, built from a string.
        const mkDoc = (s) => ({ _s: String(s == null ? "" : s), toString() { return this._s; }, get length() { return this._s.length; } });
        const EditorState = {
          create(cfg) { return { doc: mkDoc(cfg && cfg.doc), _ext: (cfg && cfg.extensions) || [] }; },
          tabSize: { of: (n) => ext("tabSize", n) },
          readOnly: { of: (b) => ext("readOnly", b) },
        };
        function collectListeners(extensions) {
          const out = [];
          const walk = (e) => {
            if (!e) return;
            if (Array.isArray(e)) { e.forEach(walk); return; }
            if (e.__cmListener) out.push(e.__cmListener);
            if (e.__cmExt && e.payload) walk(e.payload);
          };
          walk(extensions);
          return out;
        }
        class EditorView {
          constructor(cfg) {
            const state = cfg.state || { doc: mkDoc(""), _ext: [] };
            this._doc = state.doc._s;
            this._listeners = collectListeners(state._ext);
            this.dom = document.createElement("div");
            this.dom.className = "cm-editor";
            if (cfg.parent) cfg.parent.appendChild(this.dom);
            this.dom.textContent = this._doc;
            // expose a minimal `state.doc` read used by getDoc()/setDoc()
            const self = this;
            this.state = { get doc() { return mkDoc(self._doc); } };
          }
          dispatch(tr) {
            if (tr && tr.changes && typeof tr.changes.insert === "string") {
              this._doc = tr.changes.insert;        // full-range replace (work-editor setDoc)
              this.dom.textContent = this._doc;
              const self = this;
              for (const ln of this._listeners)
                ln({ docChanged: true, state: { doc: mkDoc(self._doc) } });
            }
            // effects (compartment reconfigure: lang/readonly/theme) — inert in the shim
          }
          destroy() { try { this.dom.remove(); } catch {} }
        }
        EditorView.updateListener = { of: (fn) => ({ __cmListener: fn }) };
        EditorView.theme = () => ext("theme");
        EditorView.editable = { of: (b) => ext("editable", b) };
        EditorView.lineWrapping = ext("lineWrapping");
        // CM.tags.* — each tag is an opaque token; tags.function()/special() are
        // callables returning a token. A single callable object satisfies both shapes.
        const tagToken = () => ({});
        const tagsProxy = new Proxy(tagToken, { get: () => tagToken });
        window.__WB_CODEMIRROR__ = {
          EditorView,
          EditorState,
          Compartment,
          keymap: { of: (k) => ext("keymap", k) },
          lineNumbers: () => ext("lineNumbers"),
          history: () => ext("history"),
          historyKeymap: [],
          defaultKeymap: [],
          indentWithTab: ext("indentWithTab"),
          HighlightStyle: { define: () => ext("highlightStyle") },
          syntaxHighlighting: () => ext("syntaxHighlighting"),
          indentUnit: { of: (s) => ext("indentUnit", s) },
          tags: tagsProxy,
          langFor: () => Promise.resolve(null),
        };
      },
      // Count nodes in document.head that the element mounting may have injected.
      headRuleSignature() {
        const styles = [...document.head.querySelectorAll("style")];
        return {
          styleCount: styles.length,
          // serialize each <style> so a before/after diff catches global injection
          text: styles.map((s) => s.textContent || "").join("\n---\n"),
        };
      },
    };
  </script>
</body>
</html>
