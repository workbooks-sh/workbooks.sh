<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ADDENDUM — Brand Creator</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Archivo:wght@700;900&display=swap');
:root{
  --paper:#eef1f6; --card:#fff; --line:#d8deea; --line2:#c4ccdc;
  --ink:#1c2b4a; --dim:#7c8aa5; --blue:#3b5998; --blue2:#5872b8; --bluepale:#e9eef9;
  --green:#3fa15f; --greenpale:#e4f4e9; --amber:#d98e04; --amberpale:#fdf3dd; --red:#d0455a;
  --shadow:0 2px 0 var(--line2), 0 6px 16px rgba(28,43,74,.08);
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:#cfd6e2;display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh}
.disp{font-family:'Baloo 2',cursive}
.frame{background:var(--paper);display:flex}

/* ===== left: persistent live logo preview ===== */
.preview{flex:0 0 320px;background:linear-gradient(180deg,#fff,#eaeef6);
  border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  padding:26px 24px 18px}
.preview .eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--dim)}
.logostage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
/* the resolved logo */
.logo{display:flex;align-items:center;justify-content:center;gap:14px}
.logo.stacked{flex-direction:column;gap:12px}
.logo.emblem{flex-direction:column;gap:10px}
.crest{width:120px;height:120px;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 8px 22px rgba(28,43,74,.18);transition:clip-path .2s, border-radius .2s, background .25s}
.crest i{font-size:58px;transition:color .25s}
.logo.horizontal .crest{width:96px;height:96px}.logo.horizontal .crest i{font-size:46px}
.wordmark{font-weight:800;line-height:1;transition:color .25s;max-width:230px;text-align:center;word-break:break-word}
.logo.stacked .wordmark,.logo.emblem .wordmark{font-size:30px}
.logo.horizontal .wordmark{font-size:26px;text-align:left}
.f-fraunces{font-family:'Fraunces',serif}
.f-archivo{font-family:'Archivo',sans-serif;letter-spacing:-1px}
.f-baloo{font-family:'Baloo 2',cursive}
.previewmeta{width:100%;text-align:center;margin-top:8px}
.previewmeta .vname{font-family:'Baloo 2';font-weight:800;font-size:18px}
.previewmeta .vvert{font-size:11px;font-weight:700;color:var(--dim);margin-top:1px}
.palrow{display:flex;gap:6px;justify-content:center;margin-top:12px}
.palrow span{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.06)}
.surprise{margin-top:14px;font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--blue);
  background:var(--card);border:2px solid var(--line2);box-shadow:0 3px 0 var(--line2);
  border-radius:12px;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:7px}
.surprise:active{transform:translateY(2px);box-shadow:none}

/* ===== right: paginated steps ===== */
.steps{flex:1;display:flex;flex-direction:column}
.steptop{padding:22px 28px 0}
.dots{display:flex;gap:7px;margin-bottom:14px}
.dot{height:7px;flex:1;border-radius:4px;background:#dbe1ec;cursor:pointer;transition:background .2s}
.dot.done{background:var(--blue2)}
.dot.active{background:var(--blue)}
.stepnum{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--dim)}
.steptitle{font-family:'Baloo 2';font-size:25px;font-weight:800;margin:2px 0 2px}
.stephint{font-size:12.5px;font-weight:600;color:var(--dim)}
.stepbody{flex:1;overflow-y:auto;padding:16px 28px;scrollbar-width:thin}
/* choice grids */
.grid{display:grid;gap:11px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g6{grid-template-columns:repeat(6,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.opt{background:var(--card);border:2.5px solid var(--line2);border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 8px;box-shadow:0 2px 0 var(--line2);transition:transform .08s,border-color .12s,box-shadow .12s}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.sel{border-color:var(--blue);box-shadow:0 2px 0 var(--blue),0 0 0 3px var(--bluepale)}
.opt i{font-size:26px;color:var(--ink)} .opt.sel i{color:var(--blue)}
.opt .lab{font-size:11px;font-weight:800}
.opt .sub{font-size:9.5px;font-weight:700;color:var(--dim)}
.optsm{padding:12px 4px} .optsm i{font-size:22px}
/* palette swatch option */
.palopt{height:62px;border-radius:14px;cursor:pointer;border:3px solid transparent;position:relative;
  display:flex;overflow:hidden;box-shadow:0 2px 0 var(--line2)}
.palopt.sel{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.palopt div{flex:1}
.palopt .pcheck{position:absolute;top:5px;right:6px;color:#fff;font-size:13px;display:none}
.palopt.sel .pcheck{display:block}
/* icon search */
.suglabel{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--dim);margin-bottom:8px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:2.5px solid var(--line2);
  border-radius:12px;padding:9px 13px;margin:16px 0 12px;box-shadow:0 2px 0 var(--line2)}
.searchbar i{color:var(--dim);font-size:16px}
.searchbar input{flex:1;border:none;outline:none;font-family:'Nunito';font-weight:700;font-size:14px;color:var(--ink);background:none}
#iconresults .opt{padding:9px 4px} #iconresults .opt i{font-size:21px}
.noresults{grid-column:1/-1;text-align:center;color:var(--dim);font-weight:700;font-size:12px;padding:16px}
/* color spinners (slot machine) */
.spinrow{display:flex;gap:18px;justify-content:center;padding-top:6px}
.spincol{display:flex;flex-direction:column;align-items:center;gap:8px}
.spincol .slabel{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--dim)}
.spincol .srole{font-size:9px;font-weight:700;color:var(--blue)}
.spinner{position:relative;width:88px;height:198px;border-radius:18px;background:var(--paper);
  box-shadow:inset 0 2px 6px rgba(28,43,74,.14);overflow:hidden}
.reel{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;
  padding:77px 0;-webkit-overflow-scrolling:touch}
.reel::-webkit-scrollbar{display:none}
.sw{height:44px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.sw div{width:60px;height:34px;border-radius:9px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.07);transition:transform .12s}
.selband{position:absolute;left:6px;right:6px;top:77px;height:44px;border-radius:11px;pointer-events:none;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--bluepale)}
.spinarrows{display:flex;gap:24px}
.spinarrows button{border:none;background:var(--card);box-shadow:0 2px 0 var(--line2);border-radius:8px;
  width:30px;height:24px;cursor:pointer;color:var(--blue);font-size:13px}
.spinarrows button:active{transform:translateY(2px);box-shadow:none}
/* name step */
.namebox{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.namebig{font-family:'Baloo 2';font-weight:800;font-size:34px;text-align:center;color:var(--ink);
  background:var(--card);border:2.5px solid var(--line2);border-radius:14px;padding:14px 22px;
  min-width:300px;text-align:center;box-shadow:var(--shadow)}
.namebig:focus{outline:none;border-color:var(--blue)}
.reroll{font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--blue);background:var(--bluepale);
  border:none;border-radius:11px;padding:9px 16px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.namehint{font-size:11.5px;font-weight:700;color:var(--dim)}
/* sign step */
.signwrap{text-align:center;padding-top:18px}
.signwrap h2{font-family:'Baloo 2';font-size:24px;font-weight:800}
.signwrap p{font-size:13px;font-weight:600;color:var(--dim);margin:8px auto 0;max-width:340px;line-height:1.5}
.signrow{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:12px;font-weight:800}
.signrow span{color:var(--dim)} .signrow b{display:block;font-size:14px;color:var(--ink);margin-top:2px}
/* footer nav */
.nav{flex:none;display:flex;align-items:center;gap:12px;padding:14px 28px;border-top:1px solid var(--line)}
.btn{font-family:'Baloo 2';font-weight:700;font-size:15px;border:none;cursor:pointer;
  padding:12px 26px;border-radius:13px;color:#fff;background:var(--blue);box-shadow:0 3px 0 #2c4170}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2c4170}
.btn.sec{background:var(--card);color:var(--blue);box-shadow:0 3px 0 var(--line2);border:2.5px solid var(--line2)}
.btn.sec:active{box-shadow:0 1px 0 var(--line2)}
.btn.go{background:var(--green);box-shadow:0 3px 0 #2e7847;font-size:17px;padding:13px 30px}
.btn.go:active{box-shadow:0 1px 0 #2e7847}
.nav .spacer{flex:1}
.recipeline{font-size:10px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="device"><div class="frame">

  <!-- persistent live logo preview -->
  <div class="preview">
    <div class="eyebrow">YOUR BRAND</div>

  <!-- paginated steps -->

    <div class="steptop">
      <div class="dots" id="dots"></div>
      <div class="stepnum" id="stepnum">STEP 1 OF 7</div>
      <div class="steptitle" id="steptitle"></div>
      <div class="stephint" id="stephint"></div>

    <div class="stepbody" id="stepbody"></div>
    <div class="nav">
      <button class="btn sec" id="backbtn" onclick="go(-1)">Back</button>
      <span class="recipeline" id="recipeline"></span>
      <span class="spacer"></span>
      <button class="btn" id="nextbtn" onclick="go(1)">Next</button>
    </div>
  </div>

</div></div>

  home:{noun:["Nest","Hollow","Abode","Vessel","Nook","Haven","Roost","Clay","Slate","Terra","Hue","Birch","Ash","Willow","Alcove","Bough"],adj:["Cozy","Warm","Snug","Plain","Quiet","Homespun"]},
  pet:{noun:["Paw","Trot","Romp","Pounce","Snout","Whisker","Tail","Kibble","Den","Pack","Howl","Purr","Nuzzle","Scout","Burrow","Biscuit"],adj:["Good","Happy","Loyal","Scruffy","Furry","Frisky"]},
  snacks:{noun:["Crunch","Munch","Snap","Nibble","Crumb","Bite","Pop","Cluster","Batch","Morsel","Crackle","Chomp","Brittle","Nugget","Toasty","Drizzle"],adj:["Crispy","Salty","Sweet","Tangy","Toasted","Bold"]}
};
const ABS=["Theory","Studio","Works","House","Method","Club"], FORM=["Co.","Goods","Supply","Society"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function genName(v){const b=BANKS[v];const p=Math.random();
  if(p<.25){let a=rnd(b.noun),c=rnd(b.noun);while(c===a)c=rnd(b.noun);return a+" & "+c;}
  if(p<.5)return rnd(b.noun)+" "+rnd(ABS); if(p<.7)return rnd(b.adj)+" "+rnd(b.noun);
  if(p<.85)return rnd(b.noun)+" "+rnd(FORM); return "The "+rnd(b.noun)+" "+rnd(FORM);}

/* ===== state (the recipe + identity) ===== */
let R = { vertical:"cookware", name:"Hearth & Hew", glyph:"whisk", container:"squircle", c1:49, c2:69, c3:48, font:"fraunces", layout:"stacked" };
let step = 0;
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
const glyphsFor = v => GLYPHS.filter(g=>g.v===v||g.v==="universal");
const glyphIc = id => "ph-fill ph-"+id;

/* ===== live logo render (mirrors Logo.resolve) ===== */
const col = i => rgb(COLORS[i-1]);  // 1-based recipe color id
function renderLogo(){
  const logo = document.getElementById('logo');
  logo.className = "logo "+R.layout;
  const fontcls = FONTS.find(f=>f.id===R.font).cls;
  logo.innerHTML =
    `<div class="crest" style="border-radius:28%;background:${col(R.c1)}"><i class="ph-fill ${glyphIc(R.glyph)}" style="color:${col(R.c2)}"></i></div>`+
    `<div class="wordmark ${fontcls}" style="color:${col(R.c3)}">${R.name}</div>`;
  document.getElementById('pvname').textContent = R.name;
  document.getElementById('pvvert').textContent = VERTICALS.find(v=>v.id===R.vertical).label.toLowerCase();
  document.getElementById('palrow').innerHTML = [R.c1,R.c2,R.c3].map(i=>`<span style="background:${col(i)}"></span>`).join('');
  document.getElementById('recipeline').textContent =
    `${R.glyph} · c${R.c1}/${R.c2}/${R.c3} · ${R.font} · ${R.layout}`;
}

/* ===== steps ===== */
const STEPS = [
  {key:"vertical",title:"Pick your industry",hint:"Tap one — we'll spin up a fresh themed brand you can tweak. Tap again to re-roll it.",render:()=>
    `<div class="grid g4">`+VERTICALS.map(v=>
      `<div class="opt ${R.vertical===v.id?'sel':''}" onclick="pickIndustry('${v.id}')">
        <i class="ph-fill ${v.ic}"></i><span class="lab">${v.label}</span><span class="sub">${v.sub}</span></div>`).join('')+`</div>`},
  {key:"name",title:"Name the brand",hint:"Roll one from the grammar, or type your own.",render:()=>
    `<div class="namebox">
      <input class="namebig" id="nameinput" value="${R.name.replace(/"/g,'&quot;')}" oninput="R.name=this.value;renderLogo()" maxlength="22">
      <button class="reroll" onclick="R.name=genName(R.vertical);document.getElementById('nameinput').value=R.name;renderLogo()"><i class="ph-bold ph-arrows-clockwise"></i> Roll a name</button>
      <div class="namehint">Tip: short names read best on a card.</div>
    </div>`},
  {key:"glyph",title:"Choose your mark",hint:"Suggested for your industry, or search the whole icon library.",render:()=>
    `<div class="suglabel">SUGGESTED</div>
     <div class="grid g6">`+glyphsFor(R.vertical).map(id=>
      `<div class="opt optsm ${R.glyph===id?'sel':''}" onclick="pick('glyph','${id}')"><i class="ph-fill ph-${id}"></i></div>`).join('')+`</div>
     <div class="searchbar"><i class="ph-fill ph-magnifying-glass"></i>
       <input id="iconsearch" placeholder="search ${ICONS.length} icons…" oninput="searchIcons(this.value)" value="${iconQuery}">
     </div>
     <div class="grid g6" id="iconresults"></div>`,
   after:()=>searchIcons(iconQuery)},
  {key:"palette",title:"Spin your colors",hint:"Scroll each reel — primary, secondary, tertiary. Or hit Surprise for a curated set.",render:()=>
    `<div class="spinrow">
       ${spinnerHTML('c1','PRIMARY','background')}
       ${spinnerHTML('c2','SECONDARY','mark')}
       ${spinnerHTML('c3','TERTIARY','wordmark')}
     </div>`,
   after:()=>{ ['c1','c2','c3'].forEach(initSpinner); }},
  {key:"font",title:"Set the type",hint:"The wordmark font + how mark and name sit together.",render:()=>
    `<div class="grid g3" style="margin-bottom:16px">`+FONTS.map(f=>
      `<div class="opt ${R.font===f.id?'sel':''}" onclick="pick('font','${f.id}')">
        <span class="${f.cls}" style="font-size:24px;font-weight:800">Ag</span><span class="lab">${f.label}</span></div>`).join('')+`</div>
     <div class="stephint" style="margin:0 0 10px">Arrangement</div>
     <div class="grid g3">`+LAYOUTS.map(l=>
      `<div class="opt ${R.layout===l?'sel':''}" onclick="pick('layout','${l}')">
        <i class="ph-fill ${l==='stacked'?'ph-rows':l==='horizontal'?'ph-columns':'ph-square'}"></i>
        <span class="lab">${l}</span></div>`).join('')+`</div>`},
  {key:"sign",title:"Sign your brand",hint:"This is your studio. The save is named for it.",render:()=>
    `<div class="signwrap">
      <h2>${R.name}</h2>
      <p>A new ${VERTICALS.find(v=>v.id===R.vertical).label.toLowerCase()} brand. Your logo, your colors — from here you'll pick a first product and take your first client.</p>
      <div class="signrow">
        <div><span>INDUSTRY</span><b>${VERTICALS.find(v=>v.id===R.vertical).label}</b></div>
        <div><span>MARK</span><b>${R.glyph}</b></div>
        <div><span>COLORS</span><b>c${R.c1}/${R.c2}/${R.c3}</b></div>
      </div>
    </div>`},
];

/* ===== color spinners ===== */
const SW_H = 44;
function spinnerHTML(field, label, role){
  const sws = COLORS.map((c,i)=>`<div class="sw"><div style="background:rgb(${c[0]},${c[1]},${c[2]})"></div></div>`).join('');
  return `<div class="spincol">
    <div class="slabel">${label}</div><div class="srole">${role}</div>
    <div class="spinner"><div class="reel" id="reel_${field}" data-field="${field}">${sws}</div><div class="selband"></div></div>
    <div class="spinarrows">
      <button onclick="nudge('${field}',-1)"><i class="ph-bold ph-caret-up"></i></button>
      <button onclick="nudge('${field}',1)"><i class="ph-bold ph-caret-down"></i></button></div>
  </div>`;
}
function initSpinner(field){
  const reel = document.getElementById('reel_'+field);
  reel.scrollTop = (R[field]-1)*SW_H;           // center current color
  let t;
  reel.onscroll = ()=>{ clearTimeout(t); t=setTimeout(()=>{
    const idx = Math.round(reel.scrollTop/SW_H)+1;
    if(idx!==R[field]){ R[field]=Math.max(1,Math.min(COLORS.length,idx)); renderLogo(); }
  }, 60); };
}
function nudge(field, d){
  R[field]=Math.max(1,Math.min(COLORS.length,R[field]+d));
  const reel=document.getElementById('reel_'+field);
  reel.scrollTo({top:(R[field]-1)*SW_H, behavior:'smooth'});
  renderLogo();
}

function renderStep(){
  const s = STEPS[step];
  document.getElementById('stepnum').textContent = `STEP ${step+1} OF ${STEPS.length}`;
  document.getElementById('steptitle').textContent = s.title;
  document.getElementById('stephint').textContent = s.hint;
  document.getElementById('stepbody').innerHTML = s.render();
  if(s.after) s.after();
  document.getElementById('dots').innerHTML = STEPS.map((_,i)=>
    `<div class="dot ${i<step?'done':i===step?'active':''}" onclick="jump(${i})"></div>`).join('');
  document.getElementById('backbtn').style.visibility = step===0?'hidden':'visible';
  const nb = document.getElementById('nextbtn');
  if(step===STEPS.length-1){ nb.textContent="Launch Brand 🚀"; nb.className="btn go"; }
  else { nb.textContent="Next"; nb.className="btn"; }
  renderLogo();
}
function pick(field,val){ R[field]=val; renderStep(); }

// picking an industry spins up a fresh themed brand (name + mark + colors)
function pickIndustry(id){
  R.vertical = id;
  R.name = genName(id);
  R.glyph = rnd(glyphsFor(id));
  const trip = rnd(PALETTE_TRIPLETS); R.c1=trip[0]; R.c2=trip[1]; R.c3=trip[2];
  renderStep();
}

// full-library icon search (Suggested stays above; results cap for DOM)
let iconQuery = "";
function searchIcons(q){
  iconQuery = q;
  const el = document.getElementById('iconresults'); if(!el) return;
  const ql = q.trim().toLowerCase();
  const list = (ql ? ICONS.filter(n=>n.includes(ql)) : ICONS);
  const shown = list.slice(0,90);
  el.innerHTML = shown.length
    ? shown.map(n=>`<div class="opt optsm ${R.glyph===n?'sel':''}" onclick="pick('glyph','${n}')" title="${n}"><i class="ph-fill ph-${n}"></i></div>`).join('')
      + (list.length>90?`<div class="noresults">+${list.length-90} more — keep typing to narrow</div>`:'')
    : `<div class="noresults">no icons match “${q}”</div>`;
}
function go(d){
  if(step===STEPS.length-1 && d>0){ launch(); return; }
  step=Math.max(0,Math.min(STEPS.length-1,step+d)); renderStep();
}
function jump(i){ step=i; renderStep(); }
function surprise(){
  R.vertical = rnd(VERTICALS).id;
  R.name = genName(R.vertical);
  R.glyph = rnd(glyphsFor(R.vertical)).id;
  R.container = "squircle";
  const trip = rnd(PALETTE_TRIPLETS);   // curated, contrast-safe color set
  R.c1 = trip[0]; R.c2 = trip[1]; R.c3 = trip[2];
  R.font = rnd(FONTS).id;
  R.layout = rnd(LAYOUTS);
  renderStep();
}
function launch(){
  alert("Brand launched: "+R.name+"\n\nrecipe = "+JSON.stringify(R,null,1)+"\n\n→ next: Product Creator");
}
renderStep();
</script>
