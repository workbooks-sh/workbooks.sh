<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui,sans-serif" font-size="12">
  <style>.b{rx:8;stroke-width:1.5}.t{text-anchor:middle}.lbl{fill:#555;font-size:10px}</style>
  <g class="t">
    <rect class="b" x="30" y="50" width="150" height="46" fill="#E3F2FD" stroke="#42A5F5"/><text x="105" y="78">compile request</text>
    <rect class="b" x="240" y="40" width="190" height="66" fill="#FFF3E0" stroke="#FFA726"/><text x="335" y="64">hash key</text><text x="335" y="80" class="lbl">blake3(source ⊕ lane ⊕</text><text x="335" y="94" class="lbl">toolchain ⊕ flags)</text>
    <polygon points="565,40 645,83 565,126 485,83" fill="#F3E5F5" stroke="#BA68C8"/><text x="565" y="87">in cache?</text>
    <rect class="b" x="710" y="40" width="210" height="72" fill="#E8F5E9" stroke="#66BB6A"/><text x="815" y="66" font-weight="bold">HIT</text><text x="815" y="84" class="lbl">fetch .wasm (egress only,</text><text x="815" y="98" class="lbl">no worker spun)</text>
    <rect class="b" x="490" y="180" width="200" height="72" fill="#FCE4EC" stroke="#EC407A"/><text x="590" y="204" font-weight="bold">MISS</text><text x="590" y="222" class="lbl">dispatch compile job</text><text x="590" y="238" class="lbl">→ build → store + sign</text>
    <rect class="b" x="450" y="300" width="290" height="56" fill="#F3E5F5" stroke="#BA68C8"/><text x="595" y="322" font-weight="bold">provenance gate (write time)</text><text x="595" y="340" class="lbl">decides namespace by SOURCE ORIGIN</text>
    <rect class="b" x="290" y="400" width="220" height="74" fill="#E8F5E9" stroke="#66BB6A"/><text x="400" y="424">Shared package cache</text><text x="400" y="440" class="lbl">public, global</text><text x="400" y="456" class="lbl">public-registry src + hash match</text>
    <rect class="b" x="540" y="400" width="220" height="74" fill="#FFF3E0" stroke="#FFA726"/><text x="650" y="424">Private tenant cache</text><text x="650" y="440" class="lbl">per-nexus · encrypted</text><text x="650" y="456" class="lbl">never cross-tenant dedup</text>
  </g>
  <g class="t">
    <path d="M790 420 a55 18 0 0 0 110 0 v-90 a55 18 0 0 0 -110 0 z" fill="#E1F5FE" stroke="#039BE5"/><path d="M790 330 a55 18 0 0 0 110 0" fill="none" stroke="#039BE5"/>
    <text x="845" y="370">Tigris</text><text x="845" y="386" class="lbl">object storage</text><text x="845" y="400" class="lbl">S3, global</text><text x="845" y="414" class="lbl">cold wasm</text>
    <path d="M40 200 a25 14 0 0 0 320 0 v-50 a25 14 0 0 0 -320 0 z" fill="#EDE7F6" stroke="#7E57C2"/><path d="M40 150 a25 14 0 0 0 320 0" fill="none" stroke="#7E57C2"/>
    <text x="200" y="172">Fly Volumes — block storage (region-pinned, machine-local)</text><text x="200" y="190" class="lbl">tenant SQLite / WB_DATA · baked compiler rootfs</text>
  </g>
  <g fill="none">
    <path d="M180 73 L240 73" stroke="#555"/><path d="M430 73 L485 83" stroke="#555"/>
    <path d="M645 76 L710 76" stroke="#66BB6A"/><text x="676" y="62" class="lbl" text-anchor="middle">yes</text>
    <path d="M565 126 L590 180" stroke="#EC407A"/><text x="600" y="160" class="lbl">no</text>
    <path d="M590 252 L595 300" stroke="#555"/>
    <path d="M540 356 L420 400" stroke="#66BB6A"/><path d="M650 356 L650 400" stroke="#FFA726"/>
    <path d="M510 437 L790 400" stroke="#039BE5" stroke-dasharray="4 3"/><path d="M760 437 L800 410" stroke="#039BE5" stroke-dasharray="4 3"/>
    <path d="M845 330 C 845 200, 880 120, 920 112" stroke="#039BE5" stroke-dasharray="4 3"/>
  </g>
</svg>
