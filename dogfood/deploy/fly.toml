app = "wb-dogfood"
primary_region = "sjc"
[build]
  dockerfile = "Dockerfile"
[env]
  WB_DATA = "/srv/dogfood"
  WB_NEXUS = "dogfood"
  # This nexus is ALSO the control plane (the cloud platform): one nexus = site + control plane.
  # /api/platform is gated by our OWN native session / PAT (Nexus.Auth.Cloud); public surfaces stay open.
  WB_CONTROL_PLANE = "1"
  WB_FLY_ORG = "personal"
  # SIGNUP POSTURE — fail-closed by construction. Because WB_CONTROL_PLANE=1 above, Nexus.Config.signups_open?
  # refuses ALL new-account creation (native /auth/signup AND GitHub-OAuth first-login) whenever no
  # WB_LOGIN_ALLOWLIST is set — so this control plane cannot mint a broker-token-spending org for a stranger
  # even if the allowlist secret is never applied. To OPEN public signup, set WB_LOGIN_OPEN=1 (deliberate).
  # To additionally lock LOGIN to specific accounts, set WB_LOGIN_ALLOWLIST (comma-separated emails) — keep
  # it here in the [env] (emails aren't secrets) so the lock is version-controlled, not an invisible secret:
  #   WB_LOGIN_ALLOWLIST = "you@example.com"
[http_service]
  internal_port = 4000
  force_https = true
  # Keep one machine warm. Scale-to-zero (suspend) was cold-waking on every request → ~0.7-1.1s TTFB,
  # cold-start 500s on hydration, and /tmp wipes. The dashboard is interactive (not just cached reads), so
  # a suspended machine DID block the UI. min_machines_running=1 keeps it hot; idle cost is acceptable.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Deploy-time health gate: a release must answer GET /health 200 before fly cuts traffic to the new
  # machine. A crash-looping boot (e.g. the wb-o5ng Task.start_link/3 acceptor crash) never becomes
  # healthy → fly aborts the release and leaves the prior working version serving, instead of outaging
  # prod. Last-resort guard; CI's build+boot smoke (dogfood-deploy.yml) catches it earlier, pre-deploy.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"
# Persistent volume for the DB ONLY — mounted at the .nexus dir so the workbook tree (baked into the
# image at /srv/dogfood) is untouched while accounts/orgs/workspaces (/.nexus/nexus.db) survive
# restarts. Without this, WB_DATA was ephemeral and the control-plane DB relied entirely on Litestream
# restore — a single empty generation wiped everyone. The volume is the durable floor; Litestream stays
# as off-box backup.
[mounts]
  source = "wb_dogfood_nexus"
  destination = "/srv/dogfood/.nexus"

[[vm]]
  memory = "2048"
  cpu_kind = "shared"
  cpus = 1
