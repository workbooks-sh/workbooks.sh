app = "wb-dogfood"
primary_region = "sjc"
[build]
  dockerfile = "Dockerfile"
[env]
  WB_DATA = "/srv/dogfood"
  WB_NEXUS = "dogfood"
  # This nexus is ALSO the control plane (the cloud platform): one nexus = site + control plane.
  # /api/platform is gated by our OWN native session / PAT (Nexus.Auth.Cloud); public surfaces stay open.
  WB_CONTROL_PLANE = "1"
  WB_FLY_ORG = "personal"
[http_service]
  internal_port = 4000
  force_https = true
  # Auto-stop when idle (we WANT scale-to-zero). The dashboard stays snappy via client-side caching
  # (stale-while-revalidate) — admin pages render last-known data instantly and refresh in the
  # background, so a suspended machine never blocks the UI.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
# Persistent volume for the DB ONLY — mounted at the .nexus dir so the workbook tree (baked into the
# image at /srv/dogfood) is untouched while accounts/orgs/workspaces (/.nexus/nexus.db) survive
# restarts. Without this, WB_DATA was ephemeral and the control-plane DB relied entirely on Litestream
# restore — a single empty generation wiped everyone. The volume is the durable floor; Litestream stays
# as off-box backup.
[mounts]
  source = "wb_dogfood_nexus"
  destination = "/srv/dogfood/.nexus"

[[vm]]
  memory = "2048"
  cpu_kind = "shared"
  cpus = 1
