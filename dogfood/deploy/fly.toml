app = "wb-dogfood"
primary_region = "sjc"
[build]
  dockerfile = "Dockerfile"
[env]
  WB_DATA = "/srv/dogfood"
  WB_NEXUS = "dogfood"
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
[[vm]]
  memory = "1024"
  cpu_kind = "shared"
  cpus = 1
