<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — not found — Workbooks</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f7f6f1; color: #121316; font: 400 14px/1.8 "JetBrains Mono", monospace; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: clamp(56px, 14vw, 120px); margin: 0; letter-spacing: -.02em; }
  p { color: #565b54; max-width: 44ch; margin: 14px auto 26px; }
  a { display: inline-block; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    font-size: 12px; color: #f7f6f1; background: #121316; padding: 11px 18px;
    border-radius: 8px; text-decoration: none; }
  a:hover { background: #13d943; color: #121316; }
</style>
</head>
<body>
<!-- a 404 that is honestly a 404 — no soft redirects, no theater -->
<main>
  <h1>404</h1>
  <p>No file lives at this path. Files that do exist here carry whole
  pieces of software — maybe start with one of those.</p>
  <a href="/">back to the big picture</a>
</main>
</body>
</html>
