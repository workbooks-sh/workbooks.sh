<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>budget — a workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* budget.html — a complete app in one file: editable monthly budget with a
   live burn chart. Data persists in this browser; the file never phones home. */
:root{
  --green:#00ff44; --blue:#0080ff; --rose:#ff0066;
  --bg:#ffffff; --bg2:#f4f4f1; --ink:#1a1a1c; --ink2:#54555c; --ink3:#8a8b92; --hair:#e9e9e4;
  --green-ink:#0a7a2a; --blue-text:#0064d6; --rose-text:#d60055;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e0e10;--bg2:#161619;--ink:#f2f2ef;--ink2:#a9aab1;--ink3:#67686f;--hair:#232328;
    --green-ink:#00ff44;--blue-text:#53a8ff;--rose-text:#ff4d94}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:15px;
  padding:1.6rem;max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.02em}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.4rem}
.left{font-size:.74rem}
.left.ok{color:var(--green-ink)} .left.over{color:var(--rose-text)}
canvas{width:100%;height:120px;margin:.8rem 0 1rem}
.row{display:grid;grid-template-columns:1fr 7rem 2rem;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--hair)}
.row input{border:0;background:transparent;color:var(--ink);font:inherit;outline:none;min-width:0}
.row input.amt{font-family:"Spline Sans Mono",monospace;font-size:.88rem;text-align:right;background:var(--bg2);border-radius:8px;padding:.35rem .6rem}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:1rem;text-align:center}
.del:hover{color:var(--rose)}
.cap{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .2rem;font-size:.8rem;color:var(--ink2)}
.cap input{width:7rem;font-family:"Spline Sans Mono",monospace;font-size:.88rem;text-align:right;
  border:0;background:var(--bg2);color:var(--ink);border-radius:8px;padding:.35rem .6rem;outline:none}
.addrow{margin-top:.8rem}
.addrow button{border:0;background:var(--bg2);color:var(--ink2);font:inherit;font-size:.8rem;padding:.45rem .9rem;border-radius:999px;cursor:pointer}
.addrow button:hover{color:var(--ink)}
.foot{margin-top:1.3rem;font-size:.68rem;color:var(--ink3);text-align:center}
.foot b{color:var(--green-ink);font-weight:500}
</style>
</head>
<body>
<div class="head">
  <h1>June budget</h1>
  <span class="left mono" id="left"></span>
</div>
<div class="cap">monthly cap <input id="cap" inputmode="numeric"> <span class="mono" id="spent"></span></div>
<canvas id="chart" aria-label="spend by line" role="img"></canvas>
<div id="rows"></div>
<div class="addrow"><button id="add" type="button">+ add a line</button></div>
<p class="foot mono">one file · edit anything — it keeps · <b>nothing leaves</b></p>
<script>
const KEY = "wb-budget-v1";
let s = JSON.parse(localStorage.getItem(KEY) || "null") || {
  cap: 2400,
  lines: [
    ["Rent share", 1200], ["Groceries", 410], ["Transit", 86], ["Eating out", 165], ["Tools & subs", 49],
  ],
};
const save = () => localStorage.setItem(KEY, JSON.stringify(s));
const $ = id => document.getElementById(id);
const money = n => "$" + (+n || 0).toLocaleString("en-US");

const COLORS = () => {
  const cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue("--green"), cs.getPropertyValue("--blue"), cs.getPropertyValue("--rose")];
};

function render() {
  $("cap").value = s.cap;
  const total = s.lines.reduce((a, [, v]) => a + (+v || 0), 0);
  const left = s.cap - total;
  $("spent").textContent = `· ${money(total)} spent`;
  const leftEl = $("left");
  leftEl.textContent = left >= 0 ? `${money(left)} left` : `${money(-left)} over`;
  leftEl.className = "left mono " + (left >= 0 ? "ok" : "over");

  $("rows").innerHTML = s.lines.map(([n, v], i) => `
    <div class="row">
      <input value="${String(n).replace(/"/g, "&quot;")}" data-n="${i}" aria-label="name">
      <input class="amt" value="${v}" data-v="${i}" inputmode="numeric" aria-label="amount">
      <button class="del" data-del="${i}" aria-label="delete">×</button>
    </div>`).join("");

  // burn chart: stacked bar of lines vs cap
  const c = $("chart"), dpr = Math.min(2, devicePixelRatio || 1);
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = 120 * dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = 120, bh = 34, y = 28;
  const cs = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = cs.getPropertyValue("--bg2");
  ctx.beginPath(); ctx.roundRect(0, y, W, bh, 9); ctx.fill();
  const scale = W / Math.max(s.cap, total, 1);
  let x = 0;
  const pal = COLORS();
  s.lines.forEach(([, v], i) => {
    const w = (+v || 0) * scale;
    ctx.fillStyle = pal[i % pal.length];
    ctx.beginPath(); ctx.roundRect(x, y, Math.max(w, 0), bh, x === 0 ? 9 : 0); ctx.fill();
    x += w;
  });
  // cap marker
  const capX = s.cap * scale;
  ctx.strokeStyle = cs.getPropertyValue("--ink");
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(capX, y - 12); ctx.lineTo(capX, y + bh + 12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = "11px 'Spline Sans Mono', monospace";
  ctx.fillStyle = cs.getPropertyValue("--ink3");
  ctx.textAlign = capX > W - 60 ? "right" : "left";
  ctx.fillText("cap " + money(s.cap), capX + (capX > W - 60 ? -6 : 6), y - 16);
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "cap") { s.cap = +t.value || 0; save(); render(); }
  if (t.dataset.n !== undefined) { s.lines[+t.dataset.n][0] = t.value; save(); }
  if (t.dataset.v !== undefined) { s.lines[+t.dataset.v][1] = +t.value || 0; save(); render(); }
});
document.addEventListener("click", e => {
  const d = e.target.closest(".del");
  if (d) { s.lines.splice(+d.dataset.del, 1); save(); render(); }
  if (e.target.id === "add") { s.lines.push(["New line", 0]); save(); render(); }
});
addEventListener("resize", render);
render();
</script>
</body>
</html>
