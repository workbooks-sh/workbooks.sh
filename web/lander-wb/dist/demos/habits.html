<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>habits — a workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* habits.html — a complete app in one file. Your data stays in this browser
   (localStorage); the file itself never phones home. */
:root{
  --green:#00ff44; --blue:#0080ff; --rose:#ff0066;
  --bg:#ffffff; --bg2:#f4f4f1; --ink:#1a1a1c; --ink2:#54555c; --ink3:#8a8b92; --hair:#e9e9e4;
  --green-ink:#0a7a2a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e0e10;--bg2:#161619;--ink:#f2f2ef;--ink2:#a9aab1;--ink3:#67686f;--hair:#232328;--green-ink:#00ff44}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:15px;
  padding:1.6rem;max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.02em}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}
.streak{font-size:.74rem;color:var(--green-ink)}
.add{display:flex;gap:.5rem;margin-bottom:1.2rem}
.add input{flex:1;border:0;background:var(--bg2);color:var(--ink);font:inherit;padding:.6rem .9rem;border-radius:999px;outline:none}
.add input::placeholder{color:var(--ink3)}
.add button{border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;padding:.6rem 1.1rem;border-radius:999px;cursor:pointer}
.days{display:grid;grid-template-columns:1fr repeat(7,2rem) 2.2rem;gap:.3rem;align-items:center;
  font-size:.66rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.days span{text-align:center}
.habit{display:grid;grid-template-columns:1fr repeat(7,2rem) 2.2rem;gap:.3rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--hair)}
.habit .name{font-weight:600;font-size:.95rem}
.cell{width:1.7rem;height:1.7rem;border-radius:7px;background:var(--bg2);border:0;cursor:pointer;margin:0 auto;transition:transform .1s}
.cell:hover{transform:scale(1.12)}
.cell.on{background:var(--green)}
.cell.today{outline:2px solid var(--blue);outline-offset:1px}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:1rem}
.del:hover{color:var(--rose)}
.empty{color:var(--ink3);text-align:center;padding:2rem 0;font-size:.9rem}
.foot{margin-top:1.4rem;font-size:.68rem;color:var(--ink3);text-align:center}
.foot b{color:var(--green-ink);font-weight:500}
</style>
</head>
<body>
<div class="head">
  <h1>Habits</h1>
  <span class="streak mono" id="streak"></span>
</div>
<form class="add" id="add">
  <input id="name" placeholder="New habit — e.g. read 20 minutes" aria-label="New habit" maxlength="40">
  <button>Add</button>
</form>
<div class="days mono" id="dayhead"></div>
<div id="rows"></div>
<p class="foot mono">one file · data stays on this device · <b>nothing leaves</b></p>
<script>
const KEY = "wb-habits-v1";
const DAY = 86400000;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const days = [...Array(7)].map((_, i) => today() - (6 - i) * DAY);
const fmt = ts => new Date(ts).toLocaleDateString(undefined, { weekday: "narrow" });

let state = JSON.parse(localStorage.getItem(KEY) || "null") || {
  habits: [
    { name: "Read 20 minutes", done: [today()-DAY*2, today()-DAY] },
    { name: "Go outside", done: [today()-DAY*3, today()-DAY*2, today()-DAY] },
  ]
};
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

const dayhead = document.getElementById("dayhead");
dayhead.innerHTML = `<span></span>` + days.map(d => `<span>${fmt(d)}</span>`).join("") + `<span></span>`;

const rows = document.getElementById("rows");
function render() {
  if (!state.habits.length) { rows.innerHTML = `<p class="empty">No habits yet — add one above.</p>`; return; }
  rows.innerHTML = state.habits.map((h, hi) => `
    <div class="habit">
      <span class="name">${h.name.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</span>
      ${days.map(d => `<button class="cell ${h.done.includes(d) ? "on" : ""} ${d === today() ? "today" : ""}" data-h="${hi}" data-d="${d}" aria-label="toggle"></button>`).join("")}
      <button class="del" data-del="${hi}" aria-label="delete">×</button>
    </div>`).join("");
  const doneToday = state.habits.filter(h => h.done.includes(today())).length;
  document.getElementById("streak").textContent = `${doneToday}/${state.habits.length} today`;
}
rows.addEventListener("click", e => {
  const c = e.target.closest(".cell");
  if (c) {
    const h = state.habits[+c.dataset.h], d = +c.dataset.d;
    h.done.includes(d) ? h.done = h.done.filter(x => x !== d) : h.done.push(d);
    save(); render(); return;
  }
  const del = e.target.closest(".del");
  if (del) { state.habits.splice(+del.dataset.del, 1); save(); render(); }
});
document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("name").value.trim();
  if (!v) return;
  state.habits.push({ name: v, done: [] });
  document.getElementById("name").value = "";
  save(); render();
});
render();
</script>
</body>
</html>
