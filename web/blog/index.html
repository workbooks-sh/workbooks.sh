<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Blog","name":"Workbooks Blog","description":"Field notes from Workbooks — the thesis, the runtime, and the case for software you can hold.","url":"https://workbooks.sh/blog","inLanguage":"en","publisher":{"@type":"Organization","name":"Workbooks","url":"https://workbooks.sh","logo":{"@type":"ImageObject","url":"https://workbooks.sh/apple-touch-icon.png"}}}
</script>
<style>
  @font-face { font-family: "Groothan"; src: url("/fonts/GroothanMixed-Regular.woff2") format("woff2"), url("/fonts/GroothanMixed-Regular.woff") format("woff"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Groothan"; src: url("/fonts/GroothanMixed-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }

  :root {
    --paper: #f7f6f1;
    --card: #fff;
    --ink: #121316;
    --bloom: #13d943;       /* the one accent */
    --bloom-d: #149157;
    --dim: #565b54;
    --line: #e7e5db;
    --display: "Groothan", "Anton", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-width: thin; scrollbar-color: #565b54 transparent; }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background-image: repeating-linear-gradient(180deg, rgba(86,91,84,.4) 0 4px, transparent 4px 9px); background-size: 2px 100%; background-position: center; background-repeat: no-repeat; }
  ::-webkit-scrollbar-thumb { background-color: #565b54; background-clip: padding-box; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; }

  body { background: var(--paper); color: var(--ink); font-family: var(--mono); -webkit-font-smoothing: antialiased; min-height: 100vh; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 150px 24px 120px; }

  /* ── masthead ── */
  .head { margin-bottom: 54px; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .kicker b { color: var(--bloom-d); }
  h1.title { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 8vw, 92px); line-height: .92; letter-spacing: .01em; }
  .lede { margin-top: 22px; max-width: 56ch; font-size: 13.5px; line-height: 1.85; color: var(--dim); }
  .lede b { color: var(--ink); font-weight: 700; }

  /* ── controls ── */
  .controls { display: flex; align-items: center; gap: 14px; margin: 44px 0 6px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--dim); pointer-events: none; }
  .search input {
    width: 100%; font: 400 13px var(--mono); color: var(--ink);
    background: var(--card); border: 2px solid var(--ink); border-radius: 10px;
    padding: 13px 16px 13px 44px; outline: none; box-shadow: 4px 4px 0 var(--ink);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .search input::placeholder { color: #9aa094; }
  .search input:focus { box-shadow: 4px 4px 0 var(--bloom-d); }
  .count { font-size: 11px; letter-spacing: .04em; color: var(--dim); white-space: nowrap; }
  .count b { color: var(--ink); }

  .tags { display: flex; gap: 8px; margin: 20px 0 8px; flex-wrap: wrap; }
  .tags button {
    font: 700 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); background: var(--card); border: 1.5px solid var(--ink);
    border-radius: 6px; padding: 6px 11px; cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .tags button:hover { background: rgba(18,19,22,.06); }
  .tags button.on { background: var(--ink); color: var(--paper); }

  /* ── post list ── */
  .feed { list-style: none; margin-top: 28px; }
  .feed li { border-top: 1.5px solid var(--line); }
  .feed li:last-child { border-bottom: 1.5px solid var(--line); }

  .post { display: grid; grid-template-columns: 130px 1fr; gap: 28px; padding: 32px 6px; text-decoration: none; color: inherit; align-items: start; transition: padding-left .18s ease; }
  .post:hover { padding-left: 18px; }
  .post .meta { font-size: 10.5px; letter-spacing: .04em; color: var(--dim); line-height: 1.9; padding-top: 6px; }
  .post .meta time { display: block; color: var(--ink); font-weight: 700; }
  .post .meta .mins { display: block; }
  .post .body h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.4vw, 33px); line-height: 1.04; letter-spacing: .01em; transition: color .15s ease; }
  .post:hover .body h2 { color: var(--bloom-d); }
  .post .body p { margin-top: 12px; font-size: 13px; line-height: 1.8; color: var(--dim); max-width: 64ch; }
  .post .body .row { margin-top: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .post .body .chip { font: 700 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border: 1.5px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  .post .body .arr { margin-left: auto; font: 700 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); opacity: 0; transition: opacity .15s ease; }
  .post:hover .body .arr { opacity: 1; color: var(--bloom-d); }

  .empty { padding: 60px 6px; text-align: center; color: var(--dim); font-size: 13px; }
  .empty b { color: var(--ink); }

  .skel { padding: 32px 6px; border-top: 1.5px solid var(--line); }
  .skel div { height: 22px; background: linear-gradient(90deg, #ece9df 25%, #f3f1e8 50%, #ece9df 75%); background-size: 200% 100%; border-radius: 6px; animation: sh 1.3s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  @media (max-width: 640px) {
    .wrap { padding: 120px 18px 90px; }
    .post { grid-template-columns: 1fr; gap: 10px; }
    .post .meta { padding-top: 0; display: flex; gap: 14px; }
    .post .meta time, .post .meta .mins { display: inline; }
    .post:hover { padding-left: 6px; }
  }
</style>
</head>
<body>

<div id="site-nav"></div>
<script src="/nav.js?v=12"></script>

<main class="wrap">
  <header class="head">
    <p class="kicker">field notes <b>■</b> workbooks</p>
    <h1 class="title">The blog</h1>
    <p class="lede">
      The <b>thesis</b>, the runtime, and the case for software you can hold —
      written long-form, by the people building it.
    </p>
  </header>

  <section aria-label="Browse posts">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M21 21l-5.2-5.2"/></svg>
        <input id="q" type="search" placeholder="Search posts…" autocomplete="off" aria-label="Search posts">
      </label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>

    <ol class="feed" id="feed">
      <li class="skel"><div style="width:60%"></div></li>
      <li class="skel"><div style="width:48%"></div></li>
      <li class="skel"><div style="width:54%"></div></li>
    </ol>
  </section>
</main>

<script>
(function () {
  var feed = document.getElementById("feed");
  var qbox = document.getElementById("q");
  var tagbox = document.getElementById("tags");
  var countEl = document.getElementById("count");
  var POSTS = [];
  var activeTag = null;

  var DTF = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "short", day: "numeric" });
  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00");
    return isNaN(d) ? iso : DTF.format(d);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function card(p) {
    var chips = (p.tags || []).map(function (t) {
      return '<span class="chip">' + esc(t) + "</span>";
    }).join("");
    return (
      '<li><a class="post" href="/blog/' + esc(p.slug) + '">' +
        '<div class="meta">' +
          '<time datetime="' + esc(p.date) + '">' + fmtDate(p.date) + "</time>" +
          '<span class="mins">' + (p.mins || "—") + " min read</span>" +
        "</div>" +
        '<div class="body">' +
          "<h2>" + esc(p.title) + "</h2>" +
          "<p>" + esc(p.dek || "") + "</p>" +
          '<div class="row">' + chips + '<span class="arr">read →</span></div>' +
        "</div>" +
      "</a></li>"
    );
  }

  function render() {
    var q = qbox.value.trim().toLowerCase();
    var list = POSTS.filter(function (p) {
      if (activeTag && (p.tags || []).indexOf(activeTag) === -1) return false;
      if (!q) return true;
      var hay = (p.title + " " + (p.dek || "") + " " + (p.tags || []).join(" ")).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    feed.innerHTML = list.length
      ? list.map(card).join("")
      : '<li class="empty">No posts match <b>' + esc(q || activeTag) + "</b>.</li>";
    countEl.innerHTML = "<b>" + list.length + "</b> " + (list.length === 1 ? "post" : "posts");
  }

  function buildTags() {
    var seen = {};
    POSTS.forEach(function (p) { (p.tags || []).forEach(function (t) { seen[t] = (seen[t] || 0) + 1; }); });
    var names = Object.keys(seen).sort();
    var html = '<button data-tag="" class="on">All</button>';
    html += names.map(function (t) { return '<button data-tag="' + esc(t) + '">' + esc(t) + "</button>"; }).join("");
    tagbox.innerHTML = html;
    tagbox.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        activeTag = b.dataset.tag || null;
        tagbox.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
        render();
      });
    });
  }

  qbox.addEventListener("input", render);

  fetch("/blog/posts.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      POSTS = (data || []).slice().sort(function (a, b) { return (a.date < b.date) ? 1 : -1; });
      buildTags();
      render();
    })
    .catch(function () {
      feed.innerHTML = '<li class="empty">Posts are warming up. <b>Check back soon.</b></li>';
      countEl.textContent = "";
    });
})();
</script>
</body>
</html>
