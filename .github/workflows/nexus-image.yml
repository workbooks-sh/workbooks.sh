# Publish the nexus runtime image to ghcr — MULTI-ARCH, built per-arch on NATIVE runners.
#
# Replaces the old runtime-image workflow: the engine is now `nexus/` (the old runtime/ is deleted),
# self-contained (vendor/wasmex + compilers-dist + build/tools all under nexus/). Each arch builds on
# its own native runner (no QEMU) and pushes BY DIGEST; a merge job assembles the multi-arch manifest.
#
# Two staged inputs the build context needs that AREN'T in git:
#   - the toolchain REACTOR (priv/work-toolchain.wasm) — built here via zig + stage-reactor.sh.
#   - the in-sandbox COMPILERS — pulled from the standalone compilers LAYER (`COPY --from=compilers`),
#     published ONCE from a provisioned machine (the 7.2G wasm toolchain; CI never rebuilds it).
name: nexus-image

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - "reactor/**"
      - "ci/Dockerfile.compilers"
      - ".github/workflows/nexus-image.yml"
  workflow_dispatch:

concurrency:
  group: nexus-image-${{ github.ref }}
  cancel-in-progress: false # QUEUE: let one build advance :latest before the next starts

env:
  IMAGE: ghcr.io/workbooks-sh/runtime # the deployed-engine artifact name stays stable; source is nexus/
  COMPILERS_REF: ghcr.io/workbooks-sh/compilers:latest

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # native amd64
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm # native arm64 (mac-first local krunvm)
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Stage the toolchain reactor (priv/work-toolchain.wasm)
        run: nexus/scripts/stage-reactor.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.platform }} by digest
        run: |
          set -euo pipefail
          docker buildx build -f nexus/Dockerfile \
            --platform "${{ matrix.platform }}" \
            --build-arg "COMPILERS_REF=${COMPILERS_REF}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json .
          digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble + push multi-arch manifest
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${sha}" \
            $(printf "${IMAGE}@sha256:%s " *)
          echo "=== published ${IMAGE}:latest (+ ${sha}) ==="
          docker buildx imagetools inspect "${IMAGE}:latest"

      # Boot the just-published image and confirm it actually SERVES — catches release-packaging bugs
      # (e.g. a dep excluded from `mix release`) that compile + test green but 500 in prod. The jason
      # bug (optional-transitive dep dropped from the release → every JSON endpoint 500'd) shipped a
      # broken image precisely because nothing booted it before deploy. Now CI does.
      - name: Smoke-test — the image boots and serves /health
        run: |
          set -euo pipefail
          docker run -d --name nexus-smoke -e WB_SERVE=1 -e PORT=4000 -e WB_DATA=/tmp \
            -p 4000:4000 "${IMAGE}:latest"
          ok=0
          for i in $(seq 1 40); do
            body="$(curl -sf http://127.0.0.1:4000/health || true)"
            if echo "$body" | grep -q '"service":"nexus"'; then
              echo "✓ image serves a valid nexus /health: $body"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "✗ image did not serve a valid nexus /health within 80s — release is broken"
            docker logs nexus-smoke 2>&1 | tail -40
            docker rm -f nexus-smoke; exit 1
          fi
          docker rm -f nexus-smoke
