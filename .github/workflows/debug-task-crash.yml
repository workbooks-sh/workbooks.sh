name: debug-task-crash

# THROWAWAY forensic workflow for bd wb-o5ng — reproduce the prod boot crash
# (Task.start_link/3 undefined at the ThousandIsland acceptor) in a clean amd64
# OTP-27 env that matches prod, and dump the decisive forensics. Delete after.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/debug-task-crash.yml"]

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.19.5"

      - name: Rust (wasmex NIF)
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal

      - name: Build the prod release (mirror dogfood/deploy/Dockerfile)
        working-directory: nexus
        env:
          MIX_ENV: prod
        run: |
          source "$HOME/.cargo/env"
          elixir --version
          mix local.hex --force && mix local.rebar --force
          mix deps.get --only prod
          mix deps.compile
          mix compile
          mix release nexus

      - name: "FORENSIC 1 — Elixir.Task.beam in the release (exports + which)"
        working-directory: nexus
        run: |
          REL=_build/prod/rel/nexus
          echo "## erts/elixir in release"; cat $REL/releases/start_erl.data; ls $REL/lib | grep -E "elixir|stdlib|kernel"
          echo "## all Elixir.Task*.beam in the release tree:"; find $REL -name "Elixir.Task*.beam"
          echo "## Task.beam exports (start_link?):"
          $REL/bin/nexus eval '
            path = :code.which(Task)
            IO.inspect(path, label: :which_task)
            {:ok, {_m, chunks}} = :beam_lib.chunks(path, [:exports])
            sl = chunks[:exports] |> Enum.filter(fn {f,_} -> f == :start_link end)
            IO.inspect(sl, label: :task_beam_exports_start_link)
          ' || true

      - name: "FORENSIC 2 — boot script: is Elixir.Task in primLoad? load mode?"
        working-directory: nexus
        run: |
          S=$(ls _build/prod/rel/nexus/releases/*/start.script | head -1)
          echo "## occurrences of Elixir.Task in start.script:"; grep -nE "'Elixir\\.Task'" "$S" || echo "NOT FOUND in start.script"
          echo "## the load directives that mention it (context):"; grep -nE "primLoad|'Elixir\\.Task'|kernel_load_completed" "$S" | head -20

      - name: "FORENSIC 3 — INTERACTIVE eval: function_exported + start_link/3 call"
        working-directory: nexus
        run: |
          _build/prod/rel/nexus/bin/nexus eval '
            IO.inspect(:code.get_mode(), label: :get_mode_eval)
            IO.inspect(function_exported?(Task, :start_link, 3), label: :exported_3_eval)
            IO.inspect(Task.start_link(:timer, :sleep, [1]), label: :call_3_eval)
          ' || true

      - name: "FORENSIC 4 — EMBEDDED start: the REAL crash + the FULL first error"
        working-directory: nexus
        env:
          WB_DATA: /tmp/wbdata
          WB_NEXUS: dogfood
          WB_CONTROL_PLANE: "1"
          PORT: "4055"
        run: |
          mkdir -p /tmp/wbdata
          echo "## starting the release in EMBEDDED mode (bin/nexus start) — capturing full boot log:"
          set +e
          ( _build/prod/rel/nexus/bin/nexus start > /tmp/boot.log 2>&1 & echo $! > /tmp/pid )
          sleep 20
          kill -9 "$(cat /tmp/pid)" 2>/dev/null
          echo "=================== FULL BOOT LOG ==================="
          cat /tmp/boot.log
          echo "===================================================="
          echo "## did it crash with the Task error?"; grep -c "Task.start_link/3" /tmp/boot.log || true
          echo "## the FIRST error/abort line:"; grep -nE "error|Error|abort|undefined|crash|terminating|Kernel pid terminated" /tmp/boot.log | head -5

      - name: "FORENSIC 5 — embedded: probe Task at the acceptor moment (custom -eval)"
        working-directory: nexus
        run: |
          # Run the release VM in embedded mode WITHOUT the full app, and check whether Task is loaded.
          REL=_build/prod/rel/nexus
          ERTS=$(ls -d $REL/erts-*/bin)
          BOOT=$(ls $REL/releases/*/start | head -1 | sed 's/\.script$//;s/\.boot$//')
          echo "## erts=$ERTS boot=$BOOT"
          "$ERTS/erl" -boot "$REL/releases/0.1.0/start" -mode embedded -noshell \
            -eval 'io:format("get_mode=~p~n",[code:get_mode()]), io:format("task_loaded=~p~n",[code:is_loaded(\x27Elixir.Task\x27)]), io:format("exported3=~p~n",[erlang:function_exported(\x27Elixir.Task\x27, start_link, 3)]), erlang:halt()' \
            -sname dbg 2>&1 | head -20 || true
