# workbooks.sh GitOps spine — push to main touching web/** refreshes the fly
# origin (wb-site), which serves the site through the Cloudflare proxy.
# The Pages static FALLBACK is updated separately via `bash web/publish.sh`
# (local, wrangler OAuth). Epic wb-gnzy.
name: site-publish
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
concurrency:
  group: site-publish
  cancel-in-progress: true
jobs:
  refresh-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Refresh origin from main
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SITE_TOKEN }}
        run: |
          B64=$(base64 -w0 web/deploy/origin-refresh.sh)
          flyctl ssh console -a wb-site -C "sh -c 'echo $B64 | base64 -d | sh'"
      - name: Verify
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" https://wb-site.fly.dev/)
          echo "origin / -> $code"; [ "$code" = "200" ]
