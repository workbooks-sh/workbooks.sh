name: Smoke

on:
  schedule:
    # Nightly at 09:17 UTC (off-the-hour to avoid the API rush).
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: End-to-end smoke against deployed worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANDNANA_BASE_URL: https://brandnana-api.shane-6d4.workers.dev
      BRANDNANA_API_KEY: ${{ secrets.BRANDNANA_SMOKE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require BRANDNANA_SMOKE_KEY
        run: |
          if [ -z "${BRANDNANA_API_KEY}" ]; then
            echo "::error::BRANDNANA_SMOKE_KEY repo secret is not set."
            echo "Mint a key with limited rate_limit_per_min, store as a repo secret."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run smoke
        run: bun run --cwd apps/api smoke
