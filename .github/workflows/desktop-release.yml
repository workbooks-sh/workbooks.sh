# Build the Workbooks desktop app for macOS (arm + intel), Linux, and Windows.
# Two purposes:
#   * CONFIRM cross-platform — if every runner compiles + bundles, it works there.
#   * RELEASE — on a `desktop-v*` tag, publish the bundles to a GitHub Release
#     (the artifacts users download; later the updater reads `latest.json` here).
#
# Unsigned for now (no signing certs wired). Auto-update (tauri-plugin-updater +
# an updater keypair secret) layers on once platforms-to-ship are decided.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch: # manual: build all platforms to verify cross-platform

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # create the release + upload bundles
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build deps (webkit2gtk, tray, appimage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend deps
        working-directory: desktop
        run: bun install

      - name: Build + bundle (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # On a tag → create/append a GitHub Release with the bundles.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Workbooks Desktop __VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      # Manual (non-tag) runs: upload the bundles as artifacts so each platform's
      # build is downloadable + testable.
      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: workbooks-${{ matrix.platform }}-${{ matrix.target }}
          path: desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: ignore
