# Build the Workbooks desktop app for macOS (arm + intel), Linux, and Windows.
# Two purposes:
#   * CONFIRM cross-platform — if every runner compiles + bundles, it works there.
#   * RELEASE — on a `desktop-v*` tag, publish the bundles to a GitHub Release
#     (the artifacts users download; later the updater reads `latest.json` here).
#
# Unsigned for now (no signing certs wired). Auto-update (tauri-plugin-updater +
# an updater keypair secret) layers on once platforms-to-ship are decided.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch: # manual: build all platforms to verify cross-platform

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialize the matrix: every platform's tauri-action upload does a
      # read-modify-write on the SAME `latest.json` asset of the one draft
      # release. Run concurrently, two jobs race the delete-then-recreate and
      # the loser gets `404 Not Found - update-a-release-asset` (and the merged
      # manifest loses platforms). One-at-a-time → each job appends to the prior
      # job's latest.json, so the final manifest carries all four targets.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # create the release + upload bundles
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build deps (webkit2gtk, tray, appimage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend deps
        working-directory: desktop
        run: bun install

      - name: Build + bundle (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-updater signing (minisign) — the key matching the pubkey committed in
          # tauri.conf.json. Because tauri.conf.json sets createUpdaterArtifacts:true, a build
          # REQUIRES this key — so verify (non-tag) runs disable updater artifacts via the
          # tauri.verify.conf.json override below (see `args`), and only tag releases sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization. macOS bundles only — ignored on linux/windows. When
          # unset the mac build is unsigned (Gatekeeper warns); set them for a real release.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          # --target on mac (arm/intel split). On NON-tag verify runs, also merge
          # tauri.verify.conf.json to turn OFF updater artifacts — otherwise the
          # build demands the signing key (createUpdaterArtifacts:true) and a
          # secret-less verify run would fail. Tag releases omit it → sign normally.
          args: >-
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            ${{ !startsWith(github.ref, 'refs/tags/') && '--config src-tauri/tauri.verify.conf.json' || '' }}
          # On a tag → create/append a GitHub Release with the bundles.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Workbooks Desktop __VERSION__' || '' }}
          # Same body on every matrix job (idempotent — tauri-action sets it once).
          # Leads with the one-line CLI install so the release page teaches it.
          releaseBody: |
            ### Install

            ```sh
            curl -fsSL https://workbooks.sh/install.sh | sh
            ```

            Or download a bundle below. On first launch the app's wizard connects an
            engine (a local microVM via krunvm, or a cloud engine) — optional;
            Workbooks runs offline without one.
          releaseDraft: true
          prerelease: false

      # Manual (non-tag) runs: upload the bundles as artifacts so each platform's
      # build is downloadable + testable.
      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: workbooks-${{ matrix.platform }}-${{ matrix.target }}
          path: desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: ignore

  # Attach the curl|sh installer to the release so the script is downloadable
  # from the release page too (the canonical copy is served at
  # workbooks.sh/install.sh). Runs ONCE (not per-platform) after the matrix, on
  # tags only. The installer itself resolves the latest release at runtime, so it
  # doesn't need to be regenerated per version.
  installer:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the installer (POSIX syntax)
        run: sh -n web/lander/src/install.sh
      - name: Attach install.sh to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release tauri-action created is a draft; --clobber keeps re-runs
          # idempotent. cp to a stable asset name so the download URL is clean.
          cp web/lander/src/install.sh install.sh
          gh release upload "${GITHUB_REF_NAME}" install.sh --clobber --repo "${GITHUB_REPOSITORY}"
