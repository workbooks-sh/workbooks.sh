name: cli-release

# Build + ship the canonical `work` CLI (cli/, Zig). ONE Zig source → native binaries (per platform)
# + a wasm32-wasip1 module (the agent-sandbox target). Attached to a GitHub Release on tag `work-v*`,
# which the curl installer (web/cli.sh → workbooks.sh/cli.sh) downloads. Zig cross-compiles every
# target from one Linux runner — no per-OS matrix needed. ReleaseSmall: ~200KB native, ~108KB wasm.
on:
  push:
    tags: ["work-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version, e.g. 0.1.0"
        required: true

permissions:
  contents: write # create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the CLI needs no submodules (wasm-video is the engine's)

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cross-build native + wasm (ReleaseSmall)
        working-directory: reactor
        run: |
          set -eu
          # asset-name : zig-target  (asset names match web/cli.sh's work-${os}-${arch})
          for pair in \
            "darwin-arm64:aarch64-macos" \
            "darwin-x64:x86_64-macos" \
            "linux-arm64:aarch64-linux" \
            "linux-x64:x86_64-linux"; do
            name="${pair%%:*}"; tgt="${pair##*:}"
            echo "→ work-$name ($tgt)"
            zig build -Dtarget="$tgt" -Doptimize=ReleaseSmall
            cp zig-out/bin/work "work-$name"
          done
          echo "→ work-wasm32-wasip1.wasm (the agent-sandbox module)"
          zig build -Dwasm -Doptimize=ReleaseSmall
          cp zig-out/bin/work.wasm "work-wasm32-wasip1.wasm"
          ls -la work-*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('work-v{0}', github.event.inputs.version) || github.ref_name }}
          files: reactor/work-*
          fail_on_unmatched_files: true
