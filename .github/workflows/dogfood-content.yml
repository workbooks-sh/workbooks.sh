# dogfood-content — push CONTENT updates to the live nexus the way a CUSTOMER would: a `git push` to
# the nexus's own git remote (`/git/<workspace>.git`), which checks the files out + hot-reloads
# (Nexus.Server.remount) and folds the change into each workspace's jj op-log. NO image rebuild —
# content is decoupled from the runtime image (the baked copy is just the safety-net fallback; a pushed
# workspace overlays it and survives redeploys — Nexus.Server.rehydrate_checkouts). This is the
# dogfooding rule: we update our own surfaces the exact way we ask customers to update their apps.
# (The runtime IMAGE still ships via dogfood-deploy.yml — that instantiates the network, the one
# legitimate CI/GitHub path.)
#
# WORKSPACES: lander, cloud, docs — the three declared workspaces. Only the ones that changed are
# pushed (per-workspace, so one can't break the others). Manual dispatch pushes all three.
#
# AUTH: a `wbk_` access token minted in the dashboard (Nexus.ControlPlane.Token), stored as the repo
# secret WB_DOGFOOD_PUSH_TOKEN, sent as the git Basic-auth password — exactly a customer's credential.
#
# NOTE: a content push has no /health smoke gate (that's the image path). A bad push can break that one
# surface until re-pushed; the nexus stays up and other surfaces keep serving (a failed workbook unit
# fails bringup, it doesn't crash the runtime). Recover by pushing a fix. This is the customer contract.

name: dogfood-content

on:
  push:
    branches: [main]
    paths: ["dogfood/lander/**", "dogfood/cloud/**", "dogfood/docs/**"]
  workflow_dispatch: {}

jobs:
  # Which workspaces changed? Only push those (manual dispatch → all three).
  changed:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            lander: ['dogfood/lander/**']
            cloud: ['dogfood/cloud/**']
            docs: ['dogfood/docs/**']
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'list=["lander","cloud","docs"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=${{ steps.f.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  push:
    needs: changed
    if: needs.changed.outputs.list != '[]' && needs.changed.outputs.list != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ws: ${{ fromJSON(needs.changed.outputs.list) }}
    # Per-workspace group: a newer push of THIS workspace supersedes an in-flight one, but cloud/docs/
    # lander never cancel each other.
    concurrency:
      group: dogfood-content-${{ matrix.ws }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Hole 1 belt: a CLIENT-side check the slim nexus can't do (it has no JS toolchain, so client
      # blocks/views are render-passthrough). `node --check` parses every .js in the workspace — catches
      # a broken dashboard view that would otherwise only fail in the browser. Cheap, no toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS syntax check (${{ matrix.ws }})
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error::JS syntax error in $f"; exit 1; }
            n=$((n+1))
          done < <(find "dogfood/${{ matrix.ws }}" -name '*.js' -not -path '*/node_modules/*')
          echo "✓ $n .js file(s) parse cleanly"

      - name: Push ${{ matrix.ws }} → nexus (hot-reload, no image build)
        env:
          TOKEN: ${{ secrets.WB_DOGFOOD_PUSH_TOKEN }}
          WS: ${{ matrix.ws }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::WB_DOGFOOD_PUSH_TOKEN not set — mint one in the dashboard (Settings) and add it as a repo secret."
            exit 1
          fi
          # Snapshot the workspace into a fresh single commit and force-push it to the nexus. The nexus's
          # post-receive checks it out into the workspace + remounts + imports into jj → live in seconds.
          # (Snapshot, not subtree history — matches the nexus's jj/snapshot model; git-subtree isn't needed.)
          tmp="$(mktemp -d)"
          cp -a "dogfood/${WS}/." "$tmp"/
          cd "$tmp"
          git init -q -b main
          git config user.email "ci@workbooks.sh"
          git config user.name "workbooks-ci"
          git add -A
          git commit -q -m "deploy ${WS} @ ${GITHUB_SHA::7}"
          git push -f "https://x:${TOKEN}@workbooks.sh/git/${WS}.git" main
          echo "✅ pushed ${WS} to the nexus — hot-reload triggered (no image rebuild)"

      # Post-push LIVE SMOKE — the content equivalent of the image path's GET /health gate. The push
      # already landed (remount is async), so we poll the surface and fail the run RED if it stopped
      # serving (e.g. a pushed .work failed bringup). The nexus stays up + other surfaces serve; recover
      # by `jj undo` on that workspace (the op-log we made real) or pushing a fix. Reactive, not
      # preventive — the preventive gate is a pre-push `work check` (see the runtime TODO).
      # Hole 5a: probe a REAL endpoint, not just the SSR shell — a broken server block drops its routes
      # while the shell still serves 200, so the shell is a false-pass. lander/docs are static surfaces
      # (the shell IS the content → 200). cloud is probed at a server-block route (/cloud/inference): if
      # the cloud server unit didn't compile/install, that route is 404, not the expected status. We probe
      # it ANONYMOUSLY and now expect 403 (wb-kodp): the declarative default-deny router enforces the
      # route's :user policy at the dispatch chokepoint, so 403 proves BOTH that the unit installed AND
      # that authorization is live — a missing unit is 404, a broken gate would be 200/500. Stronger than
      # the old anon-200 (which only passed because the route was wide open). (Pre-receive gate already
      # rejects non-compiling pushes; this is the backstop for served-but-broken / gate-unavailable.)
      - name: Smoke ${{ matrix.ws }} (real endpoint)
        run: |
          set -euo pipefail
          case "${{ matrix.ws }}" in
            lander) path="/";              want="200" ;;
            docs)   path="/docs/";         want="200" ;;
            cloud)  path="/cloud/inference"; want="403" ;;   # anon → 403 (route installed + default-deny enforcing); 404 = unit didn't install
            *)      path="/${{ matrix.ws }}/"; want="200" ;;
          esac
          ok=
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://workbooks.sh${path}" || true)"
            if [ "$code" = "$want" ]; then ok=1; echo "✅ ${path} → ${code} after push"; break; fi
            echo "… ${path} → ${code} (want ${want}; waiting for hot-reload, attempt $i)"; sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::${{ matrix.ws }} (${path}) did not return ${want} after push — the pushed content likely broke bringup. Roll back with 'jj undo' on that workspace or push a fix; the nexus + sibling surfaces are unaffected."
            exit 1
          fi
