# dogfood-deploy — the ONE gated path to prod for the cloud dashboard (wb-dogfood).
#
# WHY: deploys used to be N agents each running `fly deploy` from a laptop. A release-only boot crash
# (e.g. wb-o5ng: Task.start_link/3 in the Bandit acceptor — invisible to `mix test`, only shows in a
# `mix release`) was discovered by OUTAGING prod, repeatedly. This pipeline builds the real image and
# BOOTS it behind GET /health BEFORE any deploy, so the breakage goes red in CI, not in production.
#
# SPLIT BUILD (the reason a cloud/lander edit is now fast):
#   * dogfood-base (dogfood/deploy/Dockerfile.base) — the Elixir release + litestream. SLOW (~6 min) but
#     rebuilt ONLY when the runtime changes (nexus/** or the deploy Dockerfiles). Pushed to ghcr.
#   * the deployed image (dogfood/deploy/Dockerfile) — `FROM dogfood-base + COPY dogfood`. A CONTENT-only
#     change rebuilds just that one COPY layer → seconds, not minutes. The whole BEAM release is reused.
#
# FLOW: changes(paths) → [base, only if runtime changed] → build-smoke(thin image → boot → /health →
#       push exact image) → deploy(flyctl). Superseded BUILDS cancel (bursts don't queue); an in-flight
#       DEPLOY never cancels (its own group). fly.toml's [[http_service.checks]] is the cutover backstop.
#
# THE LINE: this is OUR cloud ops (wb-dogfood = our workbook deployed like a customer), not the open
# standard. Generic mechanism only; nothing customer-specific leaks into the runtime.

name: dogfood-deploy

on:
  push:
    branches: [main]
    # The workspace surfaces (lander/cloud/docs) deploy via push-to-nexus (dogfood-content.yml), NOT an
    # image rebuild — exclude them so a content edit takes the fast push path. Everything else in dogfood/
    # (manifest, mobile, login, deploy/) + the runtime (nexus/) still goes through the image.
    paths: ["dogfood/**", "!dogfood/lander/**", "!dogfood/cloud/**", "!dogfood/docs/**", "nexus/**", ".github/workflows/dogfood-deploy.yml"]
  pull_request:
    paths: ["dogfood/**", "!dogfood/lander/**", "!dogfood/cloud/**", "!dogfood/docs/**", "nexus/**", ".github/workflows/dogfood-deploy.yml"]
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Force a rebuild of dogfood-base (the runtime layer)"
        type: boolean
        default: false

env:
  FLY_IMAGE: registry.fly.io/wb-dogfood
  BASE_IMAGE: ghcr.io/workbooks-sh/dogfood-base
  # The compilers+kits layer the base COPYs the agent kit wasm from (/compilers/kits). Published by
  # compilers-image.yml (compilers package + nexus/kits/*.wasm) to a CI-owned package.
  COMPILERS_REF: ghcr.io/workbooks-sh/compilers-kits:latest
  FLY_APP: wb-dogfood

jobs:
  # What changed? The runtime layer (dogfood-base) only needs rebuilding when nexus/ or the deploy
  # Dockerfiles change. A pure content edit (dogfood/cloud, dogfood/lander, …) skips the base build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.f.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            runtime:
              - 'nexus/**'
              - 'dogfood/deploy/Dockerfile.base'

  # Rebuild + push the runtime base ONLY when the runtime changed (or a manual force). Slow, rare.
  base:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_base) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # QUEUE (don't cancel): the base must always land. Under sustained concurrent nexus/ pushes,
    # cancel-in-progress STARVES the base build — each new commit kills the prior, so a runtime change
    # can never deploy. Queueing serializes them (each completes; newest deploys last). The layer cache
    # keeps each build fast, and build-smoke below still cancels for fast feedback.
    concurrency:
      group: dogfood-base
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push dogfood-base (runtime layer)
        run: |
          docker buildx build \
            --cache-from type=gha,scope=dogfood-base \
            --cache-to type=gha,mode=max,scope=dogfood-base \
            --build-arg "COMPILERS_REF=${COMPILERS_REF}" \
            --push \
            -t "${BASE_IMAGE}:${{ github.sha }}" \
            -t "${BASE_IMAGE}:latest" \
            -f dogfood/deploy/Dockerfile.base .

  # Build the thin (content) image on top of the base, boot it, require /health, then push the EXACT
  # image by sha. For a content-only change the base build was skipped → this is a single COPY layer.
  build-smoke:
    needs: [changes, base]
    if: ${{ always() && needs.changes.result == 'success' && (needs.base.result == 'success' || needs.base.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Cancel a superseded build the moment a newer commit lands — bursts don't stack into a serial queue.
    concurrency:
      group: dogfood-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3 # pull dogfood-base from ghcr
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # When the base was rebuilt this run, deploy on THAT exact runtime (base:sha); otherwise the
      # current published runtime (base:latest).
      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ needs.base.result }}" = "success" ]; then
            echo "ref=${BASE_IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${BASE_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build thin image (content layer on the runtime base)
        run: |
          docker buildx build \
            --build-arg "BASE=${{ steps.base.outputs.ref }}" \
            --load \
            -t "dogfood-ci:${{ github.sha }}" \
            -f dogfood/deploy/Dockerfile .

      - name: Smoke (boot + /health)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 4000:4000 \
            -e PORT=4000 -e WB_DATA=/srv/dogfood -e WB_NEXUS=dogfood \
            -e WB_CONTROL_PLANE=1 -e WB_FLY_ORG=personal \
            "dogfood-ci:${{ github.sha }}"
          ok=
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 http://localhost:4000/health >/dev/null 2>&1; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then echo "::error::container exited during boot"; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::wb-dogfood release failed to serve /health — NOT deploying (likely a release-only boot crash, see wb-o5ng)"
            docker logs smoke 2>&1 | tail -80 || true
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "✅ /health OK — release boots clean"
          docker rm -f smoke >/dev/null 2>&1 || true

      - name: Push smoked image (main, green only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DOGFOOD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_DOGFOOD_TOKEN secret not set — create one with: fly tokens create deploy -a wb-dogfood"
            exit 1
          fi
          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          flyctl auth docker
          docker tag "dogfood-ci:${{ github.sha }}" "$FLY_IMAGE:${{ github.sha }}"
          docker push "$FLY_IMAGE:${{ github.sha }}"
          echo "📦 pushed $FLY_IMAGE:${{ github.sha }}"

  # Own concurrency group, cancel-in-progress:false — an in-flight Fly deploy is NEVER interrupted, and
  # two green commits deploy in order (newest last → wins) instead of racing the single machine.
  deploy:
    needs: build-smoke
    # Explicit gate: run when build-smoke SUCCEEDED on a main push. Must include always() +
    # needs.build-smoke.result so a SKIPPED base job upstream doesn't trip GitHub's implicit success()
    # check and silently skip the deploy.
    if: ${{ always() && needs.build-smoke.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: dogfood-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # for dogfood/deploy/fly.toml
      - name: Deploy to wb-dogfood
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DOGFOOD_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          flyctl deploy -a "$FLY_APP" -c dogfood/deploy/fly.toml -i "$FLY_IMAGE:${{ github.sha }}" --ha=false
          echo "🚀 deployed $FLY_IMAGE:${{ github.sha }} to $FLY_APP"
