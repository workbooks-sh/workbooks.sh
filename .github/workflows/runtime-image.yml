# Publish the runtime image to ghcr — by DOGFOODING the deploy-kit. CI does NOT
# hand-roll a build pipeline; it runs the same `wb deploy publish` we ship to
# users (the recipe — Dockerfile, tags, platforms, registry — lives in
# Workbooks.Deploy.Image, one source of truth). The desktop app likewise calls
# `wb deploy local`. CI only supplies the buildx driver + registry auth.
#
# PREREQUISITE: the runtime image pulls its in-sandbox compilers from the compilers
# layer (`COPY --from=compilers`). CI can't build that layer (the wasm compilers are
# gitignored artifacts from an hours-long provision chain), so a maintainer publishes
# it ONCE from a provisioned machine — and again only when the compilers change — via
# `wb deploy publish-compilers` (Workbooks.Deploy.Image.publish_compilers/1). Until
# then, the FROM ${COMPILERS_REF} pull below has nothing to fetch.
name: runtime-image

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "deploy/Dockerfile.runtime"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

concurrency:
  group: runtime-image-${{ github.ref }}
  # QUEUE, don't cancel: two autoloops push runtime/ every few minutes, and the
  # multi-arch emulated build is ~12 min — cancel-in-progress meant a build NEVER
  # finished (the image never published). Queuing guarantees one completes, then
  # the next runs; :latest always advances.
  cancel-in-progress: false

jobs:
  publish:
    # MULTI-ARCH: amd64 (most cloud hosts) + arm64 (mac-first local krunvm). Built on the arm64
    # runner with QEMU emulating amd64 — ~12 min, and both arches are needed for a replicable
    # local+cloud deploy. (A native per-arch matrix would be faster but isn't worth the merge
    # complexity at this cadence; queue-not-cancel above guarantees :latest always advances.)
    runs-on: ubuntu-24.04-arm
    env:
      WB_PLATFORMS: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU registers binfmt handlers so the arm64 runner can build the amd64 image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Registry auth (the deploy-kit shells `docker buildx --push`).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy-kit lives in the Elixir runtime — run its publish verb.
      - uses: erlef/setup-beam@v1
        # The arm runner reports ImageOS=ubuntu24-arm64, which setup-beam can't map;
        # pin the OS family (it has arm64 OTP for ubuntu24).
        env:
          ImageOS: ubuntu24
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: wb deploy publish (dogfood)
        working-directory: runtime
        run: |
          mix deps.get
          mix run --no-start -e 'case Workbooks.Deploy.Image.publish() do {:ok, m} -> IO.puts(m); {:error, e} -> IO.puts(:stderr, e); System.halt(1) end'
